<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="توصيل أنس">
<link rel="manifest" href="driver-manifest.webmanifest">
<link rel="icon" href="icons/drv-192.png">
<link rel="apple-touch-icon" href="icons/drv-apple-180.png">
<title>توصيل — صيدلية د. أنس نحيلة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(15,23,42,.08);margin-bottom:14px}
.top h1{font-size:18px;margin:0}.top small{color:#64748b}
.top img{width:40px;height:40px;border-radius:10px}
.ghost{background:#e2e8f0;color:#0f172a;border:0;border-radius:12px;min-height:44px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.08)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;min-height:48px}
.go{width:100%;margin-top:16px;min-height:54px;border:0;border-radius:14px;background:#0f766e;color:#fff;font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.err{color:#dc2626;font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.hide{display:none!important}
.boot{text-align:center;color:#64748b;padding:60px 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="boot" class="boot">⏳ جاري التحميل…</div>

  <div id="login" class="hide">
    <div class="top"><div><h1>🛵 توصيل الصيدلية</h1><small>صيدلية د. أنس نحيلة</small></div><img src="icons/drv-192.png" alt=""></div>
    <div class="card">
      <label for="u">اسم الدخول</label><input id="u" dir="ltr" autocapitalize="none" autocomplete="username" spellcheck="false" placeholder="drv1">
      <label for="p">الرقم السري</label><input id="p" type="password" dir="ltr" autocomplete="current-password">
      <button class="go" id="lb">دخول</button>
      <div class="err" id="le"></div>
    </div>
  </div>

  <div id="app" class="hide">
    <div class="top"><div><h1>🛵 توصيل الصيدلية</h1><small>صيدلية د. أنس نحيلة</small></div><button class="ghost" id="out">خروج</button></div>
    <div id="drvRoot"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// نفس مشروع المرتبات (pharmacy-payroll) — مفتاح الويب عام بطبيعته، والحماية في قواعد Firestore
const CFG = { apiKey: "AIzaSyCRumjMVIdmhgkQdFU35a4EDineIIjgfWE", authDomain: "pharmacy-payroll.firebaseapp.com", projectId: "pharmacy-payroll",
  storageBucket: "pharmacy-payroll.firebasestorage.app", messagingSenderId: "7198071549", appId: "1:7198071549:web:5068830994e6b073747c94" };
const DOMAIN = "anaspharmacy.com";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = initializeApp(CFG), auth = getAuth(app), db = getFirestore(app);

const show = id => ['boot', 'login', 'app'].forEach(x => $(x).classList.toggle('hide', x !== id));

$('lb').onclick = async () => {
  const u = $('u').value.trim().toLowerCase(), p = $('p').value; $('le').textContent = '';
  if (!u || !p) { $('le').textContent = 'اكتب اسم الدخول والرقم السري'; return; }
  $('lb').disabled = true;
  try { await signInWithEmailAndPassword(auth, `${u}@${DOMAIN}`, p); }
  catch (e) { $('le').textContent = e.code === 'auth/network-request-failed' ? 'مفيش نت' : 'اسم الدخول أو الرقم السري غلط'; }
  $('lb').disabled = false;
};
$('p').addEventListener('keydown', e => { if (e.key === 'Enter') $('lb').click(); });
$('out').onclick = () => signOut(auth);

let MOUNTED = false;
onAuthStateChanged(auth, async user => {
  if (!user) { MOUNTED = false; $('p').value = ''; show('login'); return; }
  let acct = null;
  try { const d = await getDoc(doc(db, 'driveraccts', user.uid)); if (d.exists() && d.data().active !== false) acct = d.data(); } catch (e) { }
  if (!acct) { await signOut(auth); show('login'); $('le').textContent = 'الحساب ده مش حساب مندوب (أو موقوف). كلّم المدير.'; return; }
  if (MOUNTED) return; MOUNTED = true;
  show('app');
  try { const m = await import('./sections/driver.js?v=2'); m.mountDriver($('drvRoot'), { db, driverName: acct.driverName, uid: user.uid }); }
  catch (e) { $('drvRoot').innerHTML = `<div class="card" style="color:#b91c1c">مقدرتش أحمّل الشاشة: ${esc(e.code || e.message)}</div>`; }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('driver-sw.js').catch(() => { });
</script>
</body>
</html>
