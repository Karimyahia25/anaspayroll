<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المخزون — صيدلية أنس نحيلة</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF4F1; --card:#FFFFFF; --ink:#12201B; --muted:#5F7369; --line:#E0E9E4;
  --green:#1F9B76; --green-deep:#15805F; --green-soft:#EDF7F2;
  --amber:#B0761F; --amber-soft:#FAF1DF; --red:#A32E1E; --red-soft:#FBE9E5;
  --blue:#2A6FB0; --blue-soft:#E9F1FA; --purple:#6B5BA8; --purple-soft:#EFEBF8;
  --shadow:0 1px 2px rgba(18,32,27,.05), 0 8px 24px -16px rgba(18,32,27,.28);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0D1512; --card:#15201B; --ink:#E7EFE9; --muted:#8FA79A; --line:#26342D;
  --green:#4FC79B; --green-deep:#8FE3C0; --green-soft:#123024;
  --amber:#E0B25A; --amber-soft:#2B2413; --red:#FF9483; --red-soft:#331C18;
  --blue:#7FB3E8; --blue-soft:#14232F; --purple:#A99AD8; --purple-soft:#1F1B2E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#0D1512; --card:#15201B; --ink:#E7EFE9; --muted:#8FA79A; --line:#26342D;
  --green:#4FC79B; --green-deep:#8FE3C0; --green-soft:#123024;
  --amber:#E0B25A; --amber-soft:#2B2413; --red:#FF9483; --red-soft:#331C18;
  --blue:#7FB3E8; --blue-soft:#14232F; --purple:#A99AD8; --purple-soft:#1F1B2E;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 8px}
h1,h2,.tabs button,.kv{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
h2{font-size:15.5px;font-weight:600;color:var(--green-deep);margin:0 0 14px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--green);flex:0 0 auto}
h3{font-size:14px;font-weight:600;margin:0 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0}
.card{--pad:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:var(--pad);margin-bottom:14px;box-shadow:var(--shadow)}
label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;font-weight:500}
input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
button{padding:11px 18px;border:0;border-radius:8px;background:var(--green);color:#fff;
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .15s,transform .06s}
button:hover{background:var(--green-deep)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.full{width:100%;margin-top:18px}
button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
button.ghost:hover{background:var(--green-soft);border-color:var(--green)}
button.sm{padding:6px 13px;font-size:13px}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px}
.ok{color:var(--green);font-size:13.5px;margin-top:10px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:13.5px;font-weight:600;color:var(--muted);
  padding:7px 14px;border-radius:8px;border:1px solid var(--line);transition:.15s}
.nav a:hover{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.nav a.on{color:#fff;background:var(--green);border-color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
th,td{padding:9px 11px;text-align:center;white-space:nowrap}
th{background:var(--green-soft);color:var(--green-deep);font-weight:600;font-size:12.5px;
  position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:var(--green)}
td{border-top:1px solid var(--line)}
table tr:hover td{background:var(--green-soft)}
td.name{text-align:right;white-space:normal;min-width:190px}
.tw{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:9px}
.tabs{display:flex;gap:2px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;color:var(--muted);border:0;border-radius:0;
  padding:9px 14px;font-size:13.5px;font-weight:500;position:relative}
.tabs button:hover{background:transparent;color:var(--ink)}
.tabs button::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;
  background:var(--green);border-radius:2px;transform:scaleX(0);transition:transform .2s}
.tabs button.on{color:var(--green);font-weight:600}
.tabs button.on::after{transform:scaleX(1)}
.hide{display:none}
.banner{background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  border-radius:9px;padding:11px 13px;font-size:13px;margin-bottom:12px;line-height:1.6}
.banner.bad{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.banner.good{background:var(--green-soft);color:var(--green-deep);border-color:color-mix(in srgb,var(--green) 35%,transparent)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:13.5px;transition:.15s}
.drop:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.drop.has{border-color:var(--green);color:var(--green-deep);background:var(--green-soft);border-style:solid}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 15px;border-right:3px solid var(--green)}
.k.d{border-right-color:var(--red)} .k.w{border-right-color:var(--amber)}
.k.b{border-right-color:var(--blue)} .k.p{border-right-color:var(--purple)}
.kl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.kv{font-size:20px;font-weight:700}
.ks{font-size:11.5px;color:var(--muted);margin-top:2px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px}
.set label{margin:0 0 4px}
.set input{padding:8px 11px;font-size:14px}
.mbox{background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 25%,transparent);
  border-radius:10px;margin-bottom:12px;overflow:hidden}
.mh{padding:10px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--green-deep);
  display:flex;justify-content:space-between;align-items:center}
.mb{padding:12px 16px;font-size:12.8px;line-height:1.85;display:none;background:var(--card)}
.mbox.open .mb{display:block}
.mb h5{margin:10px 0 3px;font-size:12.5px;color:var(--green-deep)}
.mb h5:first-child{margin-top:0}
.mb pre{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 11px;
  font-family:inherit;font-size:12.2px;white-space:pre-wrap;margin:3px 0;line-height:1.75}
.ctl{display:flex;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.ctl input[type=text]{flex:1;min-width:160px;padding:8px 12px;font-size:13.5px}
.ctl select{width:auto;padding:8px 11px;font-size:13.5px}
.big{font-weight:700;color:var(--red)}
.bigo{font-weight:700;color:var(--green-deep)}
.cnt{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<div class="wrap">

<div id="boot" class="card"><p class="sub">جاري التحميل…</p></div>

<div id="app" class="hide">
  <div class="card">
    <div class="hdr">
      <div>
        <h1>📦 إدارة المخزون</h1>
        <p class="sub" id="who"></p>
      </div>
      <div class="nav">
        <a href="index.html">المرتبات</a>
        <a href="stock.html" class="on">المخزون</a>
        <button class="ghost sm" onclick="doOut()">خروج</button>
      </div>
    </div>
  </div>

  <!-- ===== أدوات الأدمن ===== -->
  <div id="admTools" class="hide">
    <div class="card">
      <h2>رفع الملفات</h2>
      <div class="set" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">
        <div><label>تقرير المخزون <b style="color:var(--red)">*</b></label>
          <div class="drop" id="d_stock" onclick="f_stock.click()">اختر ملف المخزون</div>
          <input type="file" id="f_stock" class="hide" accept=".xlsx,.xls"></div>
        <div><label>حركة الأصناف <b style="color:var(--red)">*</b> <span class="sub">(تقدر تختار أكتر من ملف)</span></label>
          <div class="drop" id="d_mov" onclick="f_mov.click()">اختر ملفات الحركة</div>
          <input type="file" id="f_mov" class="hide" accept=".xlsx,.xls" multiple></div>
        <div><label>تقرير الإكسبير</label>
          <div class="drop" id="d_exp" onclick="f_exp.click()">اختياري</div>
          <input type="file" id="f_exp" class="hide" accept=".xlsx,.xls"></div>
        <div><label>مبيعات سنة سابقة (للموسمية)</label>
          <div class="drop" id="d_prev" onclick="f_prev.click()">اختياري — مرة واحدة</div>
          <input type="file" id="f_prev" class="hide" accept=".xlsx,.xls"></div>
      </div>
      <button class="full" id="btnRun" onclick="runAll()">حلّل المخزون</button>
      <div class="err" id="runErr"></div>

    <div class="card">
      <div class="hdr"><h2>إعدادات الحساب</h2>
        <button class="ghost sm" onclick="resetSet()">رجّع الافتراضي</button></div>
      <p class="sub" style="margin-bottom:12px">عدّل أي رقم واضغط "أعد الحساب" — القواعد بتتحفظ وبتطبّق على الجميع.</p>
      <div class="set" id="setBox"></div>
      <div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">
        <button onclick="saveSet()">احفظ الإعدادات</button>
        <button class="ghost" onclick="runAll(true)">أعد الحساب</button>
      </div>
      <div class="ok" id="setMsg"></div>
    </div>
  </div>

  <div id="results" class="hide">
    <div class="card">
      <div class="hdr">
        <div><h2 style="margin:0">النتائج</h2><p class="sub" id="meta"></p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="ghost sm" onclick="exportXls()">تصدير إكسل</button>
          <button class="sm hide" id="btnPub" onclick="publish()">نشر لصاحب الصيدلية</button>
        </div>
      </div>
      <div class="ok" id="pubMsg"></div>
    </div>
    <div class="card"><div class="kpis" id="kpis"></div></div>
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div id="pane"></div>
    </div>
  </div>

  <div id="empty" class="card hide">
    <div class="banner">لسه مفيش تحليل منشور. هيظهر هنا أول ما مدير الفرع ينشره.</div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = {
  apiKey: "AIzaSyCRumjMVIdmhgkQdFU35a4EDineIIjgfWE",
  authDomain: "pharmacy-payroll.firebaseapp.com",
  projectId: "pharmacy-payroll",
  storageBucket: "pharmacy-payroll.firebasestorage.app",
  messagingSenderId: "7198071549",
  appId: "1:7198071549:web:5068830994e6b073747c94"
};
const app = initializeApp(CFG);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = t => String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F0 = n => (Math.round(+n||0)).toLocaleString('en-US');
const EG = n => F0(n)+' ج.م';

let ROLE='emp', ME=null, RES=null, FILES={stock:null,mov:[],exp:null,prev:null};

/* ================= الإعدادات ================= */
const DEF = {
  win:90, deadDays:180, slowMin:3,
  maxA:21, maxB:45, maxC:45,
  minA:7, minB:10, minC:14,
  dealDays:35, dealGap:10,
  abcA:80, abcB:95,
  seasonPct:55, seasonMin:300
};
const SETDEF = [
  ['win','نافذة معدل البيع (يوم)'],
  ['deadDays','عتبة الميت (يوم)'],
  ['slowMin','مرات البيع للبطيء الشرعي'],
  ['maxA','حد أعلى A (يوم)'],['maxB','حد أعلى B (يوم)'],['maxC','حد أعلى C (يوم)'],
  ['minA','حد أدنى A (يوم)'],['minB','حد أدنى B (يوم)'],['minC','حد أدنى C (يوم)'],
  ['dealDays','مستهدف العروض (يوم)'],['dealGap','عتبة العرض (نقاط فوق وسيط الفئة)'],
  ['abcA','نهاية فئة A (%)'],['abcB','نهاية فئة B (%)'],
  ['seasonPct','عتبة الموسمية (%)'],['seasonMin','حد أدنى مبيعات الموسمية (ج.م)']
];
let SET = {...DEF};

function drawSet(){
  $('setBox').innerHTML = SETDEF.map(([k,l])=>
    `<div><label for="s_${k}">${l}</label><input type="number" id="s_${k}" value="${SET[k]}"></div>`).join('');
}
function readSet(){ SETDEF.forEach(([k])=>{ const v=parseFloat($('s_'+k).value); if(!isNaN(v)) SET[k]=v; }); }
window.resetSet = ()=>{ SET={...DEF}; drawSet(); $('setMsg').textContent='رجعت للافتراضي — اضغط احفظ.'; };
window.saveSet = async ()=>{
  readSet();
  try { await setDoc(doc(db,'settings','inventory'), SET); $('setMsg').textContent='اتحفظت ✓'; }
  catch(e){ $('setMsg').textContent='فشل الحفظ: '+e.message; }
};

/* ================= قراءة الإكسل ================= */
const norm = s => String(s==null?'':s).replace(/[<>*]/g,'').replace(/\s+/g,' ').trim();
function findCol(headers, cands){
  const H = headers.map(norm);
  for (const c of cands){ const i = H.indexOf(norm(c)); if(i>=0) return headers[i]; }
  for (const c of cands){ const n=norm(c);
    const i = H.findIndex(h=>h.includes(n)||n.includes(h)); if(i>=0) return headers[i]; }
  return null;
}
function readSheet(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = e => { try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(ws, {defval:null, raw:false, dateNF:'yyyy-mm-dd'}));
    }catch(err){ rej(err); } };
    r.onerror = ()=>rej(new Error('تعذر قراءة الملف'));
    r.readAsArrayBuffer(file);
  });
}
const num = v => { if(v==null) return 0; const n=parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; };
function toDate(v){
  if(v instanceof Date) return v;
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?new Date(d.y,d.m-1,d.d):null; }
  const s=String(v||'').trim(); if(!s) return null;
  let m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s); return isNaN(d)?null:d;
}
const DAY=864e5;

/* ================= المحرك ================= */
async function compute(){
  // ---- المخزون ----
  const sRows = await readSheet(FILES.stock);
  if(!sRows.length) throw new Error('ملف المخزون فاضي');
  const sh = Object.keys(sRows[0]);
  const cID=findCol(sh,['ID','كود الصنف','الكود']), cNm=findCol(sh,['Name','اسم الصنف','الصنف']),
        cPk=findCol(sh,['Packs','العبوات']), cUn=findCol(sh,['Units','الوحدات']),
        cCat=findCol(sh,['Category','الفئة','فئة التصنيف']),
        cCost=findCol(sh,['Cost Value','قيمة التكلفة']), cSale=findCol(sh,['Sales Value','قيمة البيع']),
        cMg=findCol(sh,['نسبة المكسب','Average Profit']), cVen=findCol(sh,['اخر مورد','Primary Vendor']),
        cWh=findCol(sh,['المخزن']);
  if(!cID||!cPk||!cCost) throw new Error('ملف المخزون ناقص أعمدة أساسية (ID / العبوات / قيمة التكلفة)');
  const items=new Map();
  for(const r of sRows){
    if(cWh && /هالك/.test(String(r[cWh]||''))) continue;
    const id=num(r[cID]); if(!id) continue;
    items.set(id,{ id, name:String(r[cNm]||'').trim()||('#'+id), cat:String(r[cCat]||'—').trim(),
      packs:num(r[cPk]), units:cUn?num(r[cUn]):0, cost:num(r[cCost]), sale:cSale?num(r[cSale]):0,
      margin:cMg?num(r[cMg]):0, vendor:cVen?String(r[cVen]||''):'' });
  }

  // ---- حركة الأصناف ----
  let mov=[];
  for(const f of FILES.mov){
    const rows=await readSheet(f); if(!rows.length) continue;
    const h=Object.keys(rows[0]);
    const mID=findCol(h,['ID','كود الصنف']), mDt=findCol(h,['التاريخ']), mOp=findCol(h,['العملية']),
          mTot=findCol(h,['الأجمالى','الاجمالى','الإجمالي','المجموع']), mPk=findCol(h,['العبوات','الكمية']),
          mWh=findCol(h,['المخزن']);
    if(!mID||!mDt||!mOp||!mTot) throw new Error('ملف حركة الأصناف لازم يكون فيه: ID، التاريخ، العملية، الأجمالى');
    for(const r of rows){
      if(mWh && /هالك/.test(String(r[mWh]||''))) continue;
      const d=toDate(r[mDt]); if(!d) continue;
      mov.push({ id:num(r[mID]), t:d.getTime(), op:String(r[mOp]||'').trim(),
                 val:num(r[mTot]), pk:mPk?num(r[mPk]):0 });
    }
  }
  if(!mov.length) throw new Error('مفيش بيانات حركة صالحة');
  // إزالة التكرار (لو الملفات متداخلة)
  const seen=new Set(); const mv=[];
  for(const m of mov){ const k=m.id+'|'+m.t+'|'+m.op+'|'+m.val+'|'+m.pk;
    if(!seen.has(k)){ seen.add(k); mv.push(m); } }
  mov=mv;
  const ref = Math.max(...mov.map(m=>m.t));
  const minT = Math.min(...mov.map(m=>m.t));
  const spanDays = Math.round((ref-minT)/DAY)+1;

  const isSale = o=>/^مبيعات$/.test(o), isRet = o=>/مرتجع مبيعات/.test(o), isBuy = o=>/^مشتريات$/.test(o);
  const w1 = ref - (SET.win-1)*DAY, w2 = ref - (SET.deadDays-1)*DAY;
  const agg = new Map();
  const G = id => { let a=agg.get(id); if(!a){ a={n1:0,n2:0,freq:0,lastSale:0,lastBuy:0,allVal:0,allPk:0}; agg.set(id,a);} return a; };
  for(const m of mov){
    const a=G(m.id);
    if(isSale(m.op)||isRet(m.op)){
      if(m.t>=w1) a.n1+=m.val;
      if(m.t>=w2) a.n2+=m.val;
      a.allVal+=m.val;
      if(isSale(m.op)){ a.freq++; a.allPk+=Math.abs(m.pk); if(m.t>a.lastSale) a.lastSale=m.t; }
      else a.allPk-=Math.abs(m.pk);
    } else if(isBuy(m.op)){ if(m.t>a.lastBuy) a.lastBuy=m.t; }
  }

  // ---- الموسمية ----
  const season=new Map();
  let seasonBase=null;
  if(FILES.prev){
    const rows=await readSheet(FILES.prev);
    if(rows.length){
      const h=Object.keys(rows[0]);
      const pID=findCol(h,['كود الصنف','ID']), pDt=findCol(h,['التاريخ']), pV=findCol(h,['المجموع','الأجمالى','الاجمالى']);
      if(pID&&pDt&&pV){
        const tot=new Map(), sd=new Map(); let T=0,S=0;
        for(const r of rows){
          const d=toDate(r[pDt]); if(!d) continue;
          const id=num(r[pID]), v=num(r[pV]); if(!id) continue;
          tot.set(id,(tot.get(id)||0)+v); T+=v;
          const mo=d.getMonth()+1;
          if(mo>=9){ sd.set(id,(sd.get(id)||0)+v); S+=v; }
        }
        seasonBase = T? S/T*100 : null;
        for(const [id,t] of tot){
          const s=sd.get(id)||0;
          if(t>=SET.seasonMin && s/t*100>SET.seasonPct) season.set(id,{pct:s/t*100, val:s});
        }
      }
    }
  }

  // ---- وسيط الهامش لكل فئة (لكشف العروض) ----
  const byCat=new Map();
  for(const it of items.values()){ if(!byCat.has(it.cat)) byCat.set(it.cat,[]); byCat.get(it.cat).push(it.margin); }
  const catMed=new Map();
  for(const [c,arr] of byCat){ const a=arr.slice().sort((x,y)=>x-y); catMed.set(c, a[Math.floor(a.length/2)]||0); }

  // ---- التصنيف ----
  const all=[];
  for(const it of items.values()){
    const a=agg.get(it.id)||{n1:0,n2:0,freq:0,lastSale:0,lastBuy:0,allVal:0,allPk:0};
    const o={...it, n1:a.n1, n2:a.n2, freq:a.freq,
      lastSale:a.lastSale, daysIdle:a.lastSale?Math.round((ref-a.lastSale)/DAY):null,
      allVal:a.allVal, allPk:a.allPk,
      deal: it.margin >= (catMed.get(it.cat)||0) + SET.dealGap,
      winter: season.has(it.id), seasonPct: season.get(it.id)?.pct ?? null,
      seasonVal: season.get(it.id)?.val ?? 0 };
    o.hasStock = o.packs>0 || o.units>0;
    o.daily = (o.n1/SET.win) * (1 - o.margin/100);
    all.push(o);
  }
  const live = all.filter(o=>o.hasStock && o.cost>0);
  const bad  = all.filter(o=>o.hasStock && o.cost<=0);

  // ABC على النشط
  const act = live.filter(o=>o.n1>0).sort((x,y)=>y.n1-x.n1);
  const tot1 = act.reduce((s,o)=>s+o.n1,0);
  let cum=0;
  for(const o of act){ cum+=o.n1; const p=tot1?cum/tot1*100:0;
    o.abc = p<=SET.abcA?'A' : p<=SET.abcB?'B':'C'; }
  const MX={A:SET.maxA,B:SET.maxB,C:SET.maxC}, MN={A:SET.minA,B:SET.minB,C:SET.minC};
  for(const o of act){
    o.max = o.deal ? Math.max(MX[o.abc], SET.dealDays) : MX[o.abc];
    o.min = MN[o.abc];
    o.dsi = o.daily>0 ? o.cost/o.daily : null;
    o.excess = Math.max(0, o.cost - o.daily*o.max);
    o.short  = Math.max(0, o.daily*o.min - o.cost);
    o.xPacks = Math.floor(o.packs * (o.excess/o.cost));
    o.nPacks = Math.ceil(o.packs * (o.short/o.cost)) || (o.short>0?1:0);
    o.cls = (o.excess>0 && o.xPacks>=1) ? 'فائض' : (o.short>0 ? 'خطر نفاد' : 'صحي');
    if(o.cls!=='فائض'){ o.excess=0; o.xPacks=0; }
    if(o.winter && o.cls==='فائض'){ o.cls='موسمي'; o.excess=0; o.xPacks=0; }
  }
  const idle = live.filter(o=>o.n1<=0);
  for(const o of idle){
    o.abc='—'; o.dsi=null; o.excess=0; o.short=0; o.xPacks=0; o.nPacks=0;
    o.cls = o.winter ? 'موسمي' : (o.n2>0 ? 'تحت المراقبة' : (o.freq>=SET.slowMin ? 'بطيء شرعي' : 'ميت'));
  }
  for(const o of bad){ o.cls='خطأ بيانات'; }

  const pool=[...act,...idle];
  const by = c => pool.filter(o=>o.cls===c);
  const dead=by('ميت'), watch=by('تحت المراقبة'), slow=by('بطيء شرعي'),
        seas=by('موسمي'), over=by('فائض'), shrt=by('خطر نفاد'), well=by('صحي');
  const A = act.filter(o=>o.abc==='A');

  // ---- الإكسبير ----
  let expiry=[], prio=[];
  if(FILES.exp){
    const rows=await readSheet(FILES.exp);
    if(rows.length){
      const h=Object.keys(rows[0]);
      const eID=findCol(h,['ID','كود الصنف']), eNm=findCol(h,['اسم الصنف','الصنف','Name']),
            eDt=findCol(h,['الصلاحية الفعلية','الصلاحية','تاريخ الصلاحية']),
            eV=findCol(h,['القيمة']), ePk=findCol(h,['العبوات']), eCat=findCol(h,['فئة التصنيف','Category']),
            eWh=findCol(h,['المخزن']);
      const deadIds=new Set(dead.map(o=>o.id));
      for(const r of rows){
        if(eWh && /هالك/.test(String(r[eWh]||''))) continue;
        const id=num(r[eID]);
        const rec={ id, name:String(r[eNm]||'').trim(), cat:String(r[eCat]||'—'),
          exp:String(r[eDt]||''), packs:ePk?num(r[ePk]):0, val:eV?num(r[eV]):0, dead:deadIds.has(id) };
        expiry.push(rec); if(rec.dead) prio.push(rec);
      }
      expiry.sort((a,b)=>String(a.exp).localeCompare(String(b.exp)));
      prio.sort((a,b)=>String(a.exp).localeCompare(String(b.exp)));
    }
  }

  const sum = (arr,f) => arr.reduce((s,o)=>s+(f(o)||0),0);
  const stockCost = sum(live,o=>o.cost), stockSale = sum(live,o=>o.sale);
  const annual = sum(act,o=>o.daily)*365;
  const k = {
    ref: new Date(ref).toISOString().slice(0,10),
    span: spanDays, items: live.length,
    stockCost, stockSale,
    turnover: stockCost? annual/stockCost : 0,
    days: stockCost&&annual? 365/(annual/stockCost) : 0,
    deadN:dead.length, deadC:sum(dead,o=>o.cost),
    watchN:watch.length, watchC:sum(watch,o=>o.cost),
    slowN:slow.length, slowC:sum(slow,o=>o.cost),
    seasN:seas.length, seasC:sum(seas,o=>o.cost),
    overN:over.length, overC:sum(over,o=>o.excess),
    shortN:shrt.length, shortC:sum(shrt,o=>o.short),
    wellN:well.length, badN:bad.length, dealN:act.filter(o=>o.deal).length,
    An:A.length, Ashare: tot1? sum(A,o=>o.n1)/tot1*100 : 0, Aval:sum(A,o=>o.n1),
    expN:expiry.length, expV:sum(expiry,o=>o.val),
    prioN:prio.length, prioV:sum(prio,o=>o.val),
    free: sum(dead,o=>o.cost)+sum(over,o=>o.excess),
    seasonBase
  };
  return {k, set:{...SET}, A, dead, watch, slow, seas, over, short:shrt, well, bad, expiry, prio};
}

function tbl(rows, cols, opts={}){
  let data = rows.slice();
  const id='t'+Math.random().toString(36).slice(2,8);
  const head = cols.map((c,i)=>`<th data-i="${i}">${c[1]}</th>`).join('');
  const body = () => data.map(r=>'<tr>'+cols.map(c=>{
    let v=r[c[0]], k=c[2]||'';
    if(k==='m') return `<td class="num">${v==null?'—':EG(v)}</td>`;
    if(k==='n') return `<td class="num">${v==null?'—':F0(v)}</td>`;
    if(k==='big') return `<td class="num"><span class="big">${F0(v)}</span></td>`;
    if(k==='bigo') return `<td class="num"><span class="bigo">${F0(v)}</span></td>`;
    if(k==='name') return `<td class="name">${esc(v)}</td>`;
    if(k==='b') return `<td>${v?'نعم':'لا'}</td>`;
    return `<td>${v==null?'—':esc(v)}</td>`;
  }).join('')+'</tr>').join('');
  setTimeout(()=>{
    const t=$(id); if(!t) return;
    let sc=null, sd=true;
    t.querySelectorAll('th').forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i, key=cols[i][0];
      sd = sc===key ? !sd : true; sc=key;
      data.sort((x,y)=>{ let a=x[key],b=y[key];
        if(typeof a==='string'||typeof b==='string'){ a=String(a??''); b=String(b??'');
          return sd?a.localeCompare(b,'ar'):b.localeCompare(a,'ar'); }
        a=a??-Infinity; b=b??-Infinity; return sd?a-b:b-a; });
      t.querySelector('tbody').innerHTML=body();
    });
    const s=$(id+'_s'), f=$(id+'_f');
    const ap=()=>{ const q=(s?.value||'').trim().toLowerCase(), fv=f?.value||'';
      data = rows.filter(r=>(!q||String(r.name||'').toLowerCase().includes(q)||String(r.id).includes(q))
                         && (!fv||String(r[opts.fkey])===fv));
      t.querySelector('tbody').innerHTML=body(); };
    if(s) s.oninput=ap; if(f) f.onchange=ap;
  },0);
  const filt = opts.fkey ? `<select id="${id}_f"><option value="">الكل</option>${
    [...new Set(rows.map(r=>r[opts.fkey]))].filter(Boolean).sort().map(v=>`<option>${esc(v)}</option>`).join('')}</select>` : '';
  return `<div class="ctl"><input type="text" id="${id}_s" placeholder="ابحث بالاسم أو الكود…">${filt}</div>
    <div class="cnt">${rows.length} صنف</div>
    <div class="tw"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body()}</tbody></table></div>`;
}

  const id='m'+Math.random().toString(36).slice(2,8);

  return `<div class="mbox" id="${id}"><div class="mh">📘 ${title} — اضغط للعرض<span>▾</span></div>
    <div class="mb"><h5>الغرض</h5><div>${purpose}</div>

}

    'مفيش تصرف مطلوب — للمراجعة والاطمئنان بس.')
    + tbl(R.well, [['id','الكود'],['name','الصنف','name'],['abc','ABC'],['packs','عبوات','n'],
        ['cost','التكلفة','m'],['dsi','تغطية','n'],['min','أدنى','n'],['max','أعلى','n']], {fkey:'abc'});
  else if(CUR==='prio') p.innerHTML = mbox('إزاي اتحسبت الأولوية القصوى؟',
    'أخطر قايمة: أصناف ميتة وكمان صلاحيتها قربت — احتمال بيعها قبل الانتهاء شبه معدوم.',
    'تقاطع بين قايمتين:\n(قايمة "ميت")  ∩  (تقرير الإكسبير)',
    'قرار فوري: إرجاع للمورد (الأفضل) ← تصفية بخصم ← تحويل لفرع تاني.')
    + (R.prio.length ? tbl(R.prio, [['id','الكود'],['name','الصنف','name'],['cat','الفئة'],
        ['exp','الصلاحية'],['packs','عبوات','n'],['val','القيمة','m']])
       : '<div class="banner">مفيش تقاطع — ارفع تقرير الإكسبير عشان الكشف ده يشتغل.</div>');
  else if(CUR==='exp') p.innerHTML = mbox('الإكسبير',
    'كل الأصناف اللي صلاحيتها بتنتهي، مرتبة بالأقرب انتهاءً.',
    'من تقرير الصلاحيات مباشرة (مش محسوب).\nعمود "ميت؟" بمقارنة كل صنف بقايمة الميت.',
    '"ميت؟"=نعم ← تاب أولوية قصوى وتصرّف فورًا.\n"ميت؟"=لا ← طبّق FEFO: الأقرب انتهاءً يتباع الأول.')
    + (R.expiry.length ? tbl(R.expiry, [['id','الكود'],['name','الصنف','name'],['cat','الفئة'],
        ['exp','الصلاحية'],['packs','عبوات','n'],['val','القيمة','m'],['dead','ميت؟','b']])
       : '<div class="banner">مفيش ملف إكسبير مرفوع.</div>');
  else if(CUR==='bad') p.innerHTML = mbox('أخطاء البيانات',
    'أصناف رصيدها أو قيمتها سالبة في النظام — مستحيل واقعيًا ومعناه خطأ تسجيل.',
    'أي صنف قيمة مخزونه ≤ صفر بيتشال من كل التحاليل،\nلأن وجوده بيلخبط حسابات التغطية.',
    'راجعها مع النظام: غالبًا بيع اتسجل بدون ما البضاعة تتدخل، أو جرد ناقص.')
    + (R.bad.length ? tbl(R.bad, [...B,['sale','سعر البيع','m']]) : '<div class="banner good">مفيش أخطاء ✓</div>');
}

function render(){
  $('results').classList.remove('hide');
  $('kpis').innerHTML = KPI(RES.k).map(([l,v,s,c])=>
    `<div class="k ${c}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`).join('');
  $('meta').textContent = `آخر حركة: ${RES.k.ref} · ${F0(RES.k.items)} صنف · معدل البيع على ${RES.set.win} يوم · عتبة الميت ${RES.set.deadDays} يوم`;
  drawTabs(); drawPane();
}

window.runAll = async (useSaved=false)=>{
  const e=$('runErr'); e.textContent='';
  if(!FILES.stock || !FILES.mov.length){ e.textContent='لازم ترفع تقرير المخزون وحركة الأصناف على الأقل.'; return; }
  readSet();
  $('btnRun').disabled=true; $('btnRun').textContent='بيحسب…';
  try{ RES = await compute(); render(); $('btnPub').classList.remove('hide'); }
  catch(err){ e.textContent='خطأ: '+err.message; }
  $('btnRun').disabled=false; $('btnRun').textContent='حلّل المخزون';
};

/* ================= النشر والتصدير ================= */
const slim = (arr,n=250) => arr.slice(0,n).map(o=>({id:o.id,name:o.name,cat:o.cat,abc:o.abc??'—',
  packs:o.packs,units:o.units,cost:Math.round(o.cost),sale:Math.round(o.sale),margin:o.margin,
  n1:Math.round(o.n1),n2:Math.round(o.n2),freq:o.freq,daysIdle:o.daysIdle,vendor:o.vendor||'',
  dsi:o.dsi==null?null:Math.round(o.dsi),min:o.min??null,max:o.max??null,deal:!!o.deal,
  excess:Math.round(o.excess||0),xPacks:o.xPacks||0,short:Math.round(o.short||0),nPacks:o.nPacks||0,
  seasonPct:o.seasonPct==null?null:Math.round(o.seasonPct),seasonVal:Math.round(o.seasonVal||0),cls:o.cls}));

window.publish = async ()=>{
  if(!RES) return;
  const m=$('pubMsg'); m.textContent='بينشر…';
  try{
    await setDoc(doc(db,'inventory','latest'), {
      at:new Date().toISOString(), k:RES.k, set:RES.set,
      A:slim(RES.A,300), dead:slim(RES.dead), watch:slim(RES.watch), slow:slim(RES.slow),
      seas:slim(RES.seas), over:slim(RES.over,300), short:slim(RES.short), well:slim(RES.well,200),
      bad:slim(RES.bad), expiry:RES.expiry.slice(0,300), prio:RES.prio.slice(0,150)
    });
    m.textContent='اتنشر ✓ — صاحب الصيدلية يقدر يشوفه دلوقتي';
  }catch(err){ m.textContent='فشل النشر: '+err.message; }
};

window.exportXls = ()=>{
  if(!RES) return;
  const wb=XLSX.utils.book_new();
  const add=(name,rows,cols)=>{ if(!rows.length) return;
    const aoa=[cols.map(c=>c[1]), ...rows.map(r=>cols.map(c=>{
      const v=r[c[0]]; return typeof v==='boolean' ? (v?'نعم':'لا') : (v==null?'':v); }))];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name.slice(0,31)); };
  const K=RES.k;
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['المؤشر','القيمة'],
    ['آخر حركة',K.ref],['عدد الأصناف',K.items],
    ['المخزون (تكلفة)',Math.round(K.stockCost)],['المخزون (سعر بيع)',Math.round(K.stockSale)],
    ['معدل الدوران',+K.turnover.toFixed(1)],['أيام التغطية',Math.round(K.days)],
    ['رأس مال قابل للتحرير',Math.round(K.free)],
    ['فئة A — عدد',K.An],['فئة A — % من المبيعات',+K.Ashare.toFixed(0)],
    ['ميت — عدد',K.deadN],['ميت — تكلفة',Math.round(K.deadC)],
    ['تحت المراقبة — عدد',K.watchN],['تحت المراقبة — تكلفة',Math.round(K.watchC)],
    ['بطيء شرعي — عدد',K.slowN],['موسمي — عدد',K.seasN],
    ['فائض — عدد',K.overN],['فائض — قيمة الزيادة',Math.round(K.overC)],
    ['خطر نفاد — عدد',K.shortN],['خطر نفاد — قيمة النقص',Math.round(K.shortC)],
    ['صحي — عدد',K.wellN],['أخطاء بيانات',K.badN],
    ['إكسبير — عدد',K.expN],['أولوية قصوى — عدد',K.prioN],
    [],['الإعدادات المستخدمة',''],...SETDEF.map(([k,l])=>[l,RES.set[k]])
  ]), 'نظرة عامة');
  const B=[['id','الكود'],['name','الصنف'],['cat','الفئة'],['packs','عبوات'],['units','وحدات'],['cost','التكلفة']];
  add('فئة A',RES.A,[['id','الكود'],['name','الصنف'],['cat','الفئة'],['n1','مبيعات الفترة'],['packs','عبوات'],['cost','التكلفة'],['dsi','تغطية'],['margin','هامش %'],['cls','الحالة']]);
  add('فائض',RES.over,[['id','الكود'],['name','الصنف'],['abc','ABC'],['deal','عرض؟'],['packs','عبوات عندك'],['xPacks','عبوات زيادة'],['excess','قيمة الزيادة'],['dsi','تغطية'],['max','المستهدف'],['cost','تكلفة المخزون']]);
  add('خطر نفاد',RES.short,[['id','الكود'],['name','الصنف'],['abc','ABC'],['packs','عبوات عندك'],['nPacks','اطلب'],['short','قيمة النقص'],['dsi','تغطية'],['min','الحد الأدنى']]);
  add('ميت',RES.dead,[...B,['daysIdle','أيام ساكن'],['freq','مرات البيع'],['vendor','آخر مورد']]);
  add('تحت المراقبة',RES.watch,[...B,['n2','مبيعات الفترة'],['daysIdle','أيام ساكن']]);
  add('بطيء شرعي',RES.slow,[...B,['daysIdle','أيام ساكن'],['freq','مرات البيع']]);
  add('موسمي',RES.seas,[...B,['seasonPct','% الموسم'],['seasonVal','مبيعات الموسم']]);
  add('صحي',RES.well,[['id','الكود'],['name','الصنف'],['abc','ABC'],['packs','عبوات'],['cost','التكلفة'],['dsi','تغطية']]);
  add('أولوية قصوى',RES.prio,[['id','الكود'],['name','الصنف'],['cat','الفئة'],['exp','الصلاحية'],['packs','عبوات'],['val','القيمة']]);
  add('إكسبير',RES.expiry,[['id','الكود'],['name','الصنف'],['cat','الفئة'],['exp','الصلاحية'],['packs','عبوات'],['val','القيمة'],['dead','ميت؟']]);
  add('أخطاء بيانات',RES.bad,[...B,['sale','سعر البيع']]);
  XLSX.writeFile(wb, `تقرير_المخزون_${K.ref}.xlsx`);
};

/* ================= الملفات ================= */
const hook=(inp,drop,multi,key)=>{
  $(inp).onchange=e=>{
    const fs=[...e.target.files]; if(!fs.length) return;
    if(multi){ FILES[key]=fs; $(drop).textContent=fs.length+' ملف ✓'; }
    else { FILES[key]=fs[0]; $(drop).textContent=fs[0].name+' ✓'; }
    $(drop).classList.add('has');
  };
};
hook('f_stock','d_stock',false,'stock');
hook('f_mov','d_mov',true,'mov');
hook('f_exp','d_exp',false,'exp');
hook('f_prev','d_prev',false,'prev');

/* ================= الدخول ================= */
window.doOut = ()=>signOut(auth);
onAuthStateChanged(auth, async user=>{
  if(!user){ location.href='index.html'; return; }
  ME=user; ROLE='emp';
  try{ if((await getDoc(doc(db,'admins',user.uid))).exists()) ROLE='admin'; }catch(e){}
  if(ROLE==='emp'){ try{ if((await getDoc(doc(db,'viewers',user.uid))).exists()) ROLE='viewer'; }catch(e){} }
  if(ROLE==='emp'){ location.href='index.html'; return; }

  $('boot').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = ROLE==='admin' ? 'مدير الفرع' : 'اطلاع فقط';

  try{ const s=await getDoc(doc(db,'settings','inventory')); if(s.exists()) SET={...DEF,...s.data()}; }catch(e){}

  if(ROLE==='admin'){ $('admTools').classList.remove('hide'); drawSet(); }

  try{
    const d=await getDoc(doc(db,'inventory','latest'));
    if(d.exists()){
      const v=d.data();
      RES={k:v.k,set:v.set||SET,A:v.A||[],dead:v.dead||[],watch:v.watch||[],slow:v.slow||[],
           seas:v.seas||[],over:v.over||[],short:v.short||[],well:v.well||[],bad:v.bad||[],
           expiry:v.expiry||[],prio:v.prio||[]};
      render();
      if(ROLE==='admin') $('btnPub').classList.remove('hide');
    } else if(ROLE!=='admin') $('empty').classList.remove('hide');
  }catch(e){ if(ROLE!=='admin') $('empty').classList.remove('hide'); }
});
</script>
