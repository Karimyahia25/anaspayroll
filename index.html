<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرتبات صيدلية أنس نحيلة</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF4F1; --card:#FFFFFF; --ink:#12201B; --muted:#5F7369; --line:#E0E9E4;
  --green:#1F9B76; --green-deep:#15805F; --green-soft:#EDF7F2;
  --amber:#B0761F; --amber-soft:#FAF1DF; --red:#A32E1E; --red-soft:#FBE9E5;
  --shadow:0 1px 2px rgba(18,32,27,.05), 0 8px 24px -16px rgba(18,32,27,.28);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0D1512; --card:#15201B; --ink:#E7EFE9; --muted:#8FA79A; --line:#26342D;
  --green:#4FC79B; --green-deep:#8FE3C0; --green-soft:#123024;
  --amber:#E0B25A; --amber-soft:#2B2413; --red:#FF9483; --red-soft:#331C18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#0D1512; --card:#15201B; --ink:#E7EFE9; --muted:#8FA79A; --line:#26342D;
  --green:#4FC79B; --green-deep:#8FE3C0; --green-soft:#123024;
  --amber:#E0B25A; --amber-soft:#2B2413; --red:#FF9483; --red-soft:#331C18;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  font-size:15px; line-height:1.65; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 8px}

h1,h2,.net .v,.tabs button{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
h2{font-size:15.5px;font-weight:600;color:var(--green-deep);margin:0 0 14px;
   display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--green);flex:0 0 auto}
.sub{color:var(--muted);font-size:13px;margin:0}

.card{--pad:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:var(--pad);margin-bottom:14px;box-shadow:var(--shadow)}
/* شاشة الدخول: شريط أخضر زي لصقة الروشتة */
#login{overflow:hidden}
#login>h1{margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 0;padding:26px var(--pad) 5px;
  background:linear-gradient(160deg,var(--green) 0%,#2AAE86 100%);color:#fff;font-size:20px}
#login>.sub{margin:0 calc(var(--pad)*-1) 8px;padding:0 var(--pad) 22px;
  background:linear-gradient(160deg,#219E79 0%,#2AAE86 100%);color:rgba(255,255,255,.88)}
#login>label:first-of-type{margin-top:4px}

label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;font-weight:500}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

button{padding:11px 18px;border:0;border-radius:8px;background:var(--green);color:#fff;
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:background .15s,transform .06s}
button:hover{background:var(--green-deep)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.full{width:100%;margin-top:18px}
button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
button.ghost:hover{background:var(--green-soft);border-color:var(--green)}
button.sm{padding:6px 13px;font-size:13px}

.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px}
.ok{color:var(--green);font-size:13.5px;margin-top:10px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* ===== لوحة الصافي: على شكل إيصال ===== */
.net{position:relative;margin:18px 0 6px;padding:22px 18px 20px;text-align:center;
  background:var(--green-soft);border-radius:10px;
  border-top:2px dashed color-mix(in srgb,var(--green) 45%,transparent);
  border-bottom:2px dashed color-mix(in srgb,var(--green) 45%,transparent);
  animation:print .5s cubic-bezier(.2,.7,.3,1) both}
.net::before,.net::after{content:"";position:absolute;top:-9px;bottom:-9px;width:16px;
  background:radial-gradient(circle at 50% 0,var(--card) 8px,transparent 8px),
             radial-gradient(circle at 50% 100%,var(--card) 8px,transparent 8px)}
.net::before{inset-inline-start:-8px}
.net::after{inset-inline-end:-8px}
.net .v{font-size:38px;font-weight:600;color:var(--green);line-height:1.15;letter-spacing:-.02em;
  display:block;margin:2px 0 4px}
.net .l{font-size:12.5px;color:var(--muted)}
@keyframes print{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

/* ===== سطور المفردات بخط منقّط ===== */
.rows{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.row{position:relative;display:flex;justify-content:space-between;gap:12px;padding:8px 0;align-items:baseline}
.row::before{content:"";position:absolute;inset-inline:0;bottom:.62em;
  border-bottom:1px dotted var(--line)}
.row .k,.row .v{position:relative;background:var(--card);padding-inline:4px}
.row .k{color:var(--muted);font-size:13.5px}
.row .v{font-weight:600;white-space:nowrap}
.row.minus .v{color:var(--red)}
.row.plus .v{color:var(--green)}
.row.total{margin-top:8px;padding-top:12px;border-top:1.5px solid var(--ink)}
.row.total::before{display:none}
.row.total .k{color:var(--ink);font-weight:600;font-size:14.5px}
.row.total .v{font-size:17px}

.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line)}

/* ===== الجداول ===== */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
th,td{padding:9px 11px;text-align:center;white-space:nowrap}
th{background:var(--green-soft);color:var(--green-deep);font-weight:600;font-size:12.5px;
  position:sticky;top:0;z-index:1}
td{border-top:1px solid var(--line)}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:color-mix(in srgb,var(--paper) 45%,transparent)}
table tr:hover td{background:var(--green-soft)}
td.num{font-variant-numeric:tabular-nums}

.tag{display:inline-block;padding:2px 9px;border-radius:14px;font-size:11.5px;font-weight:600}
.tag.late{background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--amber-soft);color:var(--amber)}

/* ===== التبويبات ===== */
.tabs{display:flex;gap:2px;margin-bottom:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:transparent;color:var(--muted);border:0;border-radius:0;
  padding:9px 15px;font-size:14px;font-weight:500;position:relative}
.tabs button:hover{background:transparent;color:var(--ink)}
.tabs button::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;
  background:var(--green);border-radius:2px;transform:scaleX(0);transition:transform .2s ease}
.tabs button.on{color:var(--green);font-weight:600}
.tabs button.on::after{transform:scaleX(1)}

.hide{display:none}
.banner{background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  border-radius:9px;padding:11px 13px;font-size:13px;margin-bottom:12px;line-height:1.6}
.banner.bad{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:14px;transition:border-color .15s,background .15s,color .15s}
.drop:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}

.qitem{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:9px}
.qitem .meta{font-size:12px;color:var(--muted);margin-bottom:5px}
code{background:var(--green-soft);color:var(--green);padding:2px 7px;border-radius:5px;
  font-size:12.5px;font-family:"IBM Plex Sans Arabic",monospace;font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:14px 0 28px;letter-spacing:.01em}


/* ===== بطاقات الأرقام والرسومات ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  display:flex;flex-direction:column;gap:3px}
.stat.hi{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.stat .sl{font-size:12px;color:var(--muted)}
.stat .sv{font-family:"Readex Pro",sans-serif;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.stat.hi .sv{color:var(--green-deep)}
.stat .ss{font-size:11.5px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.bar-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.bar-head .bn{font-weight:500}
.bar-head .bv{color:var(--muted);font-variant-numeric:tabular-nums}
.bar-track{height:9px;border-radius:5px;background:var(--paper);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transform-origin:right center;
  animation:grow .55s cubic-bezier(.2,.7,.3,1) both}
.bar-note{font-size:11.5px;color:var(--muted);margin-top:3px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.chart{margin:10px 0 4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.spark{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ring{animation:ring .8s cubic-bezier(.2,.7,.3,1) both}
@keyframes ring{from{stroke-dasharray:0 999}}
.donut{display:flex;flex-direction:column;align-items:center;gap:4px}
.donut svg{max-width:150px}
.dlabel{font-size:12.5px;color:var(--muted);text-align:center}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:center}
@media (max-width:620px){.split{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}

@media (max-width:520px){
  .wrap{padding:14px 12px 4px}
  .card{--pad:16px;border-radius:11px}
  .net .v{font-size:32px}
  h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">

<div id="boot" class="card"><p class="sub">جاري التحميل…</p></div>

<div id="login" class="card hide">
  <h1>مرتبات صيدلية أنس نحيلة</h1>
  <p class="sub">ادخل بكود البصمة بتاعك</p>
  <label>كود الموظف</label>
  <input id="u" inputmode="numeric" placeholder="مثال: 38" autocomplete="off">
  <label>الرقم السري</label>
  <input id="p" type="password" autocomplete="off">
  <button class="full" onclick="doLogin()">دخول</button>
  <div class="err" id="loginErr"></div>
  <div class="note">مدير الفرع بيدخل بكلمة <code>admin</code>، وصاحب الصيدلية أو المراجع المالي باسم حسابه بدل الكود.</div>
</div>

<div id="emp" class="hide"></div>
<div id="adm" class="hide"></div>

<div class="foot">صيدلية أنس نحيلة — نظام المرتبات</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         createUserWithEmailAndPassword, updatePassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc,
         updateDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = {
  apiKey: "AIzaSyCRumjMVIdmhgkQdFU35a4EDineIIjgfWE",
  authDomain: "pharmacy-payroll.firebaseapp.com",
  projectId: "pharmacy-payroll",
  storageBucket: "pharmacy-payroll.firebasestorage.app",
  messagingSenderId: "7198071549",
  appId: "1:7198071549:web:5068830994e6b073747c94"
};
const DOMAIN = "anaspharmacy.com";
const app = initializeApp(CFG);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const F = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emailFor = code => `emp${code}@${DOMAIN}`;
const defPass = code => 'anas' + (1000 + Number(code));

/* ---------- تطبيع أسماء الأعمدة: الشيت ممكن يتعدل والتطبيق يفضل شغال ---------- */
const norm = s => String(s == null ? '' : s)
  .replace(/[\u064B-\u0652\u0640]/g, '')
  .replace(/[\u0623\u0625\u0622]/g, '\u0627')
  .replace(/\u0629/g, '\u0647')
  .replace(/\(.*?\)/g, '')
  .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, '')
  .toLowerCase();

const PAY_MAP = {};
[['كود الموظف','code'],['اسم الموظف','name'],['سعر الساعة الشهري','rate'],['معدل الساعة الفعلي','hourly'],
 ['الساعات الفعلية','hours'],['ساعات مرحلة','carried'],['أجر الساعات','wage'],['عدد التأخيرات','lates'],
 ['المعفاة','exempt'],['المخصومة بربع يوم','q'],['المخصومة بنص يوم','half'],['خصم التأخير','lateDed'],
 ['أثر التأخير على الساعات','lateHrsVal'],['مرات انصراف مبكر','early'],['خصم الانصراف المبكر','earlyDed'],
 ['أيام غياب بدون إذن','absDays'],['جزاء الغياب','absPen'],['جزاءات إدارية','adminPen'],
 ['إجمالي الخصومات','totalDed'],['إجمالي الحوافز','bonus'],['مسحوبات آجلة','adv'],
 ['صافي المستحق','net'],['أيام محتاجة مراجعة','flags']].forEach(([a,k]) => PAY_MAP[norm(a)] = k);

const DAY_MAP = {};
[['التاريخ','date'],['كود الموظف','code'],['حالة اليوم','state'],['ميعاد الحضور المعتمد','tin'],
 ['ميعاد الانصراف المعتمد','tout'],['بصمة الحضور','pin'],['بصمة الانصراف','pout'],
 ['الساعات المحتسبة','hours'],['دقائق التأخير','late'],['دقائق الانصراف المبكر','early'],
 ['معفى','exempt'],['نسبة خصم التأخير','pct'],['خصم التأخير','lateDed'],
 ['خصم الانصراف المبكر','earlyDed'],['ملاحظة','note'],['تنبيه','alert']].forEach(([a,k]) => DAY_MAP[norm(a)] = k);

const AR_D = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const d2 = n => String(n).padStart(2,'0');
const fmtDate = v => v instanceof Date ? `${d2(v.getDate())}/${d2(v.getMonth()+1)}` : (v || '');
const fmtTime = v => v instanceof Date ? `${d2(v.getHours())}:${d2(v.getMinutes())}` : (v || '');
const dow = v => v instanceof Date ? AR_D[(v.getDay())] : '';


/* SheetJS بيقرا التواريخ ناقصة ثواني (٢٣:٥٩:٥١ اليوم اللي قبله) بسبب فرق توقيت القاهرة التاريخي —
   بنقرّب أي تاريخ/وقت لأقرب دقيقة عشان اليوم يطلع صح. الأوقات نفسها مش بتتأثر. */
const fixDates = rows => (rows || []).map(r => r ? r.map(v => v instanceof Date
  ? new Date(Math.round(v.getTime() / 60000) * 60000) : v) : r);

function headerRow(rows, key){
  const k = norm(key);
  for (let i = 0; i < Math.min(rows.length, 12); i++)
    if ((rows[i] || []).some(c => norm(c) === k)) return i;
  return -1;
}

function parseBook(wb){
  const shName = n => wb.SheetNames.find(s => norm(s) === norm(n));
  const grid = n => { const s = wb.Sheets[shName(n)];
    return s ? fixDates(XLSX.utils.sheet_to_json(s, {header:1, raw:true, cellDates:true, defval:null})) : null; };

  const payG = grid('كشف_المرتب');
  if (!payG) throw new Error('مفيش شيت اسمه كشف_المرتب في الملف');
  const ph = headerRow(payG, 'كود الموظف');
  if (ph < 0) throw new Error('مش لاقي عمود "كود الموظف" في كشف المرتب');
  const phead = payG[ph];

  const guideG = grid('دليل_وافتراضات') || [];
  let ps = null, pe = null;
  guideG.forEach(r => (r || []).forEach((c, j) => {
    if (norm(c).includes(norm('تاريخ بداية الدورة'))) ps = r[j+1];
    if (norm(c).includes(norm('تاريخ نهاية الدورة'))) pe = r[j+1];
  }));
  const W = { h:0.35, i:0.25, p:0.20, c:0.20 };
  const RATES = { gen:0.075, xic:0.15, neb:0.10 };
  const pick = [['وزن المبيعات لكل ساعة عمل', v => W.h = v], ['وزن وسيط قيمة الفاتورة', v => W.i = v],
    ['وزن نسبة قيمة البوشينج', v => W.p = v], ['وزن نسبة تسجيل اسم العميل', v => W.c = v],
    ['عمولة البوشينج العامة', v => RATES.gen = v], ['عمولة XICLAVE', v => RATES.xic = v],
    ['عمولة NEBULA', v => RATES.neb = v]];
  guideG.forEach(r => (r || []).forEach((c, j) => {
    const t = norm(c); if (!t) return;
    pick.forEach(([lbl, set]) => { if (t === norm(lbl)){ const v = +r[j+1]; if (!isNaN(v) && v > 0) set(v); } });
  }));
  const toD = v => { if (v instanceof Date) return v;
    if (!v) return null;
    const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2]-1, +m[1]);
    const d = new Date(v); return isNaN(d) ? null : d; };
  ps = toD(ps); pe = toD(pe);
  const period = ps ? `${ps.getFullYear()}-${d2(ps.getMonth()+1)}` : 'unknown';
  const label = (ps && pe) ? `من ${fmtDate(ps)} إلى ${fmtDate(pe)}/${pe.getFullYear()}` : period;

  const jobs = {};
  const empG = grid('الموظفين');
  if (empG){
    const eh = headerRow(empG, 'كود الموظف');
    if (eh >= 0){
      const H = empG[eh];
      const ci = H.findIndex(c => norm(c) === norm('كود الموظف'));
      const ji = H.findIndex(c => norm(c) === norm('الوظيفة'));
      const si = H.findIndex(c => norm(c) === norm('الحالة'));
      const pi = H.findIndex(c => norm(c) === norm('اسم البائع في نظام الكاشير'));
      const ii = H.findIndex(c => norm(c) === norm('مشمول في تقييم المبيعات'));
      const mi = H.findIndex(c => norm(c) === norm('مستحق عمولة البوشينج'));
      for (let i = eh+1; i < empG.length; i++){
        const r = empG[i] || []; if (!r[ci]) continue;
        jobs[String(r[ci]).trim()] = { job: ji >= 0 ? r[ji] : '', status: si >= 0 ? r[si] : '',
          posName: pi >= 0 ? r[pi] : '', include: ii >= 0 ? r[ii] : '',
          comm: mi >= 0 ? r[mi] : (ii >= 0 ? r[ii] : '') };
      }
    }
  }

  const people = [];
  for (let i = ph+1; i < payG.length; i++){
    const r = payG[i] || [];
    const o = { extra: [] };
    let has = false;
    phead.forEach((h, j) => {
      if (h == null || h === '') return;
      const key = PAY_MAP[norm(h)];
      let v = r[j];
      const num = (v !== null && v !== '' && !isNaN(+String(v).replace(/,/g,''))) ? +String(v).replace(/,/g,'') : null;
      if (key){ o[key] = (key === 'name') ? v : (num !== null ? num : v); if (key === 'code' && num) has = true; }
      else if (num !== null && Math.abs(num) > 0.004) o.extra.push({ label: String(h).trim(), value: num });
    });
    if (!has) continue;
    const j = jobs[String(o.code).trim()] || {};
    o.job = j.job || ''; o.status = j.status || '';
    o.posName = j.posName || ''; o.include = j.include || ''; o.comm = j.comm || '';
    o.days = [];
    people.push(o);
  }

  const dayG = grid('البصمة_اليومية');
  if (dayG){
    const dh = headerRow(dayG, 'كود الموظف');
    if (dh >= 0){
      const H = dayG[dh];
      const byCode = {}; people.forEach(p => byCode[String(p.code).trim()] = p);
      for (let i = dh+1; i < dayG.length; i++){
        const r = dayG[i] || []; const d = {};
        H.forEach((h, j) => { const k = DAY_MAP[norm(h)]; if (k) d[k] = r[j]; });
        if (!d.code) continue;
        const p = byCode[String(d.code).trim()]; if (!p) continue;
        const dt = toD(d.date);
        if (ps && pe && dt && (dt < ps || dt > pe)) continue;
        const n = v => { const x = +String(v ?? '').replace(/[^0-9.\-]/g,''); return isNaN(x) ? 0 : x; };
        p.days.push({ date: fmtDate(dt), dow: dow(dt), state: d.state || '',
          tin: fmtTime(d.tin), tout: fmtTime(d.tout), pin: fmtTime(d.pin), pout: fmtTime(d.pout),
          hours: n(d.hours), late: n(d.late), early: n(d.early), exempt: n(d.exempt),
          pct: String(d.pct || '').includes('%') ? n(d.pct)/100 : n(d.pct),
          lateDed: n(d.lateDed), earlyDed: n(d.earlyDed), note: d.note || '', alert: d.alert || '' });
      }
    }
  }
  return { period, label, people, ps, pe, W, RATES };
}

/* ================= قراءة تقرير الفواتير وتقرير الأصناف ================= */
const SAL_MAP = {};
[['كود البيع','id'],['مبيعات؟','kind'],['نوعية البيع','type'],['كود العميل','custCode'],
 ['اسم العميل','cust'],['التاريخ','date'],['الوقت','time'],['المجموع','total'],
 ['الخصم','disc'],['المدفوع','paid'],['اسم البائع','seller'],['الصنف','item']].forEach(([a,k]) => SAL_MAP[norm(a)] = k);

const ITM_MAP = {};
[['الصنف','item'],['الكمية','qty'],['سعر البيع','price'],['المجموع','total'],
 ['اسم العميل','cust'],['التاريخ','date'],['الوقت','time'],['فئة التصنيف','cat']]
  .forEach(([a,k]) => ITM_MAP[norm(a)] = k);

const nz = v => { const x = +String(v ?? '').replace(/[^0-9.\-]/g,''); return isNaN(x) ? 0 : x; };
const cNorm = v => String(v ?? '').trim().replace(/\s+/g,' ').replace(/^nan$/i,'');
const hhmm = v => v instanceof Date ? `${d2(v.getHours())}:${d2(v.getMinutes())}`
                 : String(v ?? '').trim().slice(0,5);
const ymd = v => v instanceof Date ? `${v.getFullYear()}-${d2(v.getMonth()+1)}-${d2(v.getDate())}` : String(v ?? '');
const median = a => { if (!a.length) return 0; const s = [...a].sort((x,y)=>x-y), m = s.length>>1;
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };

function gridOf(wb, want){
  for (const n of wb.SheetNames){
    const g = fixDates(XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, cellDates:true, defval:null}));
    const h = headerRow(g, want);
    if (h >= 0) return { g, h };
  }
  return null;
}

function parseSales(wb, ps, pe, rates){
  const found = gridOf(wb, 'اسم البائع');
  if (!found) throw new Error('مش لاقي عمود "اسم البائع" — ده مش تقرير المبيعات');
  const { g, h } = found, H = g[h];
  const hasItem = H.some(c => norm(c) === norm('الصنف'));
  const inv = new Map(), push = {};
  let outside = 0, lines = 0;
  for (let i = h+1; i < g.length; i++){
    const r = g[i] || [], o = {};
    H.forEach((c, j) => { const k = SAL_MAP[norm(c)]; if (k) o[k] = r[j]; });
    if (!o.seller && !o.id) continue;
    const dt = o.date instanceof Date ? o.date : (o.date ? new Date(o.date) : null);
    if (!dt) continue;
    if (ps && pe && (dt < ps || dt > new Date(pe.getTime()+86399000))) { outside++; continue; }
    lines++;
    const seller = cNorm(o.seller);
    const id = (o.id != null && o.id !== '') ? String(o.id) : ('row' + i);
    let x = inv.get(id);
    if (!x){ x = { id, ret: String(o.kind||'').includes('مرتج'), type: cNorm(o.type),
      hasCust: !!(o.custCode || cNorm(o.cust)), cust: cNorm(o.cust),
      key: ymd(dt) + '|' + hhmm(o.time) + '|' + cNorm(o.cust), total: 0, seller };
      inv.set(id, x); }
    const v = nz(o.total); x.total += v;
    if (hasItem && o.item){
      const name = String(o.item).toUpperCase();
      if (name.includes('$$')){
        const rate = name.includes('XICLAV') ? rates.xic : (name.includes('NEBULA') ? rates.neb : rates.gen);
        push[seller] = push[seller] || { pushValue:0, pushComm:0, pushLines:0 };
        push[seller].pushValue += v; push[seller].pushComm += v * rate; push[seller].pushLines++;
      }
    }
  }
  return { rows: [...inv.values()], outside, lines, itemLevel: hasItem, push: hasItem ? push : null };
}

function parseItems(wb, salesRows, rates){
  const found = gridOf(wb, 'فئة التصنيف');
  if (!found) throw new Error('مش لاقي عمود "فئة التصنيف" — ده مش تقرير الأصناف');
  const { g, h } = found, H = g[h];
  const key2seller = {};
  salesRows.forEach(r => { if (!(r.key in key2seller)) key2seller[r.key] = r.seller;
    else if (key2seller[r.key] !== r.seller) key2seller[r.key] = null; });
  const per = {};
  let matched = 0, unmatched = 0, ambiguous = 0;
  for (let i = h+1; i < g.length; i++){
    const r = g[i] || [], o = {};
    H.forEach((c, j) => { const k = ITM_MAP[norm(c)]; if (k) o[k] = r[j]; });
    if (!o.item) continue;
    const dt = o.date instanceof Date ? o.date : (o.date ? new Date(o.date) : null);
    if (!dt) continue;
    const k = ymd(dt) + '|' + hhmm(o.time) + '|' + cNorm(o.cust);
    const s = key2seller[k];
    if (s === undefined) { unmatched++; continue; }
    if (s === null) { ambiguous++; continue; }
    matched++;
    const name = String(o.item).toUpperCase();
    if (!name.includes('$$')) continue;
    const rate = name.includes('XICLAV') ? rates.xic : (name.includes('NEBULA') ? rates.neb : rates.gen);
    const v = nz(o.total);
    per[s] = per[s] || { pushValue: 0, pushComm: 0, pushLines: 0 };
    per[s].pushValue += v; per[s].pushComm += v * rate; per[s].pushLines++;
  }
  return { per, matched, unmatched, ambiguous };
}

/* ================= حساب المؤشرات ================= */
function buildKPI(people, sales, items, W0){
  let W = Object.assign({}, W0);
  if (!items){ const rest = W.h + W.i + W.c;
    if (rest > 0) { W = { h: W.h/rest, i: W.i/rest, p: 0, c: W.c/rest }; } }
  const bySeller = {};
  sales.forEach(r => {
    const s = r.seller; if (!s) return;
    const b = bySeller[s] = bySeller[s] || { invoices:0, net:0, gross:0, rets:0, retVal:0,
      cust:0, deliv:0, vals:[] };
    b.net += r.total;
    if (r.ret) { b.rets++; b.retVal += r.total; }
    else { b.invoices++; b.gross += r.total; b.vals.push(r.total);
      if (r.hasCust) b.cust++; if (r.type.includes('توصيل')) b.deliv++; }
  });

  const rows = [];
  const unmapped = Object.keys(bySeller).slice();
  people.forEach(p => {
    const pos = cNorm(p.posName);
    const b = pos ? bySeller[pos] : null;
    if (pos){ const i = unmapped.indexOf(pos); if (i >= 0) unmapped.splice(i, 1); }
    if (!b) return;
    const it = (items && items.per[pos]) || { pushValue:0, pushComm:0 };
    const commOK = String(p.comm || '').includes('نعم');
    rows.push({ code: p.code, name: p.name, pos, hours: +p.hours || 0,
      include: String(p.include || '').includes('نعم'), commOK,
      invoices: b.invoices, net: Math.round(b.net*100)/100, gross: b.gross,
      rets: b.rets, retVal: b.retVal,
      medInv: Math.round(median(b.vals)*100)/100,
      custPct: b.invoices ? b.cust / b.invoices : 0,
      delivPct: b.invoices ? b.deliv / b.invoices : 0,
      perHour: (+p.hours) ? b.net / p.hours : 0,
      pushValue: Math.round(it.pushValue*100)/100,
      pushComm: commOK ? Math.round(it.pushComm*100)/100 : 0,
      pushPct: b.gross ? it.pushValue / b.gross : 0 });
  });

  const inc = rows.filter(r => r.include);
  const mx = k => Math.max(0, ...inc.map(r => r[k] || 0));
  const M = { perHour: mx('perHour'), medInv: mx('medInv'), pushPct: mx('pushPct'), custPct: mx('custPct') };
  rows.forEach(r => {
    if (!r.include) { r.score = null; return; }
    const n = (v, m) => m > 0 ? (v / m) * 100 : 0;
    r.sHour = n(r.perHour, M.perHour); r.sInv = n(r.medInv, M.medInv);
    r.sPush = n(r.pushPct, M.pushPct); r.sCust = n(r.custPct, M.custPct);
    r.score = Math.round((W.h*r.sHour + W.i*r.sInv + W.p*r.sPush + W.c*r.sCust) * 10) / 10;
  });
  rows.sort((a,b) => (b.score ?? -1) - (a.score ?? -1) || b.net - a.net);
  rows.W = W;
  const tot = { invoices: rows.reduce((a,r)=>a+r.invoices,0), net: rows.reduce((a,r)=>a+r.net,0),
    push: rows.reduce((a,r)=>a+r.pushValue,0), comm: rows.reduce((a,r)=>a+r.pushComm,0),
    scoreSum: inc.reduce((a,r)=>a+(r.score||0),0) };
  return { rows, tot, unmapped, bySeller, W };
}

  snap.forEach(d => { const v = d.data(); if (v.published) list.push({ id: d.id, ...v }); });

/* ================= رسومات بسيطة بدون مكتبات ================= */
const PAL = ['#1F9B76','#2AAE86','#5FBF9E','#B0761F','#E0B25A','#7FA8C9','#9C7BB8'];

function statTiles(items){
  return `<div class="stats">${items.map(s => `<div class="stat${s.hi ? ' hi' : ''}">
    <span class="sl">${esc(s.label)}</span><span class="sv">${s.value}</span>
    ${s.sub ? `<span class="ss">${esc(s.sub)}</span>` : ''}</div>`).join('')}</div>`;
}

function barList(items, fmt){
  const mx = Math.max(1, ...items.map(i => Math.abs(i.value)));
  return `<div class="bars">${items.map((i, n) => `<div class="bar-row">
    <div class="bar-head"><span class="bn">${esc(i.label)}</span><span class="bv">${fmt(i.value)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(Math.abs(i.value)/mx*100).toFixed(1)}%;
      background:${i.color || PAL[n % 3]};animation-delay:${Math.min(n*45,500)}ms"></div></div>
    ${i.note ? `<div class="bar-note">${esc(i.note)}</div>` : ''}</div>`).join('')}</div>`;
}

function areaSVG(pts, fmt){
  if (!pts.length) return '';
  const W = 640, H = 170, P = { t:14, r:10, b:26, l:10 };
  const mx = Math.max(...pts.map(p => p.v)) || 1;
  const n = pts.length;
  const X = i => W - P.r - (i * (W - P.l - P.r) / Math.max(1, n - 1));
  const Y = v => P.t + (1 - v / mx) * (H - P.t - P.b);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(n-1).toFixed(1)},${H-P.b} L${X(0).toFixed(1)},${H-P.b} Z`;
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"
      fill="var(--card)" stroke="${PAL[0]}" stroke-width="1.6"><title>${esc(p.k)} — ${fmt(p.v)}</title></circle>`).join('');
  const step = Math.ceil(n / 8);
  const labs = pts.map((p, i) => i % step ? '' :
    `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(p.k)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${PAL[0]}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${PAL[0]}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="${PAL[0]}" stroke-width="2" stroke-linejoin="round" class="spark"/>
    ${dots}${labs}</svg></div>`;
}

function donut(pct, label, sub){
  const r = 52, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(1, pct));
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="15"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${PAL[0]}" stroke-width="15" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${(c-on).toFixed(1)}" transform="rotate(-90 70 70)" class="ring"/>
    <text x="70" y="68" text-anchor="middle" font-size="26" font-weight="600" fill="var(--ink)">${(pct*100).toFixed(0)}٪</text>
    <text x="70" y="88" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(sub||'')}</text>
  </svg><div class="dlabel">${esc(label)}</div></div>`;
}

function dayColumns(days){
  if (!days.length) return '';
  const W = 640, H = 130, P = { t:10, b:24 };
  const mx = Math.max(1, ...days.map(d => +d.hours || 0));
  const bw = (W - 8) / days.length;
  const bars = days.map((d, i) => {
    const h = ((+d.hours||0) / mx) * (H - P.t - P.b);
    const x = W - 4 - (i+1)*bw;
    const col = (+d.hours) ? (d.lateDed || d.earlyDed ? 'var(--red)' : (d.exempt ? 'var(--amber)' : PAL[0]))
                           : 'var(--line)';
    return `<rect x="${(x+bw*.16).toFixed(1)}" y="${(H-P.b-h).toFixed(1)}" width="${(bw*.68).toFixed(1)}"
      height="${Math.max(h,1).toFixed(1)}" rx="2" fill="${col}"><title>${esc(d.date)} — ${F(d.hours)} ساعة ${esc(d.state)}</title></rect>
      ${i % Math.ceil(days.length/10) ? '' : `<text x="${(x+bw*.5).toFixed(1)}" y="${H-7}" text-anchor="middle"
      font-size="9.5" fill="var(--muted)">${esc(String(d.date).slice(0,2))}</text>`}`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${bars}</svg></div>
    <div class="legend"><span><i style="background:${PAL[0]}"></i>يوم عادي</span>
    <span><i style="background:var(--red)"></i>عليه خصم</span>
    <span><i style="background:var(--amber)"></i>تأخير معفى</span>
    <span><i style="background:var(--line)"></i>بدون ساعات</span></div>`;
}

async function loadDash(force){
  if (!DASH.periods.length || force){
    $('ap0').innerHTML = '<p class="sub">جاري تحميل الكشوف المنشورة…</p>';
    try {
      const ps = await getDocs(collection(db, 'periods'));
      DASH.periods = []; ps.forEach(d => DASH.periods.push({ id: d.id, ...d.data() }));
      DASH.periods.sort((a,b) => a.id < b.id ? 1 : -1);
      const st = await getDocs(collection(db, 'staff'));
      DASH.staff = []; st.forEach(d => DASH.staff.push({ uid: d.id, ...d.data() }));
    } catch (e) { $('ap0').innerHTML = `<p class="err">مقدرتش أقرا البيانات: ${esc(e.code || e.message)}</p>`; return; }
  }
  if (!DASH.periods.length){
    $('perBox').innerHTML = '';
    $('ap0').innerHTML = $('ap4').innerHTML = `<p class="sub">لسه مفيش أي كشف منشور.</p>`; return;
  }
  if (!DASH.period || !DASH.periods.some(p => p.id === DASH.period)) DASH.period = DASH.periods[0].id;
  await loadPeriod(DASH.period);
}

async function loadPeriod(pid){
  DASH.period = pid;
  const P = DASH.periods.find(p => p.id === pid) || { id: pid };
  $('perBox').innerHTML = `<div style="display:flex;gap:10px;align-items:end;margin-top:14px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><label style="margin-top:0">الفترة</label>
      <select onchange="loadPeriod(this.value)">${DASH.periods.map(p =>
        `<option value="${esc(p.id)}" ${p.id === pid ? 'selected' : ''}>${esc(p.label || p.id)}</option>`).join('')}</select></div>
    <button class="sm ghost" onclick="exportDash()">تصدير Excel</button></div>
    <p class="sub" style="margin-top:8px">آخر نشر: ${P.at?.seconds ? new Date(P.at.seconds*1000).toLocaleString('ar-EG') : '—'}</p>`;
  $('ap0').innerHTML = $('ap4').innerHTML = '<p class="sub">جاري التحميل…</p>';

  const rows = [];
  for (const s of DASH.staff){
    try { const d = await getDoc(doc(db, 'payslips', pid, 'employees', s.uid));
      if (d.exists()) rows.push(d.data()); } catch(e){}

  rows.sort((a,b) => (+a.code||0) - (+b.code||0));

  $('ap0').innerHTML = payPanel(rows);

}

function payPanel(rows){
  const sum = k => rows.reduce((a,r) => a + (+r[k] || 0), 0);
  const comm = sum('pushAuto');
  const oldPub = rows.length && rows.every(r => r.pushAuto === undefined);
  const noSales = !oldPub && rows.length && rows.every(r => !r.sales);
  const commBanner = oldPub
    ? `<div class="banner bad" style="margin-top:14px">الكشوف دي اتنشرت بنسخة قديمة من التطبيق قبل ربط عمولة البوشينج. روح لـ(نشر كشف جديد)، ارفع المرتبات + ملف المبيعات، وانشر تاني.</div>`
    : (noSales ? `<div class="banner" style="margin-top:14px">الكشوف دي اتنشرت من غير ملف المبيعات، فمفيش عمولة بوشينج فيها. انشر تاني بالملفين.</div>` : '');
  const tr = rows.map(r => `<tr style="cursor:pointer" onclick="drill('${esc(r.uid)}')">
    <td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${F(r.hours)}</td>
    <td class="num">${F(r.wage)}</td><td class="num">${r.lates||0}</td>
    <td class="num">${F(r.totalDed)}</td><td class="num">${F((+r.bonus||0) - (+r.pushAuto||0))}</td>
    <td class="num">${+r.pushAuto ? '+ ' + F(r.pushAuto) : '—'}</td>
    <td class="num"><b>${F(r.net)}</b></td>
    <td>${r.flags ? `<span class="tag late">${r.flags}</span>` : '—'}</td></tr>`).join('');
  return `
    ${statTiles([
      {label:'صافي المرتبات', value:F(sum('net'))+' ج', hi:true, sub:rows.length+' كشف'},
      {label:'ساعات العمل', value:F(sum('hours'))},
      {label:'الخصومات', value:F(sum('totalDed'))+' ج'},
      {label:'الحوافز', value:F(sum('bonus') - comm)+' ج'},
      {label:'عمولة البوشينج', value:F(comm)+' ج'},
      {label:'المسحوبات', value:F(sum('adv'))+' ج'}])}
    ${commBanner}
    <h2 style="margin-top:22px">الكشوف بالتفصيل</h2>
    <div class="scroll"><table>
      <tr><th>الكود</th><th>الاسم</th><th>ساعات</th><th>أجر</th><th>تأخيرات</th><th>خصومات</th><th>حوافز</th><th>عمولة بوشينج</th><th>الصافي</th><th>مراجعة</th></tr>
      ${tr || '<tr><td colspan="10">مفيش كشوف في الفترة دي</td></tr>'}</table></div>
    <div class="note">اضغط على أي موظف تشوف تفاصيل أيامه. عمولة البوشينج محسوبة تلقائياً من ملف المبيعات وداخلة في الصافي.</div>
    <div id="drillBox"></div>`;
}

function salesPanel(rows, P){
  const S = rows.filter(r => r.sales);
  if (!S.length) return `<p class="sub">مفيش بيانات مبيعات في الفترة دي. ارفع ملف المبيعات مع المرتبات وانشر.</p>`;
  const net = S.reduce((a,r)=>a+(+r.sales.net||0),0), inv = S.reduce((a,r)=>a+(+r.sales.invoices||0),0);
  const cust = S.reduce((a,r)=>a+(r.sales.custPct*r.sales.invoices),0);
  const comm = S.reduce((a,r)=>a+(+r.sales.pushComm||0),0), push = S.reduce((a,r)=>a+(+r.sales.pushValue||0),0);
  const payNet = rows.reduce((a,r)=>a+(+r.net||0),0);
  const bySales = [...S].sort((a,b) => b.sales.net - a.sales.net);
  const pc = v => (v*100).toFixed(1) + '٪';
  const tr = bySales.map(r => `<tr${r.sales.include ? '' : ' style="opacity:.6"'}>
    <td>${esc(r.name)}</td><td class="num">${r.sales.invoices}</td><td class="num">${F(r.sales.net)}</td>
    <td class="num">${net ? pc(r.sales.net/net) : '—'}</td><td class="num">${F(r.sales.medInv)}</td>
    <td class="num">${F(r.sales.perHour)}</td><td class="num">${pc(r.sales.custPct)}</td>
    <td class="num">${F(r.sales.pushValue)}</td>
    <td class="num">${r.sales.commOK === false ? 'غير مستحق' : F(r.sales.pushComm)}</td>
    <td class="num"><b>${r.sales.include && r.sales.score != null ? F(r.sales.score) : '—'}</b></td></tr>`).join('');
  return `
    ${statTiles([
      {label:'مبيعات الفريق', value:F(net)+' ج', hi:true, sub:inv+' فاتورة'},
      {label:'متوسط الفاتورة', value:inv ? F(net/inv)+' ج' : '—'},
      {label:'تسجيل اسم العميل', value:inv ? pc(cust/inv) : '—', sub:'من الفواتير'},
      {label:'قيمة البوشينج', value:F(push)+' ج', sub: net ? pc(push/net)+' من المبيعات' : ''},
      {label:'عمولة البوشينج', value:F(comm)+' ج'},
      {label:'تكلفة الأجور', value:net ? pc(payNet/net) : '—', sub:'من المبيعات'}])}
    <div class="split" style="margin-top:20px">
      <div>${P.daily && P.daily.length ? `<h2>مبيعات الفرع يوم بيوم</h2>` +
        areaSVG(P.daily.map(d => ({ k: String(d.d).slice(5).split('-').reverse().join('/'), v: +d.net || 0 })), v => F(v)+' ج') : ''}</div>
      <div>${donut(inv ? cust/inv : 0, 'فواتير مسجل لها اسم عميل', 'من ' + inv)}</div></div>
    <h2 style="margin-top:22px">المؤشرات بالتفصيل</h2>
    <div class="scroll"><table>
      <tr><th>الاسم</th><th>فواتير</th><th>المبيعات</th><th>من الفرع</th><th>وسيط الفاتورة</th>
      <th>مبيعات/ساعة</th><th>تسجيل عميل</th><th>بوشينج</th><th>عمولة</th><th>الدرجة</th></tr>${tr}</table></div>
    <div class="note">الشفافية في الصف = مستبعد من التقييم. الدرجة من ١٠٠، محسوبة بالأوزان المسجلة في شيت الافتراضات.</div>`;
}

  const body = DASH.rows.map(r => [r.code, r.name, r.job||'', r.rate||0, r.hourly||0, r.hours||0, r.carried||0,
    r.wage||0, r.lates||0, r.exempt||0, r.q||0, r.half||0, r.lateDed||0, r.early||0, r.earlyDed||0,
    r.absDays||0, r.absPen||0, r.adminPen||0, r.totalDed||0, r.bonus||0, r.adv||0, r.pushAuto||0, r.net||0, r.flags||0,
    r.sales?.invoices||0, r.sales?.net||0, r.sales?.sharePct||0, r.sales?.medInv||0, r.sales?.perHour||0,
    r.sales?.custPct||0, r.sales?.pushValue||0, r.sales?.pushComm||0, r.sales?.score||'']);
  const ws = XLSX.utils.aoa_to_sheet([[`كشف المرتبات — ${P.label || DASH.period}`], [], head, ...body]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'كشف المرتب');
  XLSX.writeFile(wb, `كشف_المرتبات_${DASH.period}.xlsx`);
};

let SALES = null, ITEMS = null, KPI = null;

function adminUploadUI(){
  return `
    <h2>١. ارفع الملفات</h2>
    <div class="drop" id="dropPay">١) ملف نظام المرتبات (.xlsx) — مطلوب</div>
    <input id="filePay" type="file" accept=".xlsx,.xlsm" class="hide">
    <div class="drop" id="dropSal" style="margin-top:8px">٢) تقرير المبيعات بالبائع (.xlsx) — اختياري</div>
    <input id="fileSal" type="file" accept=".xlsx,.xlsm" class="hide">
    <div class="drop" id="dropItm" style="margin-top:8px">٣) تقرير الأصناف (.xlsx) — بس لو ملف المبيعات مفيهوش أصناف</div>
    <input id="fileItm" type="file" accept=".xlsx,.xlsm" class="hide">
    <div class="err" id="upErr"></div>
    <div id="upState" class="note"></div>
    <div id="preview"></div>`;
}
function bindUploads(){
  [['dropPay','filePay',rdPay],['dropSal','fileSal',rdSal],['dropItm','fileItm',rdItm]].forEach(([d,f,fn]) => {
    $(d).onclick = () => $(f).click(); $(f).onchange = e => readXlsx(e, fn);
  });
}
function readXlsx(ev, fn){
  const f = ev.target.files[0]; if (!f) return;
  $('upErr').textContent = '';
  const rd = new FileReader();
  rd.onload = e => { try { fn(XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true }), f.name); }
    catch (err) { $('upErr').textContent = 'مقدرتش أقرا الملف: ' + err.message; } };
  rd.readAsArrayBuffer(f);
}
const rdPay = wb => { PARSED = parseBook(wb); recompute(); };
const rdSal = wb => { if (!PARSED) throw new Error('ارفع ملف المرتبات الأول');
  SALES = parseSales(wb, PARSED.ps, PARSED.pe, PARSED.RATES);
  ITEMS = SALES.push ? { per: SALES.push, matched: SALES.lines, unmatched: 0, ambiguous: 0, direct: true } : null;
  recompute(); };
const rdItm = wb => { if (!SALES) throw new Error('ارفع تقرير الفواتير الأول');
  ITEMS = parseItems(wb, SALES.rows, PARSED.RATES); recompute(); };

function recompute(){
  KPI = (PARSED && SALES) ? buildKPI(PARSED.people, SALES.rows, ITEMS, PARSED.W) : null;
  $('upState').innerHTML = [
    PARSED ? `✔ المرتبات: ${PARSED.people.length} موظف — ${esc(PARSED.label)}` : '',
    SALES ? `✔ المبيعات: ${SALES.rows.length} فاتورة${SALES.itemLevel ? ` (من ${SALES.lines} سطر صنف)` : ''} داخل الفترة${SALES.outside ? ` — ${SALES.outside} سطر بره الفترة اتشالوا` : ''}` : '',
    ITEMS ? (ITEMS.direct ? '✔ البوشينج اتحسب من نفس ملف المبيعات (فيه الأصناف والبائع)'
      : `✔ الأصناف: ${ITEMS.matched} صف اتنسب لبائع${ITEMS.unmatched ? ` — ${ITEMS.unmatched} مش متطابق` : ''}${ITEMS.ambiguous ? ` — ${ITEMS.ambiguous} ملتبس` : ''}`) : ''
  ].filter(Boolean).join('<br>');
  showPreview();
}

const autoComm = code => {
  if (!KPI || !ITEMS) return 0;
  const k = KPI.rows.find(x => String(x.code) === String(code));
  return k && k.commOK ? Math.round(k.pushComm * 100) / 100 : 0;
};
const manualPush = p => (p.extra || []).filter(x => /pushing|بوشينج/i.test(String(x.label)))
  .reduce((a, x) => a + (+x.value || 0), 0);

function showPreview(){
  if (!PARSED) return;
  const P = PARSED;
  const bad = P.people.filter(p => !p.rate), flag = P.people.filter(p => p.flags > 0);
  const left = P.people.filter(p => String(p.status || '').includes('ترك'));
  let w = '';
  if (bad.length) w += `<div class="banner bad">${bad.length} موظف من غير سعر ساعة (${bad.map(x=>esc(x.name)).join('، ')}) — مرتبهم صفر.</div>`;
  if (flag.length) w += `<div class="banner">أيام تحت المراجعة: ${flag.map(x=>esc(x.name)+' ('+x.flags+')').join('، ')}</div>`;
  if (left.length) w += `<div class="banner">${left.map(x=>esc(x.name)).join('، ')} — الحالة "ترك العمل".</div>`;
  if (KPI && KPI.unmapped.length) w += `<div class="banner">بائعين مش مربوطين بموظف (مبيعاتهم في إجمالي الفرع بس): ${KPI.unmapped.map(esc).join('، ')}</div>`;
  const dup = P.people.filter(p => autoComm(p.code) && manualPush(p));
  if (dup.length) w += `<div class="banner bad">⚠ عمولة البوشينج هتتحسب مرتين لـ: ${dup.map(x => esc(x.name) + ' (' + F(manualPush(x)) + ' ج يدوي)').join('، ')}.
    العمولة بقت بتتضاف تلقائياً من ملف المبيعات — امسح "حافز Pushing" من شيت الحوافز في الإكسيل وارفع تاني.</div>`;
  if (!ITEMS) w += `<div class="banner">ملف المبيعات بالأصناف مش مرفوع — عمولة البوشينج مش هتتضاف للكشوف.</div>`;

  const rows = P.people.map(p => { const c = autoComm(p.code);
    return `<tr><td>${p.code}</td><td>${esc(p.name)}</td>
    <td class="num">${F(p.hours)}</td><td class="num">${F(p.wage)}</td><td class="num">${p.lates||0}</td>
    <td class="num">${F(p.totalDed)}</td><td class="num">${F(p.net)}</td>
    <td class="num">${c ? '+ ' + F(c) : '—'}</td><td class="num"><b>${F((+p.net||0) + c)}</b></td>
    <td>${p.flags ? `<span class="tag late">${p.flags}</span>` : '—'}</td></tr>`; }).join('');
  const tot = P.people.reduce((a,p)=>a+(+p.net||0)+autoComm(p.code),0);

  $('preview').innerHTML = `
    <h2 style="margin-top:18px">٢. راجع قبل النشر</h2>
    <p class="sub">الفترة: <b>${esc(P.label)}</b> — ${P.people.length} موظف — إجمالي الصافي: <b>${F(tot)} ج</b></p>
    ${w}
    <div class="scroll"><table>
      <tr><th>الكود</th><th>الاسم</th><th>ساعات</th><th>أجر</th><th>تأخيرات</th><th>خصومات</th>
      <th>صافي الإكسيل</th><th>عمولة بوشينج</th><th>الصافي النهائي</th><th>مراجعة</th></tr>
      ${rows}</table></div>
    <div class="note">الصافي النهائي = صافي الإكسيل + عمولة البوشينج المحسوبة تلقائياً من ملف المبيعات. ده اللي هيتنشر للموظف.</div>
    ${KPI ? kpiBlock() : '<div class="note">ارفع تقرير الفواتير عشان تظهر مؤشرات المبيعات.</div>'}
    <h2 style="margin-top:18px">٣. اعتماد ونشر</h2>
    <button class="full" id="pubBtn" onclick="publish()">اعتماد ونشر للفريق</button>
    <div class="err" id="pubMsg"></div><div id="pubOut"></div>`;
}

function kpiBlock(){
  const K = KPI, W = KPI.W;
  const pc = v => (v*100).toFixed(1) + '٪';
  const tr = K.rows.map((r,i) => `<tr${r.include ? '' : ' style="opacity:.55"'}>
    <td>${r.include ? i+1 : '—'}</td><td>${esc(r.name)}</td>
    <td class="num">${r.invoices}</td><td class="num">${F(r.net)}</td>
    <td class="num">${F(r.medInv)}</td><td class="num">${F(r.perHour)}</td>
    <td class="num">${pc(r.custPct)}</td><td class="num">${ITEMS ? F(r.pushValue) : '—'}</td>
    <td class="num">${ITEMS ? (r.commOK ? F(r.pushComm) : 'غير مستحق') : '—'}</td>
    <td class="num"><b>${r.include ? F(r.score) : 'مستبعد'}</b></td></tr>`).join('');
  return `
    <h2 style="margin-top:22px">مؤشرات المبيعات</h2>
    <p class="sub">إجمالي الفرع في الفترة: <b>${F(K.tot.net)} ج</b> على <b>${K.tot.invoices}</b> فاتورة
      ${ITEMS ? ` — بوشينج <b>${F(K.tot.push)} ج</b> وعمولته <b>${F(K.tot.comm)} ج</b>` : ''}</p>
    <p class="sub">الأوزان: مبيعات/ساعة ${pc(W.h)} · وسيط الفاتورة ${pc(W.i)} · نسبة البوشينج ${pc(W.p)} · تسجيل العميل ${pc(W.c)}</p>
    ${!ITEMS ? '<div class="banner">تقرير الأصناف مش مرفوع، فالبوشينج مش محسوب — الأوزان التلاتة الباقية اتعدلت تلقائياً عشان مجموعها يفضل ١٠٠٪.</div>' : ''}
    <div class="scroll"><table>
      <tr><th>#</th><th>الاسم</th><th>فواتير</th><th>صافي المبيعات</th><th>وسيط الفاتورة</th>
      <th>مبيعات/ساعة</th><th>تسجيل عميل</th><th>قيمة بوشينج</th><th>عمولة</th><th>الدرجة</th></tr>
      ${tr}</table></div>
    <h2 style="margin-top:18px">حافز التارجت — التوزيع المقترح</h2>
    <label>المبلغ الإجمالي (ج)</label>
    <input id="tgt" inputmode="numeric" placeholder="مثال: 5000" oninput="splitTarget()">
    <div id="tgtOut"></div>
    <div class="note">التوزيع بالتناسب مع الدرجة. انقل الأرقام لشيت (الحوافز) في الإكسيل تحت بند "حافز تارجت"، وارفع الملف تاني عشان تدخل في المرتب.</div>`;
}

window.splitTarget = () => {
  const t = nz($('tgt').value), K = KPI;
  if (!t || !K || !K.tot.scoreSum) { $('tgtOut').innerHTML = ''; return; }
  const inc = K.rows.filter(r => r.include);
  const rows = inc.map(r => { const v = Math.round(t * (r.score / K.tot.scoreSum) / 5) * 5;
    return `<tr><td>${r.code}</td><td>${esc(r.name)}</td><td class="num">${F(r.score)}</td>
      <td class="num">${((r.score/K.tot.scoreSum)*100).toFixed(1)}٪</td><td class="num"><b>${v}</b></td></tr>`; }).join('');
  $('tgtOut').innerHTML = `<div class="scroll" style="margin-top:10px"><table>
    <tr><th>الكود</th><th>الاسم</th><th>الدرجة</th><th>النسبة</th><th>المقترح (ج)</th></tr>${rows}</table></div>`;
};

window.publish = async () => {
  if (!PARSED) return;
  const btn = $('pubBtn'); btn.disabled = true;
  const msg = $('pubMsg'); msg.style.color = 'var(--muted)';
  const P = PARSED;

  let map = {};
  try {
    const snap = await getDocs(collection(db, 'staff'));
    snap.forEach(d => { const v = d.data(); if (v.code != null) map[String(v.code).trim()] = d.uid || d.id; });
  } catch (e) { msg.style.color = 'var(--warn)';
    msg.textContent = 'مقدرتش أقرا قايمة الموظفين: ' + e.code; btn.disabled = false; return; }

  let sec = null, secAuth = null;
  const news = [];
  let done = 0;

  for (const p of P.people){
    const code = String(p.code).trim();
    msg.textContent = `جاري النشر… ${done}/${P.people.length}`;
    let uid = map[code];
    if (!uid){
      try {
        if (!sec) { sec = initializeApp(CFG, 'sec'); secAuth = getAuth(sec); }
        const cr = await createUserWithEmailAndPassword(secAuth, emailFor(code), defPass(code));
        uid = cr.user.uid;
        await signOut(secAuth);
        news.push({ code, name: p.name, pass: defPass(code) });
      } catch (e) {
        if (e.code === 'auth/email-already-in-use'){
          msg.style.color = 'var(--warn)';
          msg.textContent = `الكود ${code} له حساب قديم بس مش مربوط. امسح المستخدم ${emailFor(code)} من Authentication وارفع تاني.`;
          btn.disabled = false; return;
        }
        msg.style.color = 'var(--warn)';
        msg.textContent = `مشكلة في إنشاء حساب الكود ${code}: ${e.code}`;
        btn.disabled = false; return;
      }
      try { await setDoc(doc(db, 'staff', uid), { code, name: p.name, job: p.job || '' }, { merge:true }); } catch(e){}
      map[code] = uid;
    } else {
      try { await setDoc(doc(db, 'staff', uid), { code, name: p.name, job: p.job || '' }, { merge:true }); } catch(e){}
    }

    const rec = Object.assign({}, p);
    rec.uid = uid; rec.period = P.period; rec.periodLabel = P.label; rec.publishedAt = new Date().toISOString();
    const pc = autoComm(code);
    rec.netExcel = +p.net || 0;
    rec.pushAuto = pc;
    if (pc){ rec.bonus = (+p.bonus || 0) + pc; rec.net = Math.round(((+p.net || 0) + pc) * 100) / 100; }
    if (KPI){
      const k = KPI.rows.find(x => String(x.code) === code);
      if (k){ const rank = KPI.rows.filter(x => x.include).findIndex(x => String(x.code) === code);
        rec.sales = { invoices:k.invoices, net:k.net, medInv:k.medInv, perHour:Math.round(k.perHour*100)/100,
          custPct:Math.round(k.custPct*1000)/1000, delivPct:Math.round(k.delivPct*1000)/1000,
          rets:k.rets, retVal:Math.round(k.retVal*100)/100, pushValue:k.pushValue, pushComm:k.pushComm,
          pushPct:Math.round(k.pushPct*1000)/1000, include:k.include, commOK:k.commOK,
          score:k.score, rank: rank >= 0 ? rank+1 : null,
          branchNet:Math.round(KPI.tot.net*100)/100, branchInv:KPI.tot.invoices,
          sharePct: KPI.tot.net ? Math.round((k.net/KPI.tot.net)*1000)/1000 : 0 }; }
    }
    try { await setDoc(doc(db, 'payslips', P.period, 'employees', uid), rec); }
    catch (e) { msg.style.color = 'var(--warn)';
      msg.textContent = `مقدرتش أكتب كشف ${p.name}: ${e.code}`; btn.disabled = false; return; }
    done++;
  }

  try {
    const daily = {};
    if (SALES) SALES.rows.forEach(r => { const d = r.key.split('|')[0];
      daily[d] = daily[d] || { d, net:0, inv:0 }; daily[d].net += r.total; if (!r.ret) daily[d].inv++; });
    const dailyArr = Object.values(daily).sort((a,b) => a.d < b.d ? -1 : 1)
      .map(x => ({ d:x.d, net: Math.round(x.net*100)/100, inv:x.inv }));
    await setDoc(doc(db, 'periods', P.period),
      { label: P.label, published: true, count: done, at: serverTimestamp(),
        daily: dailyArr, branchNet: KPI ? Math.round(KPI.tot.net*100)/100 : null }, { merge:true });
  } catch (e) { msg.style.color = 'var(--warn)'; msg.textContent = 'مقدرتش أعلّم الفترة كمنشورة: ' + e.code;
    btn.disabled = false; return; }

  DASH.periods = [];
  msg.style.color = 'var(--good)';
  msg.textContent = `تم نشر ${done} كشف. الموظفين يقدروا يدخلوا دلوقتي، والكشوف ظهرت في تبويب (الكشوف المنشورة).`;
  btn.disabled = false;

  if (news.length){
    $('pubOut').innerHTML = `<div class="banner" style="margin-top:12px">
      اتعمل ${news.length} حساب جديد. وزّع الأرقام دي على أصحابها — كل واحد يقدر يغيّرها من "حسابي".</div>
      <div class="scroll"><table><tr><th>الكود</th><th>الاسم</th><th>الرقم السري المبدئي</th></tr>
      ${news.map(n => `<tr><td>${esc(n.code)}</td><td>${esc(n.name)}</td><td><code>${esc(n.pass)}</code></td></tr>`).join('')}
      </table></div>`;
  }
};

async function loadStaff(){
  try {
    const snap = await getDocs(collection(db, 'staff'));
    const rows = [];
    snap.forEach(d => { const v = d.data(); rows.push(`<tr><td>${esc(v.code)}</td><td>${esc(v.name)}</td>
      <td>${esc(v.job || '')}</td><td><code>${esc(emailFor(v.code))}</code></td></tr>`); });
    $('staffBox').innerHTML = rows.length
      ? `<div class="scroll"><table><tr><th>الكود</th><th>الاسم</th><th>الوظيفة</th><th>حساب الدخول</th></tr>
         ${rows.join('')}</table></div>
         <div class="note">لو موظف نسي رقمه السري: Firebase Console ← Authentication ← Users ← دوس على حسابه ← Reset password.
         التطبيق مش بيقدر يغيّر رقم سري لحد تاني، ده مقصود عشان الأمان.</div>`
      : `<p class="sub">لسه مفيش حسابات. هتتعمل لوحدها أول ما تنشر أول كشف.</p>`;
  } catch (e) { $('staffBox').innerHTML = `<p class="err">مشكلة: ${e.code}</p>`; }
}

async function loadQ(){
  try {
    const snap = await getDocs(collection(db, 'queries'));
    const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
    $('qBox').innerHTML = list.length ? list.map(q => `<div class="qitem">
      <div class="meta">${esc(q.name || '')} (${esc(q.code || '')}) — ${esc(q.period || '')}
        ${q.at?.seconds ? ' — ' + new Date(q.at.seconds*1000).toLocaleString('ar-EG') : ''}</div>
      <div>${esc(q.text)}</div>
      <div style="margin-top:8px">${q.status === 'تم' ? '<span class="tag ok">تم</span>'
        : `<button class="sm" onclick="closeQ('${q.id}')">علّمه كمتحل</button>`}</div></div>`).join('')
      : `<p class="sub">مفيش استفسارات.</p>`;
  } catch (e) { $('qBox').innerHTML = `<p class="err">مشكلة: ${e.code}</p>`; }
}
window.closeQ = async id => { try { await updateDoc(doc(db, 'queries', id), { status: 'تم' }); loadQ(); } catch(e){} };
</script>
