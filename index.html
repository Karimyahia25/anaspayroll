<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرتبات صيدلية أنس نحيلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--muted:#6b7a88;--line:#e2e8ee;
--brand:#0f7b6c;--soft:#e6f4f1;--warn:#b4341f;--warnsoft:#fdeceb;--good:#1f7a3f;
--gold:#8a6d1f;--goldsoft:#fdf6e3;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#18212a;--ink:#e8eef3;
--muted:#93a3b1;--line:#2a3742;--brand:#3fbfa9;--soft:#123029;--warn:#ff8b7a;--warnsoft:#331d1a;
--good:#5ac67f;--gold:#e0be5a;--goldsoft:#2b2412}}
:root[data-theme="dark"]{--bg:#10161c;--card:#18212a;--ink:#e8eef3;--muted:#93a3b1;--line:#2a3742;
--brand:#3fbfa9;--soft:#123029;--warn:#ff8b7a;--warnsoft:#331d1a;--good:#5ac67f;--gold:#e0be5a;--goldsoft:#2b2412}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:940px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px;color:var(--brand)}
.sub{color:var(--muted);font-size:13px;margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
background:var(--card);color:var(--ink);font-family:inherit;font-size:15px}
button{padding:11px 16px;border:0;border-radius:9px;background:var(--brand);color:#fff;
font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.full{width:100%;margin-top:16px}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button.sm{padding:6px 12px;font-size:13px}
.err{color:var(--warn);font-size:13.5px;margin-top:10px;min-height:18px}
.ok{color:var(--good);font-size:13.5px;margin-top:10px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.net{background:var(--soft);border:1px solid var(--brand);border-radius:12px;padding:16px;text-align:center;margin:14px 0}
.net .v{font-size:32px;font-weight:700;color:var(--brand)}
.net .l{font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px}
.row:nth-child(odd){background:rgba(127,127,127,.06)}
.row .k{color:var(--muted);font-size:14px}
.row .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row.minus .v{color:var(--warn)}.row.plus .v{color:var(--good)}
.row.total{border-top:1px solid var(--line);margin-top:6px;font-weight:700;background:none!important}
.note{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--brand);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.tag.late{background:var(--warnsoft);color:var(--warn)}
.tag.ok{background:var(--goldsoft);color:var(--gold)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:20px;
padding:8px 14px;font-size:14px;font-weight:500}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.hide{display:none}
.banner{background:var(--goldsoft);color:var(--gold);border:1px solid var(--gold);border-radius:10px;
padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.bad{background:var(--warnsoft);color:var(--warn);border-color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--brand);color:var(--brand)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 24px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.qitem .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
code{background:rgba(127,127,127,.12);padding:1px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<div id="boot" class="card"><p class="sub">جاري التحميل…</p></div>

<div id="login" class="card hide">
  <h1>مرتبات صيدلية أنس نحيلة</h1>
  <p class="sub">ادخل بكود البصمة بتاعك</p>
  <label>كود الموظف</label>
  <input id="u" inputmode="numeric" placeholder="مثال: 38" autocomplete="off">
  <label>الرقم السري</label>
  <input id="p" type="password" autocomplete="off">
  <button class="full" onclick="doLogin()">دخول</button>
  <div class="err" id="loginErr"></div>
  <div class="note">مدير الفرع بيدخل بكلمة <code>admin</code> بدل الكود.</div>
</div>

<div id="emp" class="hide"></div>
<div id="adm" class="hide"></div>

<div class="foot">صيدلية أنس نحيلة — نظام المرتبات</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         createUserWithEmailAndPassword, updatePassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc,
         updateDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = {
  apiKey: "AIzaSyCRumjMVIdmhgkQdFU35a4EDineIIjgfWE",
  authDomain: "pharmacy-payroll.firebaseapp.com",
  projectId: "pharmacy-payroll",
  storageBucket: "pharmacy-payroll.firebasestorage.app",
  messagingSenderId: "7198071549",
  appId: "1:7198071549:web:5068830994e6b073747c94"
};
const DOMAIN = "anaspharmacy.com";
const app = initializeApp(CFG);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const F = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emailFor = code => `emp${code}@${DOMAIN}`;
const defPass = code => 'anas' + (1000 + Number(code));

/* ---------- تطبيع أسماء الأعمدة: الشيت ممكن يتعدل والتطبيق يفضل شغال ---------- */
const norm = s => String(s == null ? '' : s)
  .replace(/[\u064B-\u0652\u0640]/g, '')
  .replace(/[\u0623\u0625\u0622]/g, '\u0627')
  .replace(/\u0629/g, '\u0647')
  .replace(/\(.*?\)/g, '')
  .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, '')
  .toLowerCase();

const PAY_MAP = {};
[['كود الموظف','code'],['اسم الموظف','name'],['سعر الساعة الشهري','rate'],['معدل الساعة الفعلي','hourly'],
 ['الساعات الفعلية','hours'],['ساعات مرحلة','carried'],['أجر الساعات','wage'],['عدد التأخيرات','lates'],
 ['المعفاة','exempt'],['المخصومة بربع يوم','q'],['المخصومة بنص يوم','half'],['خصم التأخير','lateDed'],
 ['أثر التأخير على الساعات','lateHrsVal'],['مرات انصراف مبكر','early'],['خصم الانصراف المبكر','earlyDed'],
 ['أيام غياب بدون إذن','absDays'],['جزاء الغياب','absPen'],['جزاءات إدارية','adminPen'],
 ['إجمالي الخصومات','totalDed'],['إجمالي الحوافز','bonus'],['مسحوبات آجلة','adv'],
 ['صافي المستحق','net'],['أيام محتاجة مراجعة','flags']].forEach(([a,k]) => PAY_MAP[norm(a)] = k);

const DAY_MAP = {};
[['التاريخ','date'],['كود الموظف','code'],['حالة اليوم','state'],['ميعاد الحضور المعتمد','tin'],
 ['ميعاد الانصراف المعتمد','tout'],['بصمة الحضور','pin'],['بصمة الانصراف','pout'],
 ['الساعات المحتسبة','hours'],['دقائق التأخير','late'],['دقائق الانصراف المبكر','early'],
 ['معفى','exempt'],['نسبة خصم التأخير','pct'],['خصم التأخير','lateDed'],
 ['خصم الانصراف المبكر','earlyDed'],['ملاحظة','note'],['تنبيه','alert']].forEach(([a,k]) => DAY_MAP[norm(a)] = k);

const AR_D = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const d2 = n => String(n).padStart(2,'0');
const fmtDate = v => v instanceof Date ? `${d2(v.getDate())}/${d2(v.getMonth()+1)}` : (v || '');
const fmtTime = v => v instanceof Date ? `${d2(v.getHours())}:${d2(v.getMinutes())}` : (v || '');
const dow = v => v instanceof Date ? AR_D[(v.getDay())] : '';

function headerRow(rows, key){
  const k = norm(key);
  for (let i = 0; i < Math.min(rows.length, 12); i++)
    if ((rows[i] || []).some(c => norm(c) === k)) return i;
  return -1;
}

function parseBook(wb){
  const shName = n => wb.SheetNames.find(s => norm(s) === norm(n));
  const grid = n => { const s = wb.Sheets[shName(n)];
    return s ? XLSX.utils.sheet_to_json(s, {header:1, raw:true, cellDates:true, defval:null}) : null; };

  const payG = grid('كشف_المرتب');
  if (!payG) throw new Error('مفيش شيت اسمه كشف_المرتب في الملف');
  const ph = headerRow(payG, 'كود الموظف');
  if (ph < 0) throw new Error('مش لاقي عمود "كود الموظف" في كشف المرتب');
  const phead = payG[ph];

  const guideG = grid('دليل_وافتراضات') || [];
  let ps = null, pe = null;
  guideG.forEach(r => (r || []).forEach((c, j) => {
    if (norm(c).includes(norm('تاريخ بداية الدورة'))) ps = r[j+1];
    if (norm(c).includes(norm('تاريخ نهاية الدورة'))) pe = r[j+1];
  }));
  const toD = v => { if (v instanceof Date) return v;
    if (!v) return null;
    const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2]-1, +m[1]);
    const d = new Date(v); return isNaN(d) ? null : d; };
  ps = toD(ps); pe = toD(pe);
  const period = ps ? `${ps.getFullYear()}-${d2(ps.getMonth()+1)}` : 'unknown';
  const label = (ps && pe) ? `من ${fmtDate(ps)} إلى ${fmtDate(pe)}/${pe.getFullYear()}` : period;

  const jobs = {};
  const empG = grid('الموظفين');
  if (empG){
    const eh = headerRow(empG, 'كود الموظف');
    if (eh >= 0){
      const H = empG[eh];
      const ci = H.findIndex(c => norm(c) === norm('كود الموظف'));
      const ji = H.findIndex(c => norm(c) === norm('الوظيفة'));
      const si = H.findIndex(c => norm(c) === norm('الحالة'));
      for (let i = eh+1; i < empG.length; i++){
        const r = empG[i] || []; if (!r[ci]) continue;
        jobs[String(r[ci]).trim()] = { job: ji >= 0 ? r[ji] : '', status: si >= 0 ? r[si] : '' };
      }
    }
  }

  const people = [];
  for (let i = ph+1; i < payG.length; i++){
    const r = payG[i] || [];
    const o = { extra: [] };
    let has = false;
    phead.forEach((h, j) => {
      if (h == null || h === '') return;
      const key = PAY_MAP[norm(h)];
      let v = r[j];
      const num = (v !== null && v !== '' && !isNaN(+String(v).replace(/,/g,''))) ? +String(v).replace(/,/g,'') : null;
      if (key){ o[key] = (key === 'name') ? v : (num !== null ? num : v); if (key === 'code' && num) has = true; }
      else if (num !== null && Math.abs(num) > 0.004) o.extra.push({ label: String(h).trim(), value: num });
    });
    if (!has) continue;
    const j = jobs[String(o.code).trim()] || {};
    o.job = j.job || ''; o.status = j.status || '';
    o.days = [];
    people.push(o);
  }

  const dayG = grid('البصمة_اليومية');
  if (dayG){
    const dh = headerRow(dayG, 'كود الموظف');
    if (dh >= 0){
      const H = dayG[dh];
      const byCode = {}; people.forEach(p => byCode[String(p.code).trim()] = p);
      for (let i = dh+1; i < dayG.length; i++){
        const r = dayG[i] || []; const d = {};
        H.forEach((h, j) => { const k = DAY_MAP[norm(h)]; if (k) d[k] = r[j]; });
        if (!d.code) continue;
        const p = byCode[String(d.code).trim()]; if (!p) continue;
        const dt = toD(d.date);
        if (ps && pe && dt && (dt < ps || dt > pe)) continue;
        const n = v => { const x = +String(v ?? '').replace(/[^0-9.\-]/g,''); return isNaN(x) ? 0 : x; };
        p.days.push({ date: fmtDate(dt), dow: dow(dt), state: d.state || '',
          tin: fmtTime(d.tin), tout: fmtTime(d.tout), pin: fmtTime(d.pin), pout: fmtTime(d.pout),
          hours: n(d.hours), late: n(d.late), early: n(d.early), exempt: n(d.exempt),
          pct: String(d.pct || '').includes('%') ? n(d.pct)/100 : n(d.pct),
          lateDed: n(d.lateDed), earlyDed: n(d.earlyDed), note: d.note || '', alert: d.alert || '' });
      }
    }
  }
  return { period, label, people };
}

/* ================= تسجيل الدخول ================= */
let ME = null, IS_ADMIN = false, PARSED = null;

window.doLogin = async () => {
  const u = $('u').value.trim(), p = $('p').value;
  $('loginErr').textContent = '';
  if (!u || !p) { $('loginErr').textContent = 'اكتب الكود والرقم السري'; return; }
  const email = /^\d+$/.test(u) ? emailFor(u) : `${u}@${DOMAIN}`;
  try { await signInWithEmailAndPassword(auth, email, p); }
  catch (e) {
    $('loginErr').textContent =
      (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
        ? 'الكود أو الرقم السري غلط' : 'مشكلة في الدخول: ' + e.code;
  }
};
window.doOut = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  $('boot').classList.add('hide');
  ['login','emp','adm'].forEach(x => $(x).classList.add('hide'));
  if (!user) { $('p').value = ''; $('login').classList.remove('hide'); return; }
  ME = user;
  try { IS_ADMIN = (await getDoc(doc(db, 'admins', user.uid))).exists(); }
  catch (e) { IS_ADMIN = false; }
  if (IS_ADMIN) { $('adm').classList.remove('hide'); renderAdmin(); }
  else { $('emp').classList.remove('hide'); await renderEmp(); }
});

/* ================= شاشة الموظف ================= */
async function latestPeriod(){
  const snap = await getDocs(collection(db, 'periods'));
  const list = [];
  snap.forEach(d => { const v = d.data(); if (v.published) list.push({ id: d.id, ...v }); });
  list.sort((a, b) => a.id < b.id ? 1 : -1);
  return list;
}

async function renderEmp(){
  $('emp').innerHTML = `<div class="card"><p class="sub">جاري تحميل كشفك…</p></div>`;
  let periods = [];
  try { periods = await latestPeriod(); } catch(e){}
  if (!periods.length){
    $('emp').innerHTML = `<div class="card"><div class="hdr"><h1>أهلاً بيك</h1>
      <button class="ghost sm" onclick="doOut()">خروج</button></div>
      <div class="banner">لسه مفيش كشف منشور. هيظهرلك أول ما مدير الفرع يعتمده.</div></div>`;
    return;
  }
  let pi = 0, docSnap = null;
  for (; pi < periods.length; pi++){
    try {
      const s = await getDoc(doc(db, 'payslips', periods[pi].id, 'employees', ME.uid));
      if (s.exists()) { docSnap = s; break; }
    } catch(e){}
  }
  if (!docSnap){
    $('emp').innerHTML = `<div class="card"><div class="hdr"><h1>أهلاً بيك</h1>
      <button class="ghost sm" onclick="doOut()">خروج</button></div>
      <div class="banner">مفيش كشف باسمك في آخر فترة منشورة. كلّم مدير الفرع.</div></div>`;
    return;
  }
  const d = docSnap.data(), P = periods[pi];
  const days = d.days || [];

  let br = '';
  const R = (k, v, c) => `<div class="row ${c||''}"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
  br += R('ساعات العمل الفعلية', F(d.hours) + ' ساعة');
  if (d.carried) br += R('ساعات مرحّلة من شهر سابق', F(d.carried) + ' ساعة');
  br += R('معدل الساعة', F(d.hourly) + ' ج');
  br += R('أجر الساعات', F(d.wage) + ' ج', 'plus');
  (d.extra || []).forEach(x => br += R(x.label, (x.value < 0 ? '− ' : '+ ') + F(Math.abs(x.value)) + ' ج',
    x.value < 0 ? 'minus' : 'plus'));
  if (d.lateDed) br += R(`خصم التأخير (${(d.q||0)+(d.half||0)} مرة)`, '− ' + F(d.lateDed) + ' ج', 'minus');
  if (d.earlyDed) br += R(`خصم الانصراف المبكر (${d.early||0} مرة)`, '− ' + F(d.earlyDed) + ' ج', 'minus');
  if (d.absPen) br += R(`جزاء غياب (${d.absDays||0} يوم)`, '− ' + F(d.absPen) + ' ج', 'minus');
  if (d.adminPen) br += R('جزاءات إدارية', '− ' + F(d.adminPen) + ' ج', 'minus');
  if (d.adv) br += R('مسحوبات آجلة', '− ' + F(d.adv) + ' ج', 'minus');
  br += R('صافي المستحق', F(d.net) + ' ج', 'total');

  const lt = days.filter(x => x.lateDed || x.earlyDed || x.exempt || x.late >= 16);
  let lrows = lt.map(x => `<tr><td>${esc(x.date)} ${esc(x.dow)}</td><td class="num">${esc(x.tin)}</td>
    <td class="num">${esc(x.pin)}</td><td class="num">${x.late ? x.late + ' د' : '—'}</td>
    <td class="num">${x.early ? x.early + ' د' : '—'}</td>
    <td>${x.exempt ? '<span class="tag ok">معفى</span>' :
        (x.pct ? `<span class="tag late">${x.pct >= 0.5 ? 'نص يوم' : 'ربع يوم'}</span>` : '—')}</td>
    <td class="num">${(x.lateDed + x.earlyDed) ? F(x.lateDed + x.earlyDed) + ' ج' : '—'}</td></tr>`).join('');
  if (!lrows) lrows = '<tr><td colspan="7">مفيش تأخيرات ولا انصراف مبكر — تمام</td></tr>';

  const drows = days.map(x => `<tr><td>${esc(x.date)} ${esc(x.dow)}</td><td>${esc(x.state)}</td>
    <td class="num">${esc(x.pin) || '—'}</td><td class="num">${esc(x.pout) || '—'}</td>
    <td class="num">${x.hours ? F(x.hours) : '—'}</td>
    <td style="white-space:normal">${esc(x.note)}</td></tr>`).join('');

  $('emp').innerHTML = `
  <div class="card">
    <div class="hdr"><div><h1>${esc(d.name)}</h1><p class="sub">${esc(d.job || '')}</p></div>
      <button class="ghost sm" onclick="doOut()">خروج</button></div>
    <div class="net"><div class="l">صافي المستحق</div><div class="v">${F(d.net)} ج</div>
      <div class="l">${esc(P.label || P.id)}</div></div>
    ${d.flags ? `<div class="banner">فيه ${d.flags} يوم لسه تحت المراجعة ومش داخل في الحساب.</div>` : ''}
    ${!d.rate ? `<div class="banner bad">سعر الساعة لسه مش متسجل — المبالغ ناقصة. كلّم مدير الفرع.</div>` : ''}
  </div>
  <div class="tabs">
    <button id="et1" class="on" onclick="etab(1)">مفردات المرتب</button>
    <button id="et2" onclick="etab(2)">التأخيرات</button>
    <button id="et3" onclick="etab(3)">أيام الشهر</button>
    <button id="et4" onclick="etab(4)">حسابي</button>
  </div>
  <div id="ep1" class="card"><h2>مفردات المرتب</h2><div class="rows">${br}</div>
    <div class="note">أجر الساعات = معدل الساعة × إجمالي الساعات الفعلية. معدل الساعة = سعر الساعة الشهري ÷ ٢٦.
    ${d.lateHrsVal ? ' وقيمة الوقت الضائع بسبب التأخير ' + F(d.lateHrsVal) + ' ج، محسومة أصلاً ضمن الساعات.' : ''}</div></div>
  <div id="ep2" class="card hide"><h2>التأخيرات والانصراف المبكر</h2>
    <div class="rows">
      ${R('عدد التأخيرات', d.lates || 0)}${R('المعفاة (الأكبر)', d.exempt || 0)}
      ${R('المخصومة بربع يوم', d.q || 0)}${R('المخصومة بنص يوم', d.half || 0)}
      ${R('مرات الانصراف المبكر', d.early || 0)}
    </div>
    <div class="scroll" style="margin-top:12px"><table>
      <tr><th>اليوم</th><th>الميعاد</th><th>البصمة</th><th>تأخير</th><th>انصراف مبكر</th><th>الحالة</th><th>الخصم</th></tr>
      ${lrows}</table></div>
    <div class="note">التأخير من ١٦ دقيقة فأكثر بيتحسب. أكبر تأخيرين في أول ٦ تأخيرات في الشهر معفيين،
    الباقي ربع يوم، ومن التأخير السابع نص يوم.</div></div>
  <div id="ep3" class="card hide"><h2>أيام الشهر</h2><div class="scroll"><table>
    <tr><th>اليوم</th><th>الحالة</th><th>حضور</th><th>انصراف</th><th>ساعات</th><th>ملاحظة</th></tr>
    ${drows}</table></div></div>
  <div id="ep4" class="card hide"><h2>تغيير الرقم السري</h2>
    <label>الرقم السري الجديد (٦ حروف أو أرقام على الأقل)</label>
    <input id="np" type="password"><button class="full" onclick="chpass()">حفظ</button>
    <div class="err" id="npErr"></div></div>
  <div class="card"><h2>عندك استفسار؟</h2>
    <p class="sub">لو فيه بند مش مظبوط، اكتبه وهيوصل لمدير الفرع.</p>
    <textarea id="qt" rows="3" placeholder="مثال: يوم ٧ سبتمبر كان عندي إذن"></textarea>
    <button class="full" onclick="sendQ('${esc(P.id)}')">إرسال</button>
    <div class="ok" id="qOk"></div></div>`;
}

window.etab = n => [1,2,3,4].forEach(i => {
  $('ep'+i).classList.toggle('hide', i !== n);
  $('et'+i).classList.toggle('on', i === n);
});

window.chpass = async () => {
  const v = $('np').value;
  if (!v || v.length < 6) { $('npErr').textContent = 'لازم ٦ على الأقل'; return; }
  try { await updatePassword(auth.currentUser, v); $('npErr').style.color = 'var(--good)';
    $('npErr').textContent = 'اتغير. استخدمه المرة الجاية.'; $('np').value = ''; }
  catch (e) { $('npErr').textContent = e.code === 'auth/requires-recent-login'
    ? 'اقفل وادخل تاني وبعدين غيّره' : 'مشكلة: ' + e.code; }
};

window.sendQ = async period => {
  const t = $('qt').value.trim(); if (!t) return;
  try {
    const s = await getDoc(doc(db, 'staff', ME.uid));
    const st = s.exists() ? s.data() : {};
    await addDoc(collection(db, 'queries'), { uid: ME.uid, code: st.code || '', name: st.name || '',
      period, text: t, at: serverTimestamp(), status: 'جديد' });
    $('qt').value = ''; $('qOk').textContent = 'اتبعت لمدير الفرع.';
  } catch (e) { $('qOk').style.color = 'var(--warn)'; $('qOk').textContent = 'مبعتش: ' + e.code; }
};

/* ================= لوحة الإدارة ================= */
function renderAdmin(){
  $('adm').innerHTML = `
  <div class="card"><div class="hdr"><div><h1>لوحة مدير الفرع</h1>
    <p class="sub">رفع كشف المرتب واعتماده ونشره للفريق</p></div>
    <button class="ghost sm" onclick="doOut()">خروج</button></div></div>
  <div class="tabs">
    <button id="at1" class="on" onclick="atab(1)">نشر كشف</button>
    <button id="at2" onclick="atab(2)">الموظفين</button>
    <button id="at3" onclick="atab(3)">الاستفسارات</button>
  </div>
  <div id="ap1" class="card">
    <h2>١. ارفع ملف الإكسيل</h2>
    <div class="drop" id="drop">اضغط هنا واختار ملف نظام المرتبات (.xlsx)</div>
    <input id="file" type="file" accept=".xlsx,.xlsm" class="hide">
    <div class="err" id="upErr"></div>
    <div id="preview"></div>
  </div>
  <div id="ap2" class="card hide"><h2>الموظفين وحساباتهم</h2><div id="staffBox"><p class="sub">جاري التحميل…</p></div></div>
  <div id="ap3" class="card hide"><h2>استفسارات الموظفين</h2><div id="qBox"><p class="sub">جاري التحميل…</p></div></div>`;
  $('drop').onclick = () => $('file').click();
  $('file').onchange = onFile;
}
window.atab = n => { [1,2,3].forEach(i => {
    $('ap'+i).classList.toggle('hide', i !== n); $('at'+i).classList.toggle('on', i === n); });
  if (n === 2) loadStaff(); if (n === 3) loadQ(); };

function onFile(ev){
  const f = ev.target.files[0]; if (!f) return;
  $('upErr').textContent = ''; $('preview').innerHTML = '<p class="sub">جاري القراءة…</p>';
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
      PARSED = parseBook(wb);
      showPreview();
    } catch (err) { PARSED = null; $('preview').innerHTML = '';
      $('upErr').textContent = 'مقدرتش أقرا الملف: ' + err.message; }
  };
  rd.readAsArrayBuffer(f);
}

function showPreview(){
  const P = PARSED;
  const bad = P.people.filter(p => !p.rate);
  const flag = P.people.filter(p => p.flags > 0);
  const left = P.people.filter(p => String(p.status || '').includes('ترك'));
  let w = '';
  if (bad.length) w += `<div class="banner bad">${bad.length} موظف من غير سعر ساعة (${bad.map(x=>esc(x.name)).join('، ')}) — مرتبهم هيطلع صفر.</div>`;
  if (flag.length) w += `<div class="banner">${flag.length} موظف عندهم أيام تحت المراجعة: ${flag.map(x=>esc(x.name)+' ('+x.flags+')').join('، ')}</div>`;
  if (left.length) w += `<div class="banner">${left.map(x=>esc(x.name)).join('، ')} — الحالة "ترك العمل". اتأكد إنها تصفية نهائية.</div>`;

  const rows = P.people.map(p => `<tr><td>${p.code}</td><td>${esc(p.name)}</td>
    <td class="num">${F(p.hours)}</td><td class="num">${F(p.wage)}</td>
    <td class="num">${p.lates || 0}</td><td class="num">${F(p.totalDed)}</td>
    <td class="num"><b>${F(p.net)}</b></td>
    <td>${p.flags ? '<span class="tag late">' + p.flags + '</span>' : '—'}</td></tr>`).join('');
  const tot = P.people.reduce((a, p) => a + (+p.net || 0), 0);

  $('preview').innerHTML = `
    <h2 style="margin-top:18px">٢. راجع قبل النشر</h2>
    <p class="sub">الفترة: <b>${esc(P.label)}</b> — عدد الموظفين: <b>${P.people.length}</b> — إجمالي الصافي: <b>${F(tot)} ج</b></p>
    ${w}
    <div class="scroll" style="margin-top:10px"><table>
      <tr><th>الكود</th><th>الاسم</th><th>ساعات</th><th>أجر</th><th>تأخيرات</th><th>خصومات</th><th>الصافي</th><th>مراجعة</th></tr>
      ${rows}</table></div>
    <h2 style="margin-top:18px">٣. اعتماد ونشر</h2>
    <p class="sub">بعد النشر كل موظف هيشوف كشفه هو بس. ينفع ترفع تاني وتنشر بتعديلات، هيتحدّث عنده.</p>
    <button class="full" id="pubBtn" onclick="publish()">اعتماد ونشر للفريق</button>
    <div class="err" id="pubMsg"></div><div id="pubOut"></div>`;
}

window.publish = async () => {
  if (!PARSED) return;
  const btn = $('pubBtn'); btn.disabled = true;
  const msg = $('pubMsg'); msg.style.color = 'var(--muted)';
  const P = PARSED;

  let map = {};
  try {
    const snap = await getDocs(collection(db, 'staff'));
    snap.forEach(d => { const v = d.data(); if (v.code != null) map[String(v.code).trim()] = d.uid || d.id; });
  } catch (e) { msg.style.color = 'var(--warn)';
    msg.textContent = 'مقدرتش أقرا قايمة الموظفين: ' + e.code; btn.disabled = false; return; }

  let sec = null, secAuth = null;
  const news = [];
  let done = 0;

  for (const p of P.people){
    const code = String(p.code).trim();
    msg.textContent = `جاري النشر… ${done}/${P.people.length}`;
    let uid = map[code];
    if (!uid){
      try {
        if (!sec) { sec = initializeApp(CFG, 'sec'); secAuth = getAuth(sec); }
        const cr = await createUserWithEmailAndPassword(secAuth, emailFor(code), defPass(code));
        uid = cr.user.uid;
        await signOut(secAuth);
        news.push({ code, name: p.name, pass: defPass(code) });
      } catch (e) {
        if (e.code === 'auth/email-already-in-use'){
          msg.style.color = 'var(--warn)';
          msg.textContent = `الكود ${code} له حساب قديم بس مش مربوط. امسح المستخدم ${emailFor(code)} من Authentication وارفع تاني.`;
          btn.disabled = false; return;
        }
        msg.style.color = 'var(--warn)';
        msg.textContent = `مشكلة في إنشاء حساب الكود ${code}: ${e.code}`;
        btn.disabled = false; return;
      }
      try { await setDoc(doc(db, 'staff', uid), { code, name: p.name, job: p.job || '' }, { merge:true }); } catch(e){}
      map[code] = uid;
    } else {
      try { await setDoc(doc(db, 'staff', uid), { code, name: p.name, job: p.job || '' }, { merge:true }); } catch(e){}
    }

    const rec = Object.assign({}, p);
    rec.uid = uid; rec.period = P.period; rec.periodLabel = P.label; rec.publishedAt = new Date().toISOString();
    try { await setDoc(doc(db, 'payslips', P.period, 'employees', uid), rec); }
    catch (e) { msg.style.color = 'var(--warn)';
      msg.textContent = `مقدرتش أكتب كشف ${p.name}: ${e.code}`; btn.disabled = false; return; }
    done++;
  }

  try {
    await setDoc(doc(db, 'periods', P.period),
      { label: P.label, published: true, count: done, at: serverTimestamp() }, { merge:true });
  } catch (e) { msg.style.color = 'var(--warn)'; msg.textContent = 'مقدرتش أعلّم الفترة كمنشورة: ' + e.code;
    btn.disabled = false; return; }

  msg.style.color = 'var(--good)';
  msg.textContent = `تم نشر ${done} كشف. الموظفين يقدروا يدخلوا دلوقتي.`;
  btn.disabled = false;

  if (news.length){
    $('pubOut').innerHTML = `<div class="banner" style="margin-top:12px">
      اتعمل ${news.length} حساب جديد. وزّع الأرقام دي على أصحابها — كل واحد يقدر يغيّرها من "حسابي".</div>
      <div class="scroll"><table><tr><th>الكود</th><th>الاسم</th><th>الرقم السري المبدئي</th></tr>
      ${news.map(n => `<tr><td>${esc(n.code)}</td><td>${esc(n.name)}</td><td><code>${esc(n.pass)}</code></td></tr>`).join('')}
      </table></div>`;
  }
};

async function loadStaff(){
  try {
    const snap = await getDocs(collection(db, 'staff'));
    const rows = [];
    snap.forEach(d => { const v = d.data(); rows.push(`<tr><td>${esc(v.code)}</td><td>${esc(v.name)}</td>
      <td>${esc(v.job || '')}</td><td><code>${esc(emailFor(v.code))}</code></td></tr>`); });
    $('staffBox').innerHTML = rows.length
      ? `<div class="scroll"><table><tr><th>الكود</th><th>الاسم</th><th>الوظيفة</th><th>حساب الدخول</th></tr>
         ${rows.join('')}</table></div>
         <div class="note">لو موظف نسي رقمه السري: Firebase Console ← Authentication ← Users ← دوس على حسابه ← Reset password.
         التطبيق مش بيقدر يغيّر رقم سري لحد تاني، ده مقصود عشان الأمان.</div>`
      : `<p class="sub">لسه مفيش حسابات. هتتعمل لوحدها أول ما تنشر أول كشف.</p>`;
  } catch (e) { $('staffBox').innerHTML = `<p class="err">مشكلة: ${e.code}</p>`; }
}

async function loadQ(){
  try {
    const snap = await getDocs(collection(db, 'queries'));
    const list = []; snap.forEach(d => list.push({ id: d.id, ...d.data() }));
    list.sort((a, b) => (b.at?.seconds || 0) - (a.at?.seconds || 0));
    $('qBox').innerHTML = list.length ? list.map(q => `<div class="qitem">
      <div class="meta">${esc(q.name || '')} (${esc(q.code || '')}) — ${esc(q.period || '')}
        ${q.at?.seconds ? ' — ' + new Date(q.at.seconds*1000).toLocaleString('ar-EG') : ''}</div>
      <div>${esc(q.text)}</div>
      <div style="margin-top:8px">${q.status === 'تم' ? '<span class="tag ok">تم</span>'
        : `<button class="sm" onclick="closeQ('${q.id}')">علّمه كمتحل</button>`}</div></div>`).join('')
      : `<p class="sub">مفيش استفسارات.</p>`;
  } catch (e) { $('qBox').innerHTML = `<p class="err">مشكلة: ${e.code}</p>`; }
}
window.closeQ = async id => { try { await updateDoc(doc(db, 'queries', id), { status: 'تم' }); loadQ(); } catch(e){} };
</script>
</body>
</html>
