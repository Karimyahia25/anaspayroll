<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرتبات صيدلية أنس نحيلة</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBF1F5; --card:#FFFFFF; --ink:#0F1B2D; --muted:#66768A; --line:#E4EBF2;
  --green:#0B8577; --green-deep:#0A6B60; --green-soft:#E6F6F3; --mint:#2DD4BF; --navy:#0F1B2D; --on-green:#fff;
  --amber:#B0761F; --amber-soft:#FAF1DF; --red:#A32E1E; --red-soft:#FBE9E5;
  --shadow:0 1px 2px rgba(18,32,27,.05), 0 8px 24px -16px rgba(18,32,27,.28);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0B1220; --card:#131C2E; --ink:#E7EEF7; --muted:#8FA1B8; --line:#233047;
  --green:#3DDBC4; --green-deep:#8FEDDD; --green-soft:#0F2B33; --navy:#070D18; --on-green:#042019; --mint:#2DD4BF;
  --amber:#E0B25A; --amber-soft:#2B2413; --red:#FF9483; --red-soft:#331C18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#0B1220; --card:#131C2E; --ink:#E7EEF7; --muted:#8FA1B8; --line:#233047;
  --green:#3DDBC4; --green-deep:#8FEDDD; --green-soft:#0F2B33; --navy:#070D18; --on-green:#042019; --mint:#2DD4BF;
  --amber:#E0B25A; --amber-soft:#2B2413; --red:#FF9483; --red-soft:#331C18;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Alexandria","IBM Plex Sans Arabic","Segoe UI",sans-serif;
  font-size:15px; line-height:1.65; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 8px}

h1,h2,.net .v,.tabs button,.stat .sv{font-family:"Alexandria","IBM Plex Sans Arabic",sans-serif;letter-spacing:-.01em}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px}
h2{font-size:15.5px;font-weight:600;color:var(--green-deep);margin:0 0 14px;
   display:flex;align-items:center;gap:9px}
h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--green);flex:0 0 auto}
.sub{color:var(--muted);font-size:13px;margin:0}

.card{--pad:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:var(--pad);margin-bottom:14px;box-shadow:var(--shadow)}
/* شاشة الدخول: شريط أخضر زي لصقة الروشتة */
#login{overflow:hidden}
#login>h1{margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 0;padding:26px var(--pad) 5px;
  background:linear-gradient(160deg,var(--green) 0%,#2AAE86 100%);color:#fff;font-size:20px}
#login>.sub{margin:0 calc(var(--pad)*-1) 8px;padding:0 var(--pad) 22px;
  background:linear-gradient(160deg,#219E79 0%,#2AAE86 100%);color:rgba(255,255,255,.88)}
#login>label:first-of-type{margin-top:4px}

label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 5px;font-weight:500}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;
  transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

button{padding:11px 18px;border:0;border-radius:8px;background:var(--green);color:var(--on-green);
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
  transition:background .15s,transform .06s}
button:hover{background:var(--green-deep)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
button.full{width:100%;margin-top:18px}
button.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
button.ghost:hover{background:var(--green-soft);border-color:var(--green)}
button.sm{padding:6px 13px;font-size:13px}

.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px}
.ok{color:var(--green);font-size:13.5px;margin-top:10px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* ===== لوحة الصافي: على شكل إيصال ===== */
.net{position:relative;margin:18px 0 6px;padding:22px 18px 20px;text-align:center;
  background:var(--green-soft);border-radius:10px;
  border-top:2px dashed color-mix(in srgb,var(--green) 45%,transparent);
  border-bottom:2px dashed color-mix(in srgb,var(--green) 45%,transparent);
  animation:print .5s cubic-bezier(.2,.7,.3,1) both}
.net::before,.net::after{content:"";position:absolute;top:-9px;bottom:-9px;width:16px;
  background:radial-gradient(circle at 50% 0,var(--card) 8px,transparent 8px),
             radial-gradient(circle at 50% 100%,var(--card) 8px,transparent 8px)}
.net::before{inset-inline-start:-8px}
.net::after{inset-inline-end:-8px}
.net .v{font-size:38px;font-weight:600;color:var(--green);line-height:1.15;letter-spacing:-.02em;
  display:block;margin:2px 0 4px}
.net .l{font-size:12.5px;color:var(--muted)}
@keyframes print{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}

/* ===== سطور المفردات بخط منقّط ===== */
.rows{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.row{position:relative;display:flex;justify-content:space-between;gap:12px;padding:8px 0;align-items:baseline}
.row::before{content:"";position:absolute;inset-inline:0;bottom:.62em;
  border-bottom:1px dotted var(--line)}
.row .k,.row .v{position:relative;background:var(--card);padding-inline:4px}
.row .k{color:var(--muted);font-size:13.5px}
.row .v{font-weight:600;white-space:nowrap;font-family:"IBM Plex Sans Arabic",sans-serif}
.row.minus .v{color:var(--red)}
.row.plus .v{color:var(--green)}
.row.total{margin-top:8px;padding-top:12px;border-top:1.5px solid var(--ink)}
.row.total::before{display:none}
.row.total .k{color:var(--ink);font-weight:600;font-size:14.5px}
.row.total .v{font-size:17px}

.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:14px;padding-top:12px;
  border-top:1px solid var(--line)}

/* ===== الجداول ===== */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
th,td{padding:9px 11px;text-align:center;white-space:nowrap}
th{background:var(--green-soft);color:var(--green-deep);font-weight:600;font-size:12.5px;
  position:sticky;top:0;z-index:1}
td{border-top:1px solid var(--line)}
tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:color-mix(in srgb,var(--paper) 45%,transparent)}
table tr:hover td{background:var(--green-soft)}
td.num{font-variant-numeric:tabular-nums;font-family:"IBM Plex Sans Arabic",sans-serif}

.tag{display:inline-block;padding:2px 9px;border-radius:14px;font-size:11.5px;font-weight:600}
.tag.late{background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--amber-soft);color:var(--amber)}

/* ===== التبويبات ===== */
.tabs{display:flex;gap:2px;margin-bottom:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:transparent;color:var(--muted);border:0;border-radius:0;
  padding:9px 15px;font-size:14px;font-weight:500;position:relative}
.tabs button:hover{background:transparent;color:var(--ink)}
.tabs button::after{content:"";position:absolute;inset-inline:10px;bottom:-1px;height:2px;
  background:var(--green);border-radius:2px;transform:scaleX(0);transition:transform .2s ease}
.tabs button.on{color:var(--green);font-weight:600}
.tabs button.on::after{transform:scaleX(1)}

.hide{display:none}
.banner{background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  border-radius:9px;padding:11px 13px;font-size:13px;margin-bottom:12px;line-height:1.6}
.banner.bad{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,transparent)}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px;text-align:center;
  color:var(--muted);cursor:pointer;font-size:14px;transition:border-color .15s,background .15s,color .15s}
.drop:hover{border-color:var(--green);color:var(--green);background:var(--green-soft)}

.qitem{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:9px}
.qitem .meta{font-size:12px;color:var(--muted);margin-bottom:5px}
.qitem.void{opacity:.55}
.cdet{padding:4px 2px 8px}
.cdh{font-weight:600;font-size:13px;margin:14px 0 2px;color:var(--ink)}
.cdwrap{position:sticky;inset-inline-start:0;width:min(560px,calc(100vw - 72px));padding:4px 14px 12px;background:var(--card)}
.tag.good{background:var(--green-soft);color:var(--green)}
.tag.mid{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.cfh{font-size:14.5px;margin:22px 0 6px;color:var(--ink)}
label.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);margin:6px 0 0;min-height:44px;cursor:pointer}
label.chk input{width:22px;height:22px;margin:0;flex:none}
.dens{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.den{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.den span{font-weight:600;font-size:13.5px;min-width:44px}
.den b{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:500}
.exprow{display:grid;grid-template-columns:1.2fr 1.6fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:560px){.exprow{grid-template-columns:1fr 1fr}}
.cfsum{margin-top:18px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.cfsum .row .k,.cfsum .row .v{background:var(--paper)}
.sfform{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:10px}
tr.clk{cursor:pointer}
tr.clk:hover td,tr.sel td{background:var(--green-soft)}
details summary{cursor:pointer;color:var(--green);font-size:13px;font-weight:600}
code{background:var(--green-soft);color:var(--green);padding:2px 7px;border-radius:5px;
  font-size:12.5px;font-family:"IBM Plex Sans Arabic",monospace;font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:14px 0 28px;letter-spacing:.01em}


/* ===== بطاقات الأرقام والرسومات ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  display:flex;flex-direction:column;gap:3px}
.stat.hi{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.stat.click{cursor:pointer;transition:border-color .15s,transform .06s}
.stat.click:hover{border-color:var(--green)}
.stat.click:active{transform:translateY(1px)}
.stat.click .sl::after{content:" ⌄";color:var(--muted);font-size:11px}
.stat.clk{cursor:pointer;transition:border-color .15s,transform .06s}
.stat.clk:hover{border-color:var(--green)}
.stat.clk:active{transform:translateY(1px)}
.stat .sl{font-size:12px;color:var(--muted)}
.stat .sv{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.3}
.stat.hi .sv{color:var(--green-deep)}
.stat .ss{font-size:11.5px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.bar-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.bar-head .bn{font-weight:500}
.bar-head .bv{color:var(--muted);font-variant-numeric:tabular-nums}
.bar-track{height:9px;border-radius:5px;background:var(--paper);overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transform-origin:right center;
  animation:grow .55s cubic-bezier(.2,.7,.3,1) both}
.bar-note{font-size:11.5px;color:var(--muted);margin-top:3px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.chart{margin:10px 0 4px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.spark{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1s ease-out .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ring{animation:ring .8s cubic-bezier(.2,.7,.3,1) both}
@keyframes ring{from{stroke-dasharray:0 999}}
.donut{display:flex;flex-direction:column;align-items:center;gap:4px}
.donut svg{max-width:150px}
.dlabel{font-size:12.5px;color:var(--muted);text-align:center}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:center}
@media (max-width:620px){.split{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}


.empcard{margin-top:16px;border-top:2px solid var(--green);padding-top:14px}
.sec{border:1px solid var(--line);border-radius:10px;margin-top:9px;overflow:hidden}
.secH{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--paper);color:var(--ink);border:0;border-radius:0;padding:11px 14px;
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:start}
.secH:hover{background:var(--green-soft)}
.secH .ar{transition:transform .2s;color:var(--muted)}
.secH.open .ar{transform:rotate(180deg)}
.secB{padding:12px 14px}

@media (max-width:520px){
  .wrap{padding:14px 12px 4px}
  .card{--pad:16px;border-radius:11px}
  .net .v{font-size:32px}
  h1{font-size:19px}
}

/* ===== ريفريش التصميم (أكتوبر) — سايد بار + كروت مدورة + سلايد ===== */
body{background:radial-gradient(1100px 420px at 85% -80px,color-mix(in srgb,var(--mint) 22%,transparent),transparent 70%),
  radial-gradient(900px 380px at 5% -60px,color-mix(in srgb,#8B7CFF 14%,transparent),transparent 70%),var(--paper);
  background-attachment:fixed}
.card{border-radius:20px;border-color:transparent;padding:calc(var(--pad) + 2px);
  box-shadow:0 1px 2px rgba(15,27,45,.04),0 14px 34px -22px rgba(15,27,45,.28);
  animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:22px}
h2{color:var(--ink)}
h2::before{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px color-mix(in srgb,var(--mint) 25%,transparent)}
button{border-radius:999px;padding:11px 22px}
button.ghost{border-radius:999px;background:var(--card)}
input,select,textarea{border-radius:12px;background:color-mix(in srgb,var(--paper) 55%,var(--card))}
.banner{border-radius:14px}
.scroll{border-radius:14px}
th{background:color-mix(in srgb,var(--paper) 70%,var(--card));color:var(--muted)}

/* بطاقة الصافي: كارت محفظة */
.net{border:0;border-radius:22px;padding:26px 22px 22px;color:#fff;text-align:start;overflow:hidden;
  background:linear-gradient(135deg,#0F2C45 0%,#0B8577 58%,#2DD4BF 120%);
  box-shadow:0 22px 40px -22px rgba(11,133,119,.7)}
.net::before,.net::after{content:"";position:absolute;border-radius:50%;pointer-events:none;
  top:auto;bottom:auto;inset-inline-start:auto;background:rgba(255,255,255,.1)}
.net::before{width:190px;height:190px;inset-inline-end:-50px;top:-70px}
.net::after{width:120px;height:120px;inset-inline-end:60px;bottom:-60px;background:rgba(255,255,255,.08)}
.net .v{color:#fff;font-size:40px;position:relative;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.net .l{color:rgba(255,255,255,.82);position:relative}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}

/* كروت الأرقام */
.stat{border:0;border-radius:18px;background:var(--card);
  box-shadow:0 1px 2px rgba(15,27,45,.05),0 10px 24px -18px rgba(15,27,45,.35);
  transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(15,27,45,.4)}
.stat.hi{background:linear-gradient(135deg,var(--green-soft),color-mix(in srgb,var(--mint) 20%,var(--card)))}
.bar-track{height:10px;border-radius:6px}

/* التبويبات: أقراص */
.tabs{border:0;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border-radius:999px;padding:9px 18px;background:var(--card);color:var(--muted);
  box-shadow:0 1px 2px rgba(15,27,45,.06);transition:background .2s,color .2s,transform .2s}
.tabs button::after{display:none}
.tabs button:hover{background:var(--green-soft);color:var(--green)}
.tabs button.on{background:var(--navy);color:#fff;transform:translateY(-1px)}
.tabs button.on:hover{background:var(--navy);color:#fff}

/* سلايد بين التبويبات */
.slide{animation:slidein .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(var(--sx,40px))}to{opacity:1;transform:none}}

/* الكمبيوتر: سايد بار غامق */
@media (min-width:900px){
  .wrap{max-width:1180px;padding-top:28px}
  #emp:not(.hide),#adm:not(.hide){display:grid;grid-template-columns:232px minmax(0,1fr);column-gap:22px;align-items:start}
  #emp>*,#adm>*{grid-column:2}
  #emp>.tabs,#adm>.tabs{grid-column:1;grid-row:1/span 30;position:sticky;top:20px;flex-direction:column;
    overflow:visible;background:var(--navy);border-radius:22px;padding:18px 12px;gap:4px;margin:0;
    box-shadow:0 24px 40px -26px rgba(15,27,45,.8)}
  #emp>.tabs::before,#adm>.tabs::before{content:"نحيلة · المرتبات";color:#fff;font-weight:700;font-size:15px;
    padding:6px 12px 14px;font-family:Alexandria,sans-serif}
  .tabs button{background:transparent;color:rgba(255,255,255,.66);box-shadow:none;border-radius:14px;
    text-align:start;padding:12px 14px}
  .tabs button:hover{background:rgba(255,255,255,.08);color:#fff}
  .tabs button.on,.tabs button.on:hover{background:linear-gradient(135deg,#0B8577,#2DD4BF);color:#04201B;transform:none;font-weight:700}
}
@media (max-width:899px){
  .tabs{position:sticky;top:0;z-index:5;margin-inline:-12px;padding:8px 12px;
    background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px)}
}
#login{border-radius:24px;max-width:440px;margin:6vh auto 14px}
#login>h1,#login>.sub{background:linear-gradient(135deg,#0F2C45 0%,#0B8577 70%,#2DD4BF 130%)}

/* ===== محفظة الكروت (Paylette) ===== */
.wallet{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:18px calc(var(--pad) * -1) 0;padding:6px calc(var(--pad) + 2px) 14px;scroll-padding-inline:calc(var(--pad) + 2px)}
.wallet::-webkit-scrollbar{display:none}
.wcard{flex:0 0 74%;max-width:300px;scroll-snap-align:center;position:relative;overflow:hidden;cursor:pointer;
  border-radius:24px;padding:20px 20px 18px;min-height:150px;color:#fff;display:flex;flex-direction:column;gap:4px;
  transform:scale(.92);opacity:.72;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s,box-shadow .35s;
  box-shadow:0 14px 26px -18px rgba(15,27,45,.6)}
.wcard.act{transform:scale(1);opacity:1;box-shadow:0 26px 40px -20px rgba(15,27,45,.7)}
.wcard::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);
  inset-inline-end:-40px;top:-60px;pointer-events:none}
.wcard .wt{font-size:13px;opacity:.85;position:relative}

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
         createUserWithEmailAndPassword, updatePassword }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc,
         updateDoc, deleteDoc, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CFG = {
  apiKey: "AIzaSyCRumjMVIdmhgkQdFU35a4EDineIIjgfWE",
  authDomain: "pharmacy-payroll.firebaseapp.com",
  projectId: "pharmacy-payroll",
  storageBucket: "pharmacy-payroll.firebasestorage.app",
  messagingSenderId: "7198071549",
  appId: "1:7198071549:web:5068830994e6b073747c94"
};
const DOMAIN = "anaspharmacy.com";
const app = initializeApp(CFG);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const F = n => Math.round(+n || 0).toLocaleString('ar-EG');
const HN = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const emailFor = code => `emp${code}@${DOMAIN}`;
const defPass = code => 'anas' + (1000 + Number(code));

/* ---------- تطبيع أسماء الأعمدة: الشيت ممكن يتعدل والتطبيق يفضل شغال ---------- */
const norm = s => String(s == null ? '' : s)
  .replace(/[\u064B-\u0652\u0640]/g, '')
  .replace(/[\u0623\u0625\u0622]/g, '\u0627')
  .replace(/\u0629/g, '\u0647')
  .replace(/\(.*?\)/g, '')
  .replace(/[^\u0600-\u06FFa-zA-Z0-9]/g, '')
  .toLowerCase();

const PAY_MAP = {};
[['كود الموظف','code'],['اسم الموظف','name'],['سعر الساعة الشهري','rate'],['معدل الساعة الفعلي','hourly'],
 ['الساعات الفعلية','hours'],['ساعات مرحلة','carried'],['أجر الساعات','wage'],['عدد التأخيرات','lates'],
 ['المعفاة','exempt'],['المخصومة بربع يوم','q'],['المخصومة بنص يوم','half'],['خصم التأخير','lateDed'],
 ['أثر التأخير على الساعات','lateHrsVal'],
 ['أيام غياب بدون إذن','absDays'],['جزاء الغياب','absPen'],['جزاءات إدارية','adminPen'],
 ['إجمالي الخصومات','totalDed'],['إجمالي الحوافز','bonus'],['مسحوبات آجلة','adv'],
 ['صافي المستحق','net'],['أيام محتاجة مراجعة','flags'],['الراتب الأساسي','basic']].forEach(([a,k]) => PAY_MAP[norm(a)] = k);

const DAY_MAP = {};
[['التاريخ','date'],['كود الموظف','code'],['حالة اليوم','state'],['ميعاد الحضور المعتمد','tin'],
 ['ميعاد الانصراف المعتمد','tout'],['بصمة الحضور','pin'],['بصمة الانصراف','pout'],
 ['الساعات المحتسبة','hours'],['دقائق التأخير','late'],['دقائق الانصراف المبكر','early'],
 ['معفى','exempt'],['نسبة خصم التأخير','pct'],['خصم التأخير','lateDed'],
 ['خصم الانصراف المبكر','earlyDed'],['ملاحظة','note'],['تنبيه','alert']].forEach(([a,k]) => DAY_MAP[norm(a)] = k);

const AR_D = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const d2 = n => String(n).padStart(2,'0');
const fmtDate = v => v instanceof Date ? `${d2(v.getDate())}/${d2(v.getMonth()+1)}` : (v || '');
const fmtTime = v => v instanceof Date ? `${d2(v.getHours())}:${d2(v.getMinutes())}` : (v || '');
const dow = v => v instanceof Date ? AR_D[(v.getDay())] : '';


/* SheetJS بيقرا التواريخ ناقصة ثواني (٢٣:٥٩:٥١ اليوم اللي قبله) بسبب فرق توقيت القاهرة التاريخي —
   بنقرّب أي تاريخ/وقت لأقرب دقيقة عشان اليوم يطلع صح. الأوقات نفسها مش بتتأثر. */
const fixDates = rows => (rows || []).map(r => r ? r.map(v => v instanceof Date
  ? new Date(Math.round(v.getTime() / 60000) * 60000) : v) : r);

function headerRow(rows, key){
  const k = norm(key);
  for (let i = 0; i < Math.min(rows.length, 12); i++)
    if ((rows[i] || []).some(c => norm(c) === k)) return i;
  return -1;
}

function parseBook(wb){
  const shName = n => wb.SheetNames.find(s => norm(s) === norm(n));
  const grid = n => { const s = wb.Sheets[shName(n)];
    return s ? fixDates(XLSX.utils.sheet_to_json(s, {header:1, raw:true, cellDates:true, defval:null})) : null; };

  const payG = grid('كشف_المرتب');
  if (!payG) throw new Error('مفيش شيت اسمه كشف_المرتب في الملف');
  const ph = headerRow(payG, 'كود الموظف');
  if (ph < 0) throw new Error('مش لاقي عمود "كود الموظف" في كشف المرتب');
  const phead = payG[ph];

  const guideG = grid('دليل_وافتراضات') || [];
  let ps = null, pe = null;
  guideG.forEach(r => (r || []).forEach((c, j) => {
    if (norm(c).includes(norm('تاريخ بداية الدورة'))) ps = r[j+1];
    if (norm(c).includes(norm('تاريخ نهاية الدورة'))) pe = r[j+1];
  }));
  const W = { h:0.35, i:0.25, p:0.20, c:0.20 };
  const RATES = { gen:0.075, xic:0.15, neb:0.10 };
  const pick = [['وزن المبيعات لكل ساعة عمل', v => W.h = v], ['وزن وسيط قيمة الفاتورة', v => W.i = v],
    ['وزن نسبة قيمة البوشينج', v => W.p = v], ['وزن نسبة تسجيل اسم العميل', v => W.c = v],
    ['عمولة البوشينج العامة', v => RATES.gen = v], ['عمولة XICLAVE', v => RATES.xic = v],
    ['عمولة NEBULA', v => RATES.neb = v]];
  guideG.forEach(r => (r || []).forEach((c, j) => {
    const t = norm(c); if (!t) return;
    pick.forEach(([lbl, set]) => { if (t === norm(lbl)){ const v = +r[j+1]; if (!isNaN(v) && v > 0) set(v); } });
  }));
  const toD = v => { if (v instanceof Date) return v;
    if (!v) return null;
    const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) return new Date(+m[3], +m[2]-1, +m[1]);
    const d = new Date(v); return isNaN(d) ? null : d; };
  ps = toD(ps); pe = toD(pe);
  const period = ps ? `${ps.getFullYear()}-${d2(ps.getMonth()+1)}` : 'unknown';
  const label = (ps && pe) ? `من ${fmtDate(ps)} إلى ${fmtDate(pe)}/${pe.getFullYear()}` : period;

  const jobs = {};
  const empG = grid('الموظفين');
  if (empG){
    const eh = headerRow(empG, 'كود الموظف');
    if (eh >= 0){
      const H = empG[eh];
      const ci = H.findIndex(c => norm(c) === norm('كود الموظف'));
      const ji = H.findIndex(c => norm(c) === norm('الوظيفة'));
      const si = H.findIndex(c => norm(c) === norm('الحالة'));
      const pi = H.findIndex(c => norm(c) === norm('اسم البائع في نظام الكاشير'));
      const ii = H.findIndex(c => norm(c) === norm('مشمول في تقييم المبيعات'));
      const mi = H.findIndex(c => norm(c) === norm('مستحق عمولة البوشينج'));
      const bi = H.findIndex(c => norm(c) === norm('ينشر كشفه'));
      for (let i = eh+1; i < empG.length; i++){
        const r = empG[i] || []; if (!r[ci]) continue;
        jobs[String(r[ci]).trim()] = { job: ji >= 0 ? r[ji] : '', status: si >= 0 ? r[si] : '',
          posName: pi >= 0 ? r[pi] : '', include: ii >= 0 ? r[ii] : '',
          comm: mi >= 0 ? r[mi] : (ii >= 0 ? r[ii] : ''),
          noPublish: bi >= 0 && String(r[bi] || '').includes('لا') };
      }
    }
  }

  const people = [];
  for (let i = ph+1; i < payG.length; i++){
    const r = payG[i] || [];
    const o = { extra: [] };
    let has = false;
    phead.forEach((h, j) => {
      if (h == null || h === '') return;
      const key = PAY_MAP[norm(h)];
      let v = r[j];
      const num = (v !== null && v !== '' && !isNaN(+String(v).replace(/,/g,''))) ? +String(v).replace(/,/g,'') : null;
      if (key){ o[key] = (key === 'name') ? v : (num !== null ? num : v); if (key === 'code' && num) has = true; }
      else if (num !== null && Math.abs(num) > 0.004) o.extra.push({ label: String(h).trim(), value: num });
    });
    if (!has) continue;
    const j = jobs[String(o.code).trim()] || {};
    o.job = j.job || ''; o.status = j.status || '';
    o.posName = j.posName || ''; o.include = j.include || ''; o.comm = j.comm || '';
    o.noPublish = !!j.noPublish;
    o.days = [];
    people.push(o);
  }

  const dayG = grid('البصمة_اليومية');
  if (dayG){
    const dh = headerRow(dayG, 'كود الموظف');
    if (dh >= 0){
      const H = dayG[dh];
      const byCode = {}; people.forEach(p => byCode[String(p.code).trim()] = p);
      for (let i = dh+1; i < dayG.length; i++){
        const r = dayG[i] || []; const d = {};
        H.forEach((h, j) => { const k = DAY_MAP[norm(h)]; if (k) d[k] = r[j]; });
        if (!d.code) continue;
        const p = byCode[String(d.code).trim()]; if (!p) continue;
        const dt = toD(d.date);
        if (ps && pe && dt && (dt < ps || dt > pe)) continue;
        const n = v => { const x = +String(v ?? '').replace(/[^0-9.\-]/g,''); return isNaN(x) ? 0 : x; };
        p.days.push({ date: fmtDate(dt), dow: dow(dt), state: d.state || '',
          tin: fmtTime(d.tin), tout: fmtTime(d.tout), pin: fmtTime(d.pin), pout: fmtTime(d.pout),
          hours: n(d.hours), late: Math.round(n(d.late)), early: Math.round(n(d.early)), exempt: n(d.exempt),
          pct: String(d.pct || '').includes('%') ? n(d.pct)/100 : n(d.pct),
          lateDed: n(d.lateDed), earlyDed: n(d.earlyDed), note: d.note || '', alert: d.alert || '' });
      }
    }
  }

  /* ---- تفاصيل الجزاءات والحوافز والمسحوبات لكل موظف ---- */
  const byCodeAll = {}; people.forEach(x => byCodeAll[String(x.code).trim()] = x);
  const logSheet = (sheet, fields, key) => {
    const gg = grid(sheet); if (!gg) return;
    const hh = headerRow(gg, 'كود الموظف'); if (hh < 0) return;
    const H = gg[hh], idx = {};
    Object.entries(fields).forEach(([lbl, k]) => {
      const j = H.findIndex(c => norm(c) === norm(lbl)); if (j >= 0) idx[k] = j; });
    for (let i = hh + 1; i < gg.length; i++){
      const r = gg[i] || []; const code = r[H.findIndex(c => norm(c) === norm('كود الموظف'))];
      if (code == null || code === '') continue;
      const per = byCodeAll[String(code).trim()]; if (!per) continue;
      const dt = toD(r[H.findIndex(c => norm(c) === norm('التاريخ'))]);
      if (ps && pe && dt && (dt < ps || dt > pe)) continue;
      const o = { date: dt ? fmtDate(dt) : '' };
      Object.entries(idx).forEach(([k, j]) => { o[k] = r[j]; });
      const amt = +o.amount; if (!amt && !o.reason && !o.item) continue;
      o.amount = isNaN(amt) ? 0 : Math.round(amt * 100) / 100;
      (per[key] = per[key] || []).push(o);
    }
  };
  logSheet('الجزاءات', { 'نوع الجزاء':'kind', 'السبب':'reason', 'القيمة النهائية':'amount', 'معتمد من':'by' }, 'penalties');
  logSheet('الحوافز', { 'البند':'item', 'القيمة':'amount', 'ملاحظة / أساس الاستحقاق':'reason' }, 'bonuses');
  logSheet('المسحوبات', { 'البيان':'item', 'المبلغ':'amount', 'ملاحظة':'reason' }, 'advances');

  return { period, label, people, ps, pe, W, RATES };
}

/* ================= قراءة تقرير الفواتير وتقرير الأصناف ================= */
const SAL_MAP = {};
[['كود البيع','id'],['مبيعات؟','kind'],['نوعية البيع','type'],['كود العميل','custCode'],
 ['اسم العميل','cust'],['التاريخ','date'],['الوقت','time'],['المجموع','total'],
 ['الخصم','disc'],['المدفوع','paid'],['اسم البائع','seller'],['الصنف','item']].forEach(([a,k]) => SAL_MAP[norm(a)] = k);

const ITM_MAP = {};
[['الصنف','item'],['الكمية','qty'],['سعر البيع','price'],['المجموع','total'],
 ['اسم العميل','cust'],['التاريخ','date'],['الوقت','time'],['فئة التصنيف','cat']]
  .forEach(([a,k]) => ITM_MAP[norm(a)] = k);

const nz = v => { const x = +String(v ?? '').replace(/[^0-9.\-]/g,''); return isNaN(x) ? 0 : x; };
const cNorm = v => String(v ?? '').trim().replace(/\s+/g,' ').replace(/^nan$/i,'');
const hhmm = v => v instanceof Date ? `${d2(v.getHours())}:${d2(v.getMinutes())}`
                 : String(v ?? '').trim().slice(0,5);
const ymd = v => v instanceof Date ? `${v.getFullYear()}-${d2(v.getMonth()+1)}-${d2(v.getDate())}` : String(v ?? '');
const median = a => { if (!a.length) return 0; const s = [...a].sort((x,y)=>x-y), m = s.length>>1;
  return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };

function gridOf(wb, want){
  /* بعض التصديرات بتتقسم على أكتر من شيت — بندمجهم كلهم تحت نفس العناوين */
  let head = null, rows = [], sheets = 0;
  for (const n of wb.SheetNames){
    const g = fixDates(XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, cellDates:true, defval:null}));
    const h = headerRow(g, want);
    if (h < 0) continue;
    if (!head) head = g[h];
    const idx = {}; head.forEach((c, j) => idx[norm(c)] = j);
    for (let i = h + 1; i < g.length; i++){
      const r = g[i] || [];
      if (r.every(v => v === null || v === '')) continue;
      const o = new Array(head.length).fill(null);
      (g[h] || []).forEach((c, j) => { const k = idx[norm(c)]; if (k !== undefined) o[k] = r[j]; });
      rows.push(o);
    }
    sheets++;
  }
  return head ? { g: [head, ...rows], h: 0, sheets } : null;
}

function parseSales(wb, ps, pe, rates){
  const found = gridOf(wb, 'اسم البائع');
  if (!found) throw new Error('مش لاقي عمود "اسم البائع" — ده مش تقرير المبيعات');
  const { g, h } = found, H = g[h];
  const hasItem = H.some(c => norm(c) === norm('الصنف'));
  const inv = new Map(), push = {};
  let outside = 0, lines = 0;
  for (let i = h+1; i < g.length; i++){
    const r = g[i] || [], o = {};
    H.forEach((c, j) => { const k = SAL_MAP[norm(c)]; if (k) o[k] = r[j]; });
    if (!o.seller && !o.id) continue;
    const dt = o.date instanceof Date ? o.date : (o.date ? new Date(o.date) : null);
    if (!dt) continue;
    if (ps && pe && (dt < ps || dt > new Date(pe.getTime()+86399000))) { outside++; continue; }
    lines++;
    const seller = cNorm(o.seller);
    const hasId = (o.id != null && o.id !== '');
    /* بعض التصديرات مفيهاش (كود البيع) — ساعتها بنعتبر الفاتورة = نفس التاريخ والوقت والعميل والبائع */
    const id = (o.id != null && o.id !== '') ? String(o.id)
      : (ymd(dt) + '|' + hhmm(o.time) + '|' + cNorm(o.cust) + '|' + seller);
    let x = inv.get(id);
    if (!x){ x = { id, ret: String(o.kind||'').includes('مرتج'), type: cNorm(o.type),
      hasCust: !!(o.custCode || cNorm(o.cust)), cust: cNorm(o.cust),
      key: ymd(dt) + '|' + hhmm(o.time) + '|' + cNorm(o.cust), total: 0, seller };
      inv.set(id, x); }
    const v = nz(o.total); x.total += v;
    if (hasItem && o.item){
      const name = String(o.item).toUpperCase();
      if (name.includes('$$')){
        const rate = name.includes('XICLAV') ? rates.xic : (name.includes('NEBULA') ? rates.neb : rates.gen);
        push[seller] = push[seller] || { pushValue:0, pushComm:0, pushLines:0 };
        push[seller].pushValue += v; push[seller].pushComm += v * rate; push[seller].pushLines++;
      }
    }
  }
  const noId = !H.some(c => norm(c) === norm('كود البيع'));
  return { rows: [...inv.values()], outside, lines, sheets: found.sheets, noId,
           itemLevel: hasItem, push: hasItem ? push : null };
}

function parseItems(wb, salesRows, rates){
  const found = gridOf(wb, 'فئة التصنيف');
  if (!found) throw new Error('مش لاقي عمود "فئة التصنيف" — ده مش تقرير الأصناف');
  const { g, h } = found, H = g[h];
  const key2seller = {};
  salesRows.forEach(r => { if (!(r.key in key2seller)) key2seller[r.key] = r.seller;
    else if (key2seller[r.key] !== r.seller) key2seller[r.key] = null; });
  const per = {};
  let matched = 0, unmatched = 0, ambiguous = 0;
  for (let i = h+1; i < g.length; i++){
    const r = g[i] || [], o = {};
    H.forEach((c, j) => { const k = ITM_MAP[norm(c)]; if (k) o[k] = r[j]; });
    if (!o.item) continue;
    const dt = o.date instanceof Date ? o.date : (o.date ? new Date(o.date) : null);
    if (!dt) continue;
    const k = ymd(dt) + '|' + hhmm(o.time) + '|' + cNorm(o.cust);
    const s = key2seller[k];
    if (s === undefined) { unmatched++; continue; }
    if (s === null) { ambiguous++; continue; }
    matched++;
    const name = String(o.item).toUpperCase();
    if (!name.includes('$$')) continue;
    const rate = name.includes('XICLAV') ? rates.xic : (name.includes('NEBULA') ? rates.neb : rates.gen);
    const v = nz(o.total);
    per[s] = per[s] || { pushValue: 0, pushComm: 0, pushLines: 0 };
    per[s].pushValue += v; per[s].pushComm += v * rate; per[s].pushLines++;
  }
  return { per, matched, unmatched, ambiguous };
}

/* ================= حساب المؤشرات ================= */
function buildKPI(people, sales, items, W0){
  let W = Object.assign({}, W0);
  if (!items){ const rest = W.h + W.i + W.c;
    if (rest > 0) { W = { h: W.h/rest, i: W.i/rest, p: 0, c: W.c/rest }; } }
  const bySeller = {};
  sales.forEach(r => {
    const s = r.seller; if (!s) return;
    const b = bySeller[s] = bySeller[s] || { invoices:0, net:0, gross:0, rets:0, retVal:0,
      cust:0, deliv:0, vals:[] };
    b.net += r.total;
    if (r.ret) { b.rets++; b.retVal += r.total; }
    else { b.invoices++; b.gross += r.total; b.vals.push(r.total);
      if (r.hasCust) b.cust++; if (r.type.includes('توصيل')) b.deliv++; }
  });

  const rows = [];
  const unmapped = Object.keys(bySeller).slice();
  people.forEach(p => {
    const pos = cNorm(p.posName);
    const b = pos ? bySeller[pos] : null;
    if (pos){ const i = unmapped.indexOf(pos); if (i >= 0) unmapped.splice(i, 1); }
    if (!b) return;
    const it = (items && items.per[pos]) || { pushValue:0, pushComm:0 };
    const commOK = String(p.comm || '').includes('نعم');
    rows.push({ code: p.code, name: p.name, pos, hours: +p.hours || 0,
      include: String(p.include || '').includes('نعم'), commOK,
      invoices: b.invoices, net: Math.round(b.net*100)/100, gross: b.gross,
      rets: b.rets, retVal: b.retVal,
      medInv: Math.round(median(b.vals)*100)/100,
      custPct: b.invoices ? b.cust / b.invoices : 0,
      delivPct: b.invoices ? b.deliv / b.invoices : 0,
      perHour: (+p.hours) ? b.net / p.hours : 0,
      pushValue: Math.round(it.pushValue*100)/100,
      pushComm: commOK ? Math.round(it.pushComm*100)/100 : 0,
      pushPct: b.gross ? it.pushValue / b.gross : 0 });
  });

  const inc = rows.filter(r => r.include);
  const mx = k => Math.max(0, ...inc.map(r => r[k] || 0));
  const M = { perHour: mx('perHour'), medInv: mx('medInv'), pushPct: mx('pushPct'), custPct: mx('custPct') };
  rows.forEach(r => {
    if (!r.include) { r.score = null; return; }
    const n = (v, m) => m > 0 ? (v / m) * 100 : 0;
    r.sHour = n(r.perHour, M.perHour); r.sInv = n(r.medInv, M.medInv);
    r.sPush = n(r.pushPct, M.pushPct); r.sCust = n(r.custPct, M.custPct);
    r.score = Math.round((W.h*r.sHour + W.i*r.sInv + W.p*r.sPush + W.c*r.sCust) * 10) / 10;
  });
  rows.sort((a,b) => (b.score ?? -1) - (a.score ?? -1) || b.net - a.net);
  rows.W = W;
  const tot = { invoices: rows.reduce((a,r)=>a+r.invoices,0), net: rows.reduce((a,r)=>a+r.net,0),
    push: rows.reduce((a,r)=>a+r.pushValue,0), comm: rows.reduce((a,r)=>a+r.pushComm,0),
    scoreSum: inc.reduce((a,r)=>a+(r.score||0),0) };
  return { rows, tot, unmapped, bySeller, W };
}

async function latestPeriod(){
  const snap = await getDocs(collection(db, 'periods'));
  const list = [];
  snap.forEach(d => { const v = d.data(); if (v.published && !v.archived) list.push({ id: d.id, ...v }); });
  list.sort((a, b) => a.id < b.id ? 1 : -1);

}

function barList(items, fmt){
  const mx = Math.max(1, ...items.map(i => Math.abs(i.value)));
  return `<div class="bars">${items.map((i, n) => `<div class="bar-row">
    <div class="bar-head"><span class="bn">${esc(i.label)}</span><span class="bv">${fmt(i.value)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(Math.abs(i.value)/mx*100).toFixed(1)}%;
      background:${i.color || PAL[n % 3]};animation-delay:${Math.min(n*45,500)}ms"></div></div>
    ${i.note ? `<div class="bar-note">${esc(i.note)}</div>` : ''}</div>`).join('')}</div>`;
}

function areaSVG(pts, fmt){
  if (!pts.length) return '';
  const W = 640, H = 170, P = { t:14, r:10, b:26, l:10 };
  const mx = Math.max(...pts.map(p => p.v)) || 1;
  const n = pts.length;
  const X = i => W - P.r - (i * (W - P.l - P.r) / Math.max(1, n - 1));
  const Y = v => P.t + (1 - v / mx) * (H - P.t - P.b);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(n-1).toFixed(1)},${H-P.b} L${X(0).toFixed(1)},${H-P.b} Z`;
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"
      fill="var(--card)" stroke="${PAL[0]}" stroke-width="1.6"><title>${esc(p.k)} — ${fmt(p.v)}</title></circle>`).join('');
  const step = Math.ceil(n / 8);
  const labs = pts.map((p, i) => i % step ? '' :
    `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(p.k)}</text>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${PAL[0]}" stop-opacity=".28"/>
      <stop offset="1" stop-color="${PAL[0]}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ag)"/>
    <path d="${line}" fill="none" stroke="${PAL[0]}" stroke-width="2" stroke-linejoin="round" class="spark"/>
    ${dots}${labs}</svg></div>`;
}

function donut(pct, label, sub){
  const r = 52, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(1, pct));
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--line)" stroke-width="15"/>
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="${PAL[0]}" stroke-width="15" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${(c-on).toFixed(1)}" transform="rotate(-90 70 70)" class="ring"/>
    <text x="70" y="68" text-anchor="middle" font-size="26" font-weight="600" fill="var(--ink)">${(pct*100).toFixed(0)}٪</text>
    <text x="70" y="88" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(sub||'')}</text>
  </svg><div class="dlabel">${esc(label)}</div></div>`;
}

function dayColumns(days){
  if (!days.length) return '';
  const W = 640, H = 130, P = { t:10, b:24 };
  const mx = Math.max(1, ...days.map(d => +d.hours || 0));
  const bw = (W - 8) / days.length;
  const bars = days.map((d, i) => {
    const h = ((+d.hours||0) / mx) * (H - P.t - P.b);
    const x = W - 4 - (i+1)*bw;
    const col = (+d.hours) ? (d.lateDed || d.earlyDed ? 'var(--red)' : (d.exempt ? 'var(--amber)' : PAL[0]))
                           : 'var(--line)';
    return `<rect x="${(x+bw*.16).toFixed(1)}" y="${(H-P.b-h).toFixed(1)}" width="${(bw*.68).toFixed(1)}"
      height="${Math.max(h,1).toFixed(1)}" rx="2" fill="${col}"><title>${esc(d.date)} — ${HN(d.hours)} ساعة ${esc(d.state)}</title></rect>
      ${i % Math.ceil(days.length/10) ? '' : `<text x="${(x+bw*.5).toFixed(1)}" y="${H-7}" text-anchor="middle"
      font-size="9.5" fill="var(--muted)">${esc(String(d.date).slice(0,2))}</text>`}`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${bars}</svg></div>
    <div class="legend"><span><i style="background:${PAL[0]}"></i>يوم عادي</span>
    <span><i style="background:var(--red)"></i>عليه خصم</span>
    <span><i style="background:var(--amber)"></i>تأخير معفى</span>
    <span><i style="background:var(--line)"></i>بدون ساعات</span></div>`;
}

window.otSend = async () => {

async function otMine(){

  try {
    const all = [];

    a.forEach(d => all.push({ t:'وقت إضافي', ...d.data() }));
    const b = await getDocs(query(collection(db, 'permits'), where('uid', '==', ME.uid)));
    b.forEach(d => { const v = d.data(); all.push({ t: v.kind, ...v }); });
    all.sort((x,y) => x.date < y.date ? 1 : -1);
    box.innerHTML = all.length ? `<div class="scroll"><table>
      <tr><th>اليوم</th><th>النوع</th><th>المقدار</th><th>السبب</th><th>الحالة</th></tr>
      ${all.map(x => `<tr><td>${esc(dLabel(x.date))}</td><td>${esc(x.t)}</td>
        <td class="num">${x.hours ? HN(x.hours) + ' ساعة' : (x.days ? x.days + ' يوم' : x.minutes + ' دقيقة')}</td>
        <td style="white-space:normal">${esc(x.reason)}${x.rejectReason ? '<br><span style="color:var(--red)">سبب الرفض: ' + esc(x.rejectReason) + '</span>' : ''}</td>

}

      ${Object.entries(byEmp).map(([n,v]) => `<tr><td>${esc(n)}</td><td class="num">${v.n}</td><td class="num"><b>${HN(v.h)}</b></td></tr>`).join('')}</table></div>

/* ================= تقفيل الخزنة ================= */
// القواعد (3/10): الأرضية 500 ج بتفضل في الدرج ومش داخلة في التقفيل.
// السماح ±20 ج على الفرق اللي السيستم طلّعه، واللي فوقه (عجز أو زيادة) بيتخصم من اللي قفل.
// كل تقفيلة بتتحفظ بالقواعد اللي اتقفلت بيها (tol / surplusCharged) علشان تغيير الإعداد ميغيّرش اللي فات.
const CASH = { TOL: 20, FLOAT: 500, SURPLUS_CHARGED: true, DAY_START: 9 };
const DENOMS = [200, 100, 50, 20, 10, 5, 1];
// أنواع المصاريف اللي الكاشير بيختار منها (القايمة دي هي المصدر — أي نوع جديد يتضاف هنا)
const EXP_TYPES = ['أكياس وتغليف','منظفات','بوفيه وضيافة','مواصلات','صيانة','شحن رصيد',
  'دفع لمورد (فاتورة)','مشتريات خارجية','مستورد','سلفة لموظف','أخرى'];
const EXP_NEED_DESC = ['دفع لمورد (فاتورة)','مشتريات خارجية','مستورد','سلفة لموظف','أخرى'];
// دي مش مصاريف تشغيل — فلوس بضاعة أو سلف، وبتتجمع لوحدها في التقرير
const EXP_GOODS = ['دفع لمورد (فاتورة)','مشتريات خارجية','مستورد','سلفة لموظف'];
const SLOTS = [[14,'14','تقفيلة ٢ الضهر'],[18,'18','تقفيلة ٦ المغرب'],[23,'23','تقفيلة ١١ بالليل'],[29,'05','تقفيلة ٥ الفجر']];
const slotName = k => (SLOTS.find(s => s[1] === k) || [0, k, k])[2];
const r2 = n => Math.round((+n || 0) * 100) / 100;
const M2 = n => r2(n).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
const enNum = s => String(s == null ? '' : s).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g, '.').replace(/−/g, '-');

// "89 + 86 + 1387" أو كل مبلغ في سطر ← المجموع
function parseList(s){
  const t = enNum(s).trim();
  if (!t) return { sum: 0, n: 0, bad: false };
  const parts = t.split(/[+\s]+/).filter(Boolean);
  let sum = 0, bad = false;
  parts.forEach(x => { const v = Number(x); if (!isFinite(v) || v < 0) bad = true; else sum += v; });
  return { sum: r2(sum), n: parts.length, bad };
}

function cairo(d){
  const p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d).forEach(x => p[x.type] = x.value);
  return { y: +p.year, m: +p.month, d: +p.day, h: (+p.hour) % 24, mi: +p.minute };
}
// اليوم التشغيلي من ٩ الصبح لـ ٩ الصبح: تقفيلة ٥ الفجر بتتحسب على اليوم اللي قبله
function bizOf(date){
  const c = cairo(date);
  let day = new Date(Date.UTC(c.y, c.m - 1, c.d));
  if (c.h < CASH.DAY_START) day = new Date(day.getTime() - 86400000);
  let hh = c.h + c.mi / 60; if (hh < CASH.DAY_START) hh += 24;
  const slot = SLOTS.reduce((a, s) => Math.abs(s[0] - hh) < Math.abs(a[0] - hh) ? s : a)[1];
  return { biz: day.toISOString().slice(0, 10), slot, time: `${d2(c.h)}:${d2(c.mi)}` };
}
const dLong = biz => { const [y, m, d] = String(biz || '').split('-').map(Number);
  if (!d) return biz || ''; return `${AR_D[new Date(y, m - 1, d).getDay()]} ${d}/${m}`; };

// الفرق: سالب = عجز، موجب = زيادة. لو مدير الفرع صحّحه، آخر تصحيح هو اللي بيتاخد
const cVar = c => { const f = (c.fixes || []).slice(-1)[0];
  if (f) return +f.variance || 0;
  return c.posKind === 'عجز' ? -(+c.posAmount || 0) : c.posKind === 'زيادة' ? (+c.posAmount || 0) : 0; };
// ملغية = عليها void ومش مسترجعة. الاسترجاع بيسيب سجل الإلغاء زي ما هو ويعلّم restored
const isVoid = c => !!(c.void && !c.void.restored);
const cPen = c => { if (isVoid(c)) return 0;
  const v = cVar(c), tol = c.tol != null ? +c.tol : CASH.TOL;
  const sc = c.surplusCharged != null ? c.surplusCharged : CASH.SURPLUS_CHARGED;
  if (v > 0 && !sc) return 0;
  return Math.max(0, r2(Math.abs(v) - tol)); };
// إجمالي التقفيلة = كل الفلوس اللي الشيفت بيحاسب عليها: نقدي + فيزا + محافظ + المصاريف اللي اتدفعت من الدرج
const cTotal = c => r2((+c.cashToSafe || 0) + (+c.visa || 0) + (+c.voda || 0) + (+c.insta || 0) + (+c.expTotal || 0));
const cTime = c => c.at?.seconds ? new Date(c.at.seconds * 1000) : (c.clientAt ? new Date(c.clientAt) : null);
const clockOff = c => c.at?.seconds && c.clientAt && Math.abs(c.at.seconds * 1000 - new Date(c.clientAt)) > 15 * 60000;
const varTag = (v, tol) => !v ? '<span class="tag good">مظبوط</span>'
  : `<span class="tag ${Math.abs(v) > (tol != null ? tol : CASH.TOL) ? 'late' : 'mid'}">${v < 0 ? 'عجز' : 'زيادة'} ${M2(Math.abs(v))}</span>`;

  let fr = $('printFrame');

function cashRead(){
  const counts = {}; let drawer = 0, badCount = false;
  DENOMS.forEach(v => { const c = +($('dn' + v).value || 0);
    if (c < 0 || !Number.isInteger(c)) badCount = true; counts[v] = c; drawer += c * v; });
  const coins = +($('dnCoins').value || 0); if (coins < 0) badCount = true;
  drawer = r2(drawer + coins);
  const fl = (document.querySelector('input[name="cfFl"]:checked') || {}).value || '';
  const got = fl === 'ok' ? CASH.FLOAT : r2(+($('cfGot').value || 0));
  const visa = parseList($('cfVisa').value), voda = parseList($('cfVoda').value), insta = parseList($('cfInsta').value);
  const exps = [...document.querySelectorAll('#cfExp .exprow')].map(r => ({ type: r.querySelector('.exT').value,
    desc: r.querySelector('.exD').value.trim(), amount: r2(+r.querySelector('.exA').value || 0) }))
    .filter(x => x.type || x.desc || x.amount);
  const expTotal = r2(exps.reduce((a, x) => a + x.amount, 0));
  const posKind = $('cfPos').value;
  const posAmount = posKind && posKind !== 'مظبوط' ? r2(+$('cfPosAmt').value || 0) : 0;
  const variance = posKind === 'عجز' ? -posAmount : posKind === 'زيادة' ? posAmount : 0;
  const pen = cPen({ posKind, posAmount, tol: CASH.TOL, surplusCharged: CASH.SURPLUS_CHARGED });
  return { counts, coins, drawer, badCount, fl, got, visa, voda, insta, exps, expTotal,
    posKind, posAmount, variance, pen, cashToSafe: drawer };
}

window.cashCalc = () => {
  if (!$('cfForm')) return;
  const s = cashRead(), w = bizOf(new Date());
  $('cfWhen').innerHTML = `هتتسجل على يوم <b>${dLong(w.biz)}</b> — <b>${slotName(w.slot)}</b> (الساعة دلوقتي ${w.time})`;
  DENOMS.forEach(v => { const c = +($('dn' + v).value || 0); $('dt' + v).textContent = c ? M2(c * v) + ' ج' : '—'; });
  $('dtCoins').textContent = s.coins ? M2(s.coins) + ' ج' : '—';
  $('cfCash').textContent = M2(s.cashToSafe) + ' ج';
  $('cfGotRow').classList.toggle('hide', s.fl !== 'no');
  $('cfPosRow').classList.toggle('hide', !s.posKind || s.posKind === 'مظبوط');
  [['cfVisaT', s.visa], ['cfVodaT', s.voda], ['cfInstaT', s.insta]].forEach(([id, x]) =>
    $(id).textContent = x.bad ? '⚠ فيه رقم مش مفهوم — اكتب أرقام بس وبينهم +' : x.n > 1 ? `${x.n} عمليات = ${M2(x.sum)} ج` : '');
  const R = (k, v, c) => `<div class="row ${c || ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  let verdict = '';
  if (s.posKind){
    const a = Math.abs(s.variance);
    verdict = !a ? R('نتيجة السيستم', 'مظبوط ✔', 'plus')
      : R('نتيجة السيستم', `${s.posKind} ${M2(a)} ج`, s.variance < 0 ? 'minus' : '') +
        (s.pen ? R('هيتخصم منك', M2(s.pen) + ' ج', 'minus') +
            `<div class="sub">السماح ${M2(CASH.TOL)} ج — اللي فوقه بيتخصم: ${M2(a)} − ${M2(CASH.TOL)} = ${M2(s.pen)} ج</div>`
          : `<div class="sub">جوه السماح (${M2(CASH.TOL)} ج) — مفيش خصم.</div>`);
  }
  $('cfSum').innerHTML = `<div class="rows">
    ${R('نقدي للخزنة', M2(s.cashToSafe) + ' ج')}${R('فيزا', M2(s.visa.sum) + ' ج')}
    ${R('فودافون كاش', M2(s.voda.sum) + ' ج')}${R('إنستاباي', M2(s.insta.sum) + ' ج')}
    ${R('مصاريف من الدرج', M2(s.expTotal) + ' ج')}
    ${R('إجمالي التقفيلة', M2(s.cashToSafe + s.visa.sum + s.voda.sum + s.insta.sum + s.expTotal) + ' ج', 'total')}
    <div class="sub">الإجمالي = نقدي + فيزا + فودافون + إنستاباي + المصاريف اللي اتدفعت من الدرج.</div>${verdict}</div>
    ${s.fl === 'no' && s.got < CASH.FLOAT ? `<div class="banner bad" style="margin-top:10px">الأرضية ناقصة ${M2(CASH.FLOAT - s.got)} ج — هتتسجل على التسليم من الشيفت اللي قبلك.</div>` : ''}`;
};

  const s = cashRead(), m = $('cfMsg');
  const bad = t => { m.style.color = 'var(--red)'; m.textContent = t; };
  const empUid = station ? $('cfEmp').value : ME.uid;
  const who = station ? STAFFL.find(x => x.uid === empUid) : null;
  if (station && !who) return bad('اختار اسمك من القايمة الأول');
  if (!s.fl) return bad('حدد: استلمت الأرضية كاملة ولا لأ');
  if (s.fl === 'no' && !(s.got >= 0 && s.got < CASH.FLOAT)) return bad(`اكتب الأرضية اللي استلمتها (أقل من ${M2(CASH.FLOAT)})`);
  if (s.badCount) return bad('عدد الفئات لازم أرقام صحيحة من غير سالب');
  if (s.drawer <= 0 && !confirm('النقدي صفر؟ متأكد إنك عدّيت؟')) return;
  if (s.visa.bad || s.voda.bad || s.insta.bad) return bad('فيه رقم مش مفهوم في الفيزا أو المحافظ');
  for (const x of s.exps){
    if (!x.type) return bad('حدد نوع كل مصروف');
    if (!(x.amount > 0)) return bad('اكتب مبلغ كل مصروف');
    if (EXP_NEED_DESC.includes(x.type) && !x.desc) return bad(`اكتب بيان "${x.type}" (مين / فاتورة إيه)`);
  }
  if (!s.posKind) return bad('اختار نتيجة السيستم (مظبوط / عجز / زيادة)');
  if (s.posKind !== 'مظبوط' && !(s.posAmount > 0)) return bad('اكتب مبلغ العجز أو الزيادة زي السيستم بالظبط');
  const now = new Date(), w = bizOf(now);
  const prev = MYCASH.find(c => (c.empUid || c.uid) === empUid), last = prev && cTime(prev);
  if (last && now - last < 45 * 60000 && !confirm(`${station ? who.name + ' قفل' : 'إنت قفلت'} من أقل من ٤٥ دقيقة. دي تقفيلة جديدة فعلاً؟`)) return;
  if (!confirm(`${station ? 'باسم: ' + who.name + '\n' : ''}${dLong(w.biz)} — ${slotName(w.slot)}
نقدي للخزنة: ${M2(s.cashToSafe)} ج
فيزا: ${M2(s.visa.sum)} — فودافون: ${M2(s.voda.sum)} — إنستاباي: ${M2(s.insta.sum)}
مصاريف: ${M2(s.expTotal)} ج
السيستم: ${s.posKind}${s.posAmount ? ' ' + M2(s.posAmount) + ' ج' : ''}${s.pen ? `\nهيتخصم منك: ${M2(s.pen)} ج` : ''}

بعد الإرسال مش هتقدر تعدّل. متأكد؟`)) return;
  const btn = $('cfBtn'); btn.disabled = true; m.style.color = 'var(--muted)'; m.textContent = 'جاري الإرسال…';
  try {
    let v = who;
    if (!station){ const st = await getDoc(doc(db, 'staff', ME.uid)); v = st.exists() ? st.data() : {}; }
    if (!v.code) throw { message: 'الحساب ده مش مربوط بكود موظف — كلّم مدير الفرع' };
    const ref = await addDoc(collection(db, 'closings'), {
      uid: ME.uid, empUid, via: station ? 'جهاز الكاشير' : 'حساب الموظف',
      code: String(v.code), name: v.name || '', status: 'مرسل',
      at: serverTimestamp(), clientAt: now.toISOString(), bizDate: w.biz, slot: w.slot, timeLocal: w.time,
      floatOk: s.fl === 'ok', floatGot: s.got, float: CASH.FLOAT,
      counts: s.counts, coins: r2(s.coins), drawer: s.drawer, cashToSafe: s.cashToSafe, floatExcluded: true,
      visa: s.visa.sum, visaList: $('cfVisa').value.trim(),
      voda: s.voda.sum, vodaList: $('cfVoda').value.trim(),
      insta: s.insta.sum, instaList: $('cfInsta').value.trim(),

    await cashMine();
  } catch (e) { btn.disabled = false; bad('متبعتتش: ' + (e.code || e.message)); }
};

async function cashMine(){
  const box = $('cfMine'); if (!box) return;
  try {
    const station = ROLE === 'cashier', seen = {};
    MYCASH = [];
    const qs = station ? [where('uid', '==', ME.uid)] : [where('empUid', '==', ME.uid), where('uid', '==', ME.uid)];
    let ok = 0, err = null;
    for (const w of qs){
      try { const snap = await getDocs(query(collection(db, 'closings'), w)); ok++;
        snap.forEach(d => { if (!seen[d.id]) { seen[d.id] = 1; MYCASH.push({ id: d.id, ...d.data() }); } }); }
      catch (e) { err = e; }
    }
    if (!ok && err) throw err;
    if (!station) MYCASH = MYCASH.filter(c => (c.empUid || c.uid) === ME.uid);
    MYCASH.sort((a, b) => (cTime(b) || 0) - (cTime(a) || 0));
    if (!MYCASH.length){ box.innerHTML = `<p class="sub">${station ? 'لسه محدش قفل من الجهاز ده.' : 'لسه مقفلتش أي شيفت.'}</p>`; return; }
    const mon = bizOf(new Date()).biz.slice(0, 7);
    const MON = MYCASH.filter(c => String(c.bizDate).startsWith(mon) && !isVoid(c));
    const pen = MON.reduce((a, c) => a + cPen(c), 0);
    const ms = f => M2(MON.reduce((a, c) => a + (+f(c) || 0), 0));
    const monRow = MON.length ? `<tr class="sel"><td colspan="2"><b>إجمالي الشهر ده (${F(MON.length)} تقفيلة)</b></td>
      <td class="num"><b>${ms(c => c.cashToSafe)}</b></td><td class="num"><b>${ms(c => c.visa)}</b></td><td class="num"><b>${ms(c => c.voda)}</b></td>
      <td class="num"><b>${ms(c => c.insta)}</b></td><td class="num"><b>${ms(c => c.expTotal)}</b></td><td class="num"><b>${ms(cTotal)}</b></td>
      <td>${varTag(r2(MON.reduce((a, c) => a + cVar(c), 0)), 1e9)}</td><td class="num"><b>${pen ? M2(pen) + ' ج' : '—'}</b></td><td></td></tr>` : '';
    box.innerHTML = `<p class="sub">دوس على أي تقفيلة تشوف تفاصيلها كاملة (العد والفيزا والمصاريف).</p>
      ${pen && !station ? `<div class="banner bad">خصومات الخزنة عليك الشهر ده: ${M2(pen)} ج — بتتخصم من المرتب.</div>` : ''}
      <div class="scroll"><table><tr><th>اليوم</th><th>التقفيلة</th><th>نقدي</th><th>فيزا</th><th>فودافون</th><th>إنستاباي</th>
        <th>مصاريف</th><th>إجمالي الشيفت</th><th>السيستم</th><th>الخصم</th><th>الحالة</th></tr>
      ${monRow}
      ${MYCASH.slice(0, 60).map(c => { const v = cVar(c), p = cPen(c);
        return `<tr class="clk"${isVoid(c) ? ' style="opacity:.5"' : ''} onclick="cdTog('${c.id}')"><td>${esc(dLong(c.bizDate))} ⌄</td><td>${esc(slotName(c.slot))}${station ? '<br><b>' + esc(c.name) + '</b>' : ''}</td>
        <td class="num">${M2(c.cashToSafe)}</td><td class="num">${M2(c.visa)}</td><td class="num">${M2(c.voda)}</td>
        <td class="num">${M2(c.insta)}</td><td class="num">${M2(c.expTotal)}</td><td class="num"><b>${M2(cTotal(c))}</b></td>
        <td>${varTag(v, c.tol)}</td><td class="num">${p ? M2(p) + ' ج' : '—'}</td>
        <td>${isVoid(c) ? '<span class="tag">ملغية</span>' : (c.fixes || []).length ? '<span class="tag ok">اتصححت</span>'
          : c.review ? '<span class="tag good">اتراجعت</span>' : '—'}</td></tr>
        <tr id="cd_${c.id}" class="hide"><td colspan="11" style="white-space:normal;text-align:start;padding:0">
          <div class="cdwrap">${cDetail(c)}</div></td></tr>`; }).join('')}
      </table></div>`;
  } catch (e) { box.innerHTML = `<p class="err">مشكلة: ${esc(e.code || e.message)}</p>`; }
}

// رصيد الخزنة الجوانية = آخر جرد + نقدي التقفيلات اللي بعده − السحب + الإيداع
async function safeLedger(){
  const S = CM.safe.slice().sort((x, y) => (x.at?.seconds || 0) - (y.at?.seconds || 0));
  let base = null; S.forEach(e => { if (e.kind === 'جرد') base = e; });
  const baseSec = base ? (base.at?.seconds || 0) : 0;
  const cl = [];
  try {
    const from = base ? new Date((baseSec - 2 * 86400) * 1000).toISOString().slice(0, 10) : '0000';
    const snap = await getDocs(query(collection(db, 'closings'), where('bizDate', '>=', from)));
    snap.forEach(d => { const c = d.data(); const t = cTime(c);
      if (!isVoid(c) && t && t.getTime() / 1000 > baseSec) cl.push(c); });
  } catch (e) { return { err: e.code || e.message }; }
  const after = S.filter(e => (e.at?.seconds || 0) > baseSec && e.kind !== 'جرد');
  const inC = r2(cl.reduce((a, c) => a + (+c.cashToSafe || 0), 0));
  const out = r2(after.filter(e => e.kind === 'سحب').reduce((a, e) => a + (+e.amount || 0), 0));
  const dep = r2(after.filter(e => e.kind === 'إيداع').reduce((a, e) => a + (+e.amount || 0), 0));
  return { base, inC, out, dep, n: cl.length, bal: r2((base ? +base.amount : 0) + inC - out + dep), entries: S.slice().reverse() };
}

function cashStats(){
  const L = CM.list.filter(c => !isVoid(c));
  const sum = f => r2(L.reduce((a, c) => a + (+f(c) || 0), 0));
  const days = {}, who = {}, sl = {}, ex = {}, sup = [];
  L.forEach(c => {
    const v = cVar(c), p = cPen(c);
    const d = days[c.bizDate] = days[c.bizDate] || { d: c.bizDate, n: 0, cash: 0, visa: 0, wal: 0, exp: 0, total: 0, net: 0, pen: 0, over: 0 };
    d.n++; d.total += cTotal(c); d.cash += +c.cashToSafe || 0; d.visa += +c.visa || 0; d.wal += (+c.voda || 0) + (+c.insta || 0);
    d.exp += +c.expTotal || 0; d.net += v; d.pen += p; if (p) d.over++;
    const w = who[c.code] = who[c.code] || { code: c.code, name: c.name, n: 0, short: 0, plus: 0, over: 0, pen: 0, small: 0, smallSum: 0 };
    w.n++; if (v < 0) w.short += -v; if (v > 0) w.plus += v;
    if (p) { w.over++; w.pen += p; } else if (v < 0) { w.small++; w.smallSum += -v; }
    const s = sl[c.slot] = sl[c.slot] || { k: c.slot, n: 0, net: 0, abs: 0, over: 0 };
    s.n++; s.net += v; s.abs += Math.abs(v); if (p) s.over++;
    (c.expenses || []).forEach(x => { const e = ex[x.type] = ex[x.type] || { t: x.type, n: 0, v: 0 };
      e.n++; e.v += +x.amount || 0;
      if (EXP_GOODS.includes(x.type)) sup.push({ ...x, d: c.bizDate, who: c.name }); });
  });
  return { L, days, who, sl, ex, sup,
    tot: { n: L.length, cash: sum(c => c.cashToSafe), visa: sum(c => c.visa), wal: sum(c => (+c.voda || 0) + (+c.insta || 0)),
      exp: sum(c => c.expTotal), total: sum(cTotal), net: sum(cVar), pen: sum(cPen), over: L.filter(c => cPen(c) > 0).length } };
}

  const Lg = CM.ledger || {}, rec = { kind: k, amount: a, note: n, at: serverTimestamp(), clientAt: new Date().toISOString() };
  let ask = `${k} ${M2(a)} ج — ${n || ''}\nمتأكد؟ العملية مش هتتمسح بعد كده.`;
  if (k === 'جرد'){
    if (!Lg.base){ rec.opening = true; ask = `هيتسجل رصيد بداية للخزنة = ${M2(a)} ج.\nمتأكد؟`; }
    else { rec.expected = Lg.bal; rec.diff = r2(a - Lg.bal);
      ask = `المفروض في الخزنة: ${M2(Lg.bal)} ج\nإنت عدّيت: ${M2(a)} ج\nالفرق: ${rec.diff > 0 ? '+' : ''}${M2(rec.diff)} ج\n\nتسجيل الجرد؟`; }
  }
  if (!confirm(ask)) return;
  try { await addDoc(collection(db, 'safe'), rec); cashAdmin(); }
  catch (e) { m.textContent = 'متسجلش: ' + (e.code || e.message); }
};

// بيتحسب وقت النشر من التقفيلات اللي يومها التشغيلي جوه دورة المرتب
let CASHP = null;
const isoLocal = d => `${d.getFullYear()}-${d2(d.getMonth() + 1)}-${d2(d.getDate())}`;
const cashKey = P => P && P.ps && P.pe ? isoLocal(P.ps) + '|' + isoLocal(P.pe) : '';
function loadCashPen(P){
  const key = cashKey(P);
  if (CASHP && CASHP.key === key) return CASHP.p;
  const C = CASHP = { key, map: {}, loading: true, err: '' };
  if (!key){ C.loading = false; C.err = 'تواريخ الدورة مش موجودة في ملف المرتبات'; return (C.p = Promise.resolve()); }
  const [a, b] = key.split('|');
  C.p = getDocs(query(collection(db, 'closings'), where('bizDate', '>=', a), where('bizDate', '<=', b)))
    .then(snap => snap.forEach(d => { const c = d.data(), pen = cPen(c); if (!pen) return;
      const k = String(c.code).trim(), m = C.map[k] = C.map[k] || { pen: 0, n: 0 };
      m.pen = r2(m.pen + pen); m.n++; }))
    .catch(e => { C.err = e.code || e.message; })
    .finally(() => { C.loading = false; });
  return C.p;
}
const cashPen = code => (CASHP && !CASHP.loading && CASHP.map[String(code).trim()]) || { pen: 0, n: 0 };

function tileRows(kind){
  const R = DASH.rows, F2 = v => F(v || 0);
  const has = f => R.filter(f);
  const tbl = (head, body) => `<div class="scroll"><table><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${body}</table></div>`;
  const sortD = (a, b) => (b.v || 0) - (a.v || 0);

  if (kind === 'basic' || kind === 'net' || kind === 'hours' || kind === 'bonusOnly' || kind === 'push' || kind === 'ded'){
    const pick = { basic:['الراتب الأساسي','basic'], net:['الصافي','net'], hours:['الساعات','hours'],
                   bonusOnly:['الحوافز','bonusOnly'], push:['عمولة البوشينج','pushAuto'],
                   ded:['إجمالي الخصومات','totalDed'] }[kind];
    const list = R.map(r => ({ n: r.name, c: r.code,
        v: kind === 'bonusOnly' ? (+r.bonus || 0) - (+r.pushAuto || 0) : (+r[pick[1]] || 0) }))
      .filter(x => x.v).sort(sortD);
    return { title: pick[0], html: tbl(['الكود','الاسم', pick[0]],
      list.map(x => `<tr><td>${esc(x.c)}</td><td>${esc(x.n)}</td><td class="num"><b>${F2(x.v)}</b></td></tr>`).join('')
      + `<tr><td></td><td><b>الإجمالي</b></td><td class="num"><b>${F2(list.reduce((a,x)=>a+x.v,0))}</b></td></tr>`) };
  }

  if (kind === 'late'){
    let body = '';
    has(r => +r.lateDed).sort((a,b) => b.lateDed - a.lateDed).forEach(r => {
      body += `<tr style="background:var(--green-soft)"><td colspan="5"><b>${esc(r.name)}</b> — ${r.lates||0} تأخير،
        المخصوم ${(r.q||0)+(r.half||0)}، الإجمالي <b>${F2(r.lateDed)} ج</b></td></tr>`;
      (r.days || []).filter(d => +d.lateDed).forEach(d => {
        body += `<tr><td>${esc(d.date)} ${esc(d.dow)}</td><td class="num">${esc(d.tin)}</td>
          <td class="num">${esc(d.pin)}</td><td class="num">${Math.round(d.late)} د</td>
          <td class="num">${F2(d.lateDed)}</td></tr>`; });
    });
    return { title: 'أيام التأخير وخصمها', html: tbl(['اليوم','الميعاد','البصمة','التأخير','الخصم (ج)'], body) };
  }

  if (kind === 'pen' || kind === 'adv' || kind === 'bon'){
    const key = { pen:'penalties', adv:'advances', bon:'bonuses' }[kind];
    const cols = { pen:['اليوم','السبب','القيمة (ج)'], adv:['اليوم','البيان','المبلغ (ج)'],
                   bon:['اليوم','البند','القيمة (ج)'] }[kind];
    const fld = { pen:'reason', adv:'item', bon:'item' }[kind];
    let body = '', tot = 0;
    R.forEach(r => {
      const rows = (r[key] || []).filter(x => +x.amount);
      if (!rows.length) return;
      const sum = rows.reduce((a,x) => a + (+x.amount || 0), 0); tot += sum;
      body += `<tr style="background:var(--green-soft)"><td colspan="3"><b>${esc(r.name)}</b> — ${F2(sum)} ج</td></tr>`;
      rows.forEach(x => { body += `<tr><td>${esc(x.date)}</td>
        <td style="white-space:normal">${esc(x[fld] || x.reason || '')}${x.kind ? ' — ' + esc(x.kind) : ''}</td>
        <td class="num">${F2(x.amount)}</td></tr>`; });
    });
    if (!body) body = '<tr><td colspan="3">مفيش تفاصيل — انشر تاني بعد آخر تحديث للتطبيق عشان التفاصيل تتخزن.</td></tr>';
    else body += `<tr><td></td><td><b>الإجمالي</b></td><td class="num"><b>${F2(tot)}</b></td></tr>`;
    return { title: { pen:'الجزاءات الإدارية', adv:'المسحوبات', bon:'الحوافز' }[kind], html: tbl(cols, body) };
  }

  if (kind.startsWith('s_')){
    const S = R.filter(r => r.sales);
    const pick = { s_net:['المبيعات', r => +r.sales.net || 0], s_inv:['عدد الفواتير', r => r.sales.invoices || 0],
      s_push:['قيمة البوشينج', r => +r.sales.pushValue || 0], s_comm:['عمولة البوشينج', r => +r.sales.pushComm || 0],
      s_cust:['نسبة تسجيل العميل', r => +r.sales.custPct || 0] }[kind];
    const pc = kind === 's_cust';
    const list = S.map(r => ({ n: r.name, c: r.code, v: pick[1](r) })).filter(x => x.v).sort(sortD);
    return { title: pick[0], html: tbl(['الكود','الاسم', pick[0]],
      list.map(x => `<tr><td>${esc(x.c)}</td><td>${esc(x.n)}</td>
        <td class="num"><b>${pc ? (x.v*100).toFixed(1) + '٪' : F2(x.v)}</b></td></tr>`).join('')) };
  }
  return null;
}

    $('ap0').innerHTML = '<p class="sub">جاري تحميل الكشوف المنشورة…</p>';
    try {
      const ps = await getDocs(collection(db, 'periods'));
      DASH.periods = []; ps.forEach(d => DASH.periods.push({ id: d.id, ...d.data() }));
      DASH.periods.sort((a,b) => a.id < b.id ? 1 : -1);
      const st = await getDocs(collection(db, 'staff'));
      DASH.staff = []; st.forEach(d => DASH.staff.push({ uid: d.id, ...d.data() }));
    } catch (e) { $('ap0').innerHTML = `<p class="err">مقدرتش أقرا البيانات: ${esc(e.code || e.message)}</p>`; return; }

  const net = S.reduce((a,r)=>a+(+r.sales.net||0),0), inv = S.reduce((a,r)=>a+(+r.sales.invoices||0),0);

  const comm = S.reduce((a,r)=>a+(+r.sales.pushComm||0),0), push = S.reduce((a,r)=>a+(+r.sales.pushValue||0),0);

      {label:'قيمة البوشينج', value:F(push)+' ج', sub: net ? pc(push/net)+' من المبيعات' : '', k:'s_push'},
      {label:'عمولة البوشينج', value:F(comm)+' ج', k:'s_comm'},
      {label:'تكلفة الأجور', value:(P.branchAll || net) ? pc(payNet/(P.branchAll || net)) : '—',

  const days = r.days || [];

  let br = (+r.basic ? R('الراتب الأساسي', F(r.basic) + ' ج') : '') + R('ساعات العمل الفعلية', HN(r.hours) + ' ساعة');

  const lateRows = days.filter(d => +d.lateDed || +d.earlyDed || d.exempt || d.late >= 16);
  const lateHtml = lateRows.length ? tbl(['اليوم','الميعاد','البصمة','تأخير','الحالة','الخصم'],
    lateRows.map(d => `<tr><td>${esc(d.date)} ${esc(d.dow)}</td><td class="num">${esc(d.tin)}</td>
      <td class="num">${esc(d.pin)}</td><td class="num">${d.late ? Math.round(d.late) + ' د' : '—'}</td>
      <td>${d.exempt ? '<span class="tag ok">معفى</span>' : (d.pct ? `<span class="tag late">${d.pct >= 0.5 ? 'نص يوم' : 'ربع يوم'}</span>` : '—')}</td>
      <td class="num">${(d.lateDed + d.earlyDed) ? F(d.lateDed + d.earlyDed) : '—'}</td></tr>`).join('')) : '';
  const daysHtml = tbl(['اليوم','الحالة','حضور','انصراف','ساعات','ملاحظة'],
    days.map(d => `<tr><td>${esc(d.date)} ${esc(d.dow)}</td><td>${esc(d.state)}</td>
      <td class="num">${esc(d.pin) || '—'}</td><td class="num">${esc(d.pout) || '—'}</td>
      <td class="num">${d.hours ? HN(d.hours) : '—'}</td>
      <td style="white-space:normal">${esc(d.note)}</td></tr>`).join(''));
  const salesHtml = r.sales ? `<div class="rows">
      ${R('عدد الفواتير', r.sales.invoices)}${R('صافي المبيعات', F(r.sales.net) + ' ج')}
      ${R('نسبته من مبيعات الفرع', ((r.sales.sharePct||0)*100).toFixed(1) + '٪')}
      ${R('وسيط قيمة الفاتورة', F(r.sales.medInv) + ' ج')}${R('مبيعات لكل ساعة', F(r.sales.perHour) + ' ج')}
      ${R('تسجيل اسم العميل', ((r.sales.custPct||0)*100).toFixed(1) + '٪')}
      ${R('قيمة البوشينج', F(r.sales.pushValue) + ' ج')}
      ${R('عمولة البوشينج', r.sales.commOK === false ? 'غير مستحق' : F(r.sales.pushComm) + ' ج')}
      ${r.sales.include && r.sales.score != null ? R('درجة التقييم', F(r.sales.score) + ' / 100', 'total') : ''}
    </div>` : '';

  box.innerHTML = `<div class="empcard">
    <div class="hdr"><div><h2 style="margin:0">${esc(r.name)}</h2>
      <p class="sub">كود ${esc(r.code)}${r.job ? ' — ' + esc(r.job) : ''}${r.hidden ? ' — كشف غير منشور' : ''}</p></div>
      <button class="sm ghost" onclick="drill('${esc(uid)}')">إغلاق</button></div>
    <div class="net"><div class="l">صافي المستحق</div><div class="v">${F(r.net)} ج</div></div>
    <div class="rows">${br}</div>
    ${sec('d_late_'+uid, 'التأخيرات والانصراف المبكر', lateRows.length, lateHtml)}
    ${sec('d_pen_'+uid, 'الجزاءات الإدارية', (r.penalties||[]).length,
       (r.penalties||[]).length ? money(r.penalties, [['اليوم','date'],['السبب','reason'],['القيمة','amount',1]]) : '')}
    ${sec('d_bon_'+uid, 'الحوافز', (r.bonuses||[]).length,
       (r.bonuses||[]).length ? money(r.bonuses, [['اليوم','date'],['البند','item'],['القيمة','amount',1]]) : '')}
    ${sec('d_adv_'+uid, 'المسحوبات', (r.advances||[]).length,
       (r.advances||[]).length ? money(r.advances, [['اليوم','date'],['البيان','item'],['المبلغ','amount',1]]) : '')}
    ${sec('d_sal_'+uid, 'المبيعات والتقييم', 0, salesHtml)}
    ${sec('d_day_'+uid, 'أيام الشهر', days.length, daysHtml)}
  </div>`;
  box.scrollIntoView({ behavior:'smooth', block:'start' });
};
