<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<title>تتبع المندوب — صيدلية د. أنس نحيلة</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;display:flex;justify-content:center}
.box{width:100%;max-width:440px;padding:18px 16px 40px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:#475569;font-size:14px;margin:0 0 14px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.08);margin-bottom:14px}
label{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
select,input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;min-height:48px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:52px;font-weight:800;font-size:18px;width:100%}
.go{background:#0f766e;color:#fff}
.stop{background:#dc2626;color:#fff}
.big{min-height:84px;font-size:24px}
.ghost{background:#e2e8f0;color:#0f172a;min-height:44px;font-size:15px;margin-top:10px}
.st{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:#94a3b8;flex:none}
.dot.on{background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:p 1.6s infinite}
.dot.warn{background:#f59e0b}.dot.bad{background:#dc2626}
@keyframes p{70%{box-shadow:0 0 0 12px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.hint{font-size:13px;color:#475569;line-height:1.7;margin:10px 0 0}
.err{color:#dc2626;font-size:14px;font-weight:700;margin-top:8px;min-height:18px}
.hide{display:none!important}
.meta{font-size:13px;color:#475569;margin-top:6px}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
</style>
</head>
<body>
<div class="box">
  <h1>📍 تتبع موقع المندوب</h1>
  <p class="sub">صيدلية د. أنس نحيلة</p>

  <!-- تسجيل الدخول (مرة واحدة على الموبايل) -->
  <div class="card hide" id="loginC">
    <label for="pw">الرقم السري لحساب الدليفري</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="الرقم السري">
    <button class="go" id="loginB" style="margin-top:12px">دخول</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- شاشة المندوب -->
  <div id="mainC" class="hide">
    <div class="card">
      <label for="drv">انت مين؟</label>
      <select id="drv"></select>
    </div>
    <div class="card">
      <div class="st"><span class="dot" id="dot"></span><span id="stTxt">التتبع مقفول</span></div>
      <div class="meta" id="meta"></div>
      <button class="go big" id="tog" style="margin-top:14px">▶ تشغيل التتبع</button>
      <div class="err" id="err"></div>
      <p class="hint">• لما تشغّل التتبع الصيدلية بتشوف مكانك على الخريطة أثناء التوصيل.<br>
      • سيب الشاشة مفتوحة على الصفحة دي (بنمنع الموبايل من القفل). لو قفلت الشاشة أو خرجت من المتصفح الإشارة بتقف.<br>
      • خلّص شغلك؟ دوس «إيقاف التتبع».</p>
    </div>
    <button class="ghost" id="outB">تسجيل خروج من الحساب</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// نفس إعدادات مشروع المرتبات (pharmacy-payroll) — مفتاح الويب ده عام بطبيعته (الحماية في قواعد Firestore)
const CFG = { apiKey: "AIzaSyCRumjMVIdmhgkQdFU35a4EDineIIjgfWE", authDomain: "pharmacy-payroll.firebaseapp.com", projectId: "pharmacy-payroll",
  storageBucket: "pharmacy-payroll.firebasestorage.app", messagingSenderId: "7198071549", appId: "1:7198071549:web:5068830994e6b073747c94" };
const EMAIL = 'delivery@anaspharmacy.com';
const SEND_EVERY = 20e3, HEARTBEAT = 30e3, MIN_MOVE = 30;   // ثانية بين كل إرسالين · نبضة لو واقف · أقل مسافة (متر) تعدّي الفاصل

const $ = id => document.getElementById(id);
const app = initializeApp(CFG), auth = getAuth(app), db = getFirestore(app);
let DRIVERS = [], ENABLED = true, WATCH = null, HB = null, WL = null, LAST = null, LASTSENT = 0, ON = false, SENT = 0;

const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
const load = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const docId = n => String(n).replace(/[\/\s.]+/g, '_');
const dist = (a, b) => { const R = 6371000, r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dg = r(b.lng - a.lng);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

function ui() {
  const t = $('tog'), d = $('dot'), s = $('stTxt');
  if (!ENABLED) { d.className = 'dot bad'; s.textContent = 'التتبع متوقف من الإدارة'; t.disabled = true; t.className = 'go big'; t.textContent = '⛔ متوقف'; t.style.opacity = .5; return; }
  t.disabled = false; t.style.opacity = 1;
  t.className = (ON ? 'stop' : 'go') + ' big'; t.textContent = ON ? '⏹ إيقاف التتبع' : '▶ تشغيل التتبع';
  d.className = 'dot' + (ON ? (LAST ? ' on' : ' warn') : ''); s.textContent = ON ? (LAST ? 'التتبع شغال — مكانك بيوصل للصيدلية' : 'بدوّر على الموقع…') : 'التتبع مقفول';
  $('meta').textContent = ON && LAST ? `دقة الموقع ~${Math.round(LAST.acc)} م · اتبعت ${SENT} مرة` : '';
}
const err = m => { $('err').textContent = m || ''; };
const driverName = () => $('drv').value;

async function push(on) {
  const name = driverName(); if (!name) return;
  const data = on && LAST ? { name, on: true, lat: LAST.lat, lng: LAST.lng, acc: Math.round(LAST.acc || 0), spd: LAST.spd == null ? null : Math.round(LAST.spd * 3.6), at: serverTimestamp() }
                          : { name, on: false, at: serverTimestamp() };
  await setDoc(doc(db, 'deliv_loc', docId(name)), data);
  if (on) { SENT++; LASTSENT = Date.now(); ui(); }
}
async function tryPush() { try { await push(true); err(''); } catch (e) { err('مقدرتش أبعت الموقع: ' + (e.code || e.message)); } }

function onPos(p) {
  const c = p.coords, prev = LAST;
  LAST = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, spd: c.speed };
  const dt = Date.now() - LASTSENT;
  if (!prev || dt >= SEND_EVERY && dist(prev, LAST) >= MIN_MOVE || dt >= HEARTBEAT) tryPush(); else ui();
}
function onPosErr(e) {
  const m = { 1: 'المتصفح رافض إذن الموقع. افتح إعدادات الموقع للمتصفح وسمح بـ «الموقع» لصفحة التتبع ثم جرّب تاني.', 2: 'مش قادر أحدد الموقع — شغّل GPS في الموبايل.', 3: 'تحديد الموقع اتأخر — اتأكد إن GPS شغال.' }[e.code] || e.message;
  err(m); if (e.code === 1) stop(true);
}
async function wake() { try { if ('wakeLock' in navigator && ON) WL = await navigator.wakeLock.request('screen'); } catch (e) { } }

async function start() {
  if (!ENABLED) return;
  if (!driverName()) { err('اختار اسمك الأول'); return; }
  if (!('geolocation' in navigator)) { err('المتصفح ده مش بيدعم تحديد الموقع'); return; }
  err(''); ON = true; save('trk_on', '1'); save('trk_drv', driverName()); LAST = null; SENT = 0; LASTSENT = 0; ui();
  WATCH = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 });
  HB = setInterval(() => { if (ON && LAST && Date.now() - LASTSENT >= HEARTBEAT) tryPush(); }, 5000);   // نبضة لو واقف ومفيش موقع جديد
  wake();
}
async function stop(silent) {
  ON = false; save('trk_on', ''); LAST = null;
  if (WATCH != null) navigator.geolocation.clearWatch(WATCH); WATCH = null; clearInterval(HB); HB = null;
  try { if (WL) await WL.release(); } catch (e) { } WL = null;
  ui();
  try { await push(false); } catch (e) { if (!silent) err('الإيقاف اتسجل على الموبايل بس: ' + (e.code || e.message)); }
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && ON) wake(); });
$('tog').onclick = () => (ON ? stop() : start());
$('drv').onchange = () => { if (ON) stop(true); save('trk_drv', driverName()); };
$('outB').onclick = async () => { if (ON) await stop(true); signOut(auth); };
$('loginB').onclick = async () => {
  $('loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, EMAIL, $('pw').value); }
  catch (e) { $('loginErr').textContent = 'الرقم السري غلط أو مفيش نت'; }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginB').click(); });

let SUBS = [];
onAuthStateChanged(auth, async user => {
  SUBS.forEach(u => u()); SUBS = [];
  $('loginC').classList.toggle('hide', !!user); $('mainC').classList.toggle('hide', !user);
  if (!user) return;
  try { if (!(await getDoc(doc(db, 'deliverydevs', user.uid))).exists()) { $('loginC').classList.remove('hide'); $('mainC').classList.add('hide'); $('loginErr').textContent = 'الحساب ده مش حساب الدليفري'; signOut(auth); return; } } catch (e) { }
  SUBS.push(onSnapshot(collection(db, 'deliv_drivers'), s => {
    DRIVERS = s.docs.map(d => d.data().name).filter(Boolean).sort((a, b) => a.localeCompare(b, 'ar'));
    const cur = driverName() || load('trk_drv');
    $('drv').innerHTML = '<option value="">-- اختار اسمك --</option>' + DRIVERS.map(n => `<option ${n === cur ? 'selected' : ''}>${n.replace(/[<>&]/g, '')}</option>`).join('');
    if (load('trk_on') && !ON && driverName()) start();   // رجوع الصفحة بعد ريفريش: كمّل لو كان شغال
  }, e => err('قايمة المناديب: ' + (e.code || e.message))));
  SUBS.push(onSnapshot(doc(db, 'deliv_cfg', 'track'), s => {
    const was = ENABLED; ENABLED = !s.exists() || s.data().enabled !== false; ui();
    if (was && !ENABLED && ON) stop(true);
  }, () => { }));
});
ui();
</script>
</body>
</html>
